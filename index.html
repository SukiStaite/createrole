/* ===== 搭角色 V4.0 网页样式 ===== */
:root {
  --bg: #f7f3ef;
  --bg-grad: linear-gradient(160deg, #fdf6f0 0%, #f3ecf7 50%, #eef3fb 100%);
  --card: #ffffff;

  --radius: 14px;

}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg-grad);
  background-attachment: fixed;
  color: var(--text);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

/* ===== 顶部栏 ===== */
.app-header {
  background: rgba(255,255,255,.82);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--card-border);
  position: sticky;
  top: 0;

}
.header-inner {
  max-width: 1080px;
  margin: 0 auto;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.logo { display: flex; align-items: center; gap: 12px; }
.logo-icon {
  font-size: 30px;
  width: 48px; height: 48px;
  display: flex; align-items: center; justify-content: center;
  background: var(--primary-light);
  border-radius: 14px;
}
.logo-text h1 { font-size: 20px; font-weight: 800; letter-spacing: .5px; }
.logo-text .ver {
  font-size: 11px; font-weight: 700;
  color: #fff; background: var(--primary);
  padding: 2px 8px; border-radius: 20px;
  vertical-align: middle; margin-left: 4px;
}
.logo-text .subtitle { font-size: 12px; color: var(--text-soft); margin-top: 1px; }

.header-right { display: flex; align-items: center; gap: 12px; }
.progress-ring {
  width: 40px; height: 40px; border-radius: 50%;
  background: conic-gradient(var(--primary) 0deg, var(--primary-light) 0deg);
  display: flex; align-items: center; justify-content: center;
}
.progress-ring::after {
  content: ""; width: 30px; height: 30px; background: #fff; border-radius: 50%;
}
.progress-info { display: flex; flex-direction: column; }
.progress-info #progress-text { font-size: 16px; font-weight: 700; color: var(--primary-dark); }
.progress-info .progress-sub { font-size: 11px; color: var(--text-soft); }

/* ===== 主内容 ===== */
.app-main {
  max-width: 1080px;
  margin: 0 auto;
  padding: 26px 20px 90px;
}
#app { min-height: 60vh; }

/* ===== 卡片 ===== */
.card {
  background: var(--card);

.welcome-hero {

}

}

.welcome-features {

}
.feature {

}
.feature .f-icon { font-size: 24px; margin-bottom: 8px; }
.feature .f-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
.feature .f-desc { font-size: 12px; color: var(--text-soft); }

/* ===== 表单 ===== */
.form-group { margin-bottom: 22px; }
.form-label {
  display: flex; align-items: center; gap: 6px;
  font-weight: 700; font-size: 15px;
  margin-bottom: 4px;
}
.form-label .step-num {
  font-size: 11px; font-weight: 700;
  background: var(--primary); color: #fff;
  width: 20px; height: 20px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
}
.form-label .req { color: var(--danger); }
.form-hint { font-size: 12px; color: var(--text-soft); margin-bottom: 10px; }

.opt-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px;
}
.opt-item {
  position: relative;
}
.opt-item input[type="radio"],
.opt-item input[type="checkbox"] {

}
.opt-label {

  text-align: center;

}
.opt-label:hover { border-color: var(--primary); }
.opt-item input:checked + .opt-label {
  border-color: var(--primary);
  background: var(--primary-light);
  color: var(--primary-dark);
}
.opt-label .opt-tag {
  font-size: 10px; margin-left: 5px;

  padding: 1px 6px; border-radius: 10px;
}

/* 自由填写框 */
.custom-input-wrap { margin-top: 10px; }
.custom-input {

  transition: border-color .15s;
}
.custom-input:focus { outline: none; border-color: var(--primary); border-style: solid; }
.custom-input::placeholder { color: var(--text-faint); }

/* ===== 题目卡片 ===== */
.question-card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 22px 24px;
  margin-bottom: 16px;
}
.q-header {
  display: flex; align-items: flex-start; gap: 10px;
  margin-bottom: 10px;
}
.q-num {
  font-size: 13px; font-weight: 800;
  color: #fff;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  padding: 4px 11px; border-radius: 16px;
  white-space: nowrap; flex-shrink: 0;
}
.q-layer-tag {
  font-size: 11px; font-weight: 600;
  padding: 3px 9px; border-radius: 12px;
  white-space: nowrap;
}
.q-layer-tag.SFW { background: var(--success-light); color: var(--success); }
.q-layer-tag.NSFW { background: var(--danger-light); color: var(--danger); }
.q-layer-tag.DLC { background: var(--accent-light); color: var(--accent); }
.q-layer-tag.体系登记 { background: var(--warn-light); color: var(--warn); }
.q-layer-tag.补完 { background: var(--primary-light); color: var(--primary-dark); }

.q-title { font-size: 16px; font-weight: 700; line-height: 1.5; }
.q-parse {

  background: #faf6f3;
  border-left: 3px solid var(--primary-light);
  padding: 10px 14px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  margin-bottom: 14px;
}
.q-parse .parse-label { font-weight: 700; color: var(--primary); margin-right: 6px; }

.q-options { margin-bottom: 8px; }
.q-options .opts-title {
  font-size: 12px; color: var(--text-soft); font-weight: 600; margin-bottom: 8px;
}

/* 答案展示 */
.q-answer {
  margin-top: 12px;
  padding: 12px 14px;
  background: var(--success-light);
  border-radius: var(--radius-sm);
  font-size: 14px;

  font-weight: 600;
}
.q-answer .edit-btn {
  float: right;
  font-size: 12px;
  color: var(--primary);
  cursor: pointer;
  font-weight: 600;
}

/* 多选标签 */
.multi-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
.multi-chip {
  padding: 7px 14px;
  border: 1.5px solid var(--card-border);
  border-radius: 20px;
  font-size: 13px;
  cursor: pointer;
  user-select: none;
  background: #fff;
  transition: all .12s;
}
.multi-chip:hover { border-color: var(--primary); }
.multi-chip.active {
  background: var(--primary-light);
  border-color: var(--primary);
  color: var(--primary-dark);
  font-weight: 600;
}

/* ===== 按钮通用 ===== */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 10px 22px;
  border-radius: 24px;
  font-size: 14px; font-weight: 600;
  border: 1.5px solid transparent;
  cursor: pointer;
  transition: all .15s;
  font-family: var(--font);
}
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: #fff;
}
.btn-primary:not(:disabled):hover { transform: translateY(-1px); box-shadow: var(--shadow-hover); }
.btn-ghost { background: #fff; color: var(--text-soft); border-color: var(--card-border); }
.btn-ghost:not(:disabled):hover { border-color: var(--primary); color: var(--primary); }
.btn-soft { background: var(--primary-light); color: var(--primary-dark); }
.btn-soft:not(:disabled):hover { background: #f2d5e2; }
.btn-danger { background: var(--danger-light); color: var(--danger); }
.btn-danger:not(:disabled):hover { background: #f2d2d2; }
.btn-success { background: var(--success-light); color: var(--success); }

.btn-row {
  display: flex; gap: 12px; flex-wrap: wrap;
  justify-content: flex-end;
  margin-top: 20px;
}
.btn-row.left { justify-content: flex-start; }

/* ===== 进度条 ===== */
.bar-track {
  height: 10px;
  background: var(--primary-light);
  border-radius: 10px;
  overflow: hidden;
  margin: 10px 0;
}
.bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  border-radius: 10px;
  transition: width .4s ease;
}

/* ===== 统计 ===== */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 12px;
  margin: 14px 0;
}
.stat-box {
  background: #fbf8f6;
  border: 1px solid var(--card-border);
  border-radius: var(--radius-sm);
  padding: 14px;
  text-align: center;
}
.stat-box .stat-num { font-size: 26px; font-weight: 900; color: var(--primary); }
.stat-box .stat-label { font-size: 12px; color: var(--text-soft); }

/* ===== 档案展示 ===== */
.archive-block { margin-bottom: 18px; }
.archive-block .ab-title {
  font-size: 15px; font-weight: 800;
  color: var(--primary-dark);
  border-bottom: 2px solid var(--primary-light);
  padding-bottom: 6px; margin-bottom: 12px;
}
.archive-table { width: 100%; border-collapse: collapse; }
.archive-table td {
  padding: 7px 10px;
  font-size: 13.5px;
  border-bottom: 1px solid #f5efe9;
  vertical-align: top;
}
.archive-table td.k {
  width: 30%;
  font-weight: 600; color: var(--text-soft);
  white-space: normal;
}
.archive-table td.v { color: var(--text); }

/* ===== 检查清单 ===== */
.check-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px 16px;
  border: 1px solid var(--card-border);
  border-radius: var(--radius-sm);
  margin-bottom: 10px;
  background: #fff;
}
.check-item .check-box {
  width: 24px; height: 24px; border-radius: 50%;
  border: 2px solid var(--card-border);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  font-size: 13px; color: #fff;
  transition: all .15s;
  margin-top: 2px;
}
.check-item.pass .check-box { background: var(--success); border-color: var(--success); }
.check-item.fail .check-box { background: var(--danger); border-color: var(--danger); }
.check-item .check-content { flex: 1; }
.check-item .check-title { font-weight: 700; font-size: 14px; }
.check-item .check-desc { font-size: 12.5px; color: var(--text-soft); margin-top: 2px; }
.check-item.fail .check-title { color: var(--danger); }
.check-item .check-reason {
  font-size: 12px; color: var(--text-soft);
  background: #faf6f3; border-left: 3px solid var(--primary-light);
  padding: 6px 10px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  margin-top: 6px;
}
.check-item.fail .check-reason { background: var(--danger-light); border-left-color: var(--danger); color: var(--danger); }
.check-item.pass .check-reason { background: var(--success-light); border-left-color: var(--success); color: var(--success); }
.check-item.manual .check-box { background: var(--warn); border-color: var(--warn); }

/* ===== 登记流水 ===== */
.register-item {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 16px;
  border: 1px solid var(--card-border);
  border-radius: var(--radius-sm);
  margin-bottom: 9px;
  background: #fff;
}
.register-item .r-check {
  width: 22px; height: 22px; border-radius: 6px;
  border: 2px solid var(--card-border);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 13px;
  cursor: pointer;
}
.register-item.done .r-check { background: var(--success); border-color: var(--success); }
.register-item .r-title { font-weight: 700; font-size: 14px; }
.register-item .r-sub { font-size: 12px; color: var(--text-soft); }
.register-item.done .r-title { color: var(--success); }

/* ===== 测试模式 ===== */
.test-scene {
  border: 1.5px solid var(--card-border);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: all .15s;
  background: #fff;
}
.test-scene:hover { border-color: var(--primary); box-shadow: var(--shadow); }
.test-scene.selected { border-color: var(--primary); background: var(--primary-light); }
.test-scene .ts-icon { font-size: 26px; margin-bottom: 6px; }
.test-scene .ts-title { font-weight: 800; font-size: 16px; }
.test-scene .ts-desc { font-size: 13px; color: var(--text-soft); }

.chat-box {

  border-radius: var(--radius);
  padding: 18px;
  max-height: 420px;
  overflow-y: auto;
  margin-bottom: 14px;
}
.chat-msg { display: flex; margin-bottom: 12px; }
.chat-msg .avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; flex-shrink: 0; margin-right: 10px;
}
.chat-msg.user .avatar { background: linear-gradient(135deg, #8ab, var(--accent)); }
.chat-msg .bubble {
  background: #fff; border-radius: 12px;
  padding: 10px 14px; font-size: 14px;
  max-width: 78%;
  box-shadow: 0 1px 4px rgba(0,0,0,.05);
  white-space: pre-wrap;
}
.chat-msg.user { flex-direction: row-reverse; }
.chat-msg.user .avatar { margin-right: 0; margin-left: 10px; }
.chat-msg.user .bubble { background: var(--primary-light); }

/* ===== Toast ===== */
.toast-container {
  position: fixed; bottom: 90px; left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  display: flex; flex-direction: column; gap: 8px;
  align-items: center;
}
.toast {
  background: rgba(50, 42, 55, .92);
  color: #fff;
  padding: 11px 22px;
  border-radius: 24px;
  font-size: 13.5px;
  box-shadow: var(--shadow);
  animation: toast-in .25s ease;
  max-width: 90vw;
}
.toast.success { background: rgba(76, 154, 106, .94); }
.toast.error { background: rgba(192, 90, 90, .94); }
@keyframes toast-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

/* ===== 弹窗 ===== */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(40, 32, 45, .45);
  backdrop-filter: blur(4px);
  z-index: 500;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.modal {
  background: #fff; border-radius: var(--radius);
  width: 100%; max-width: 520px;
  max-height: 85vh;
  display: flex; flex-direction: column;
  box-shadow: 0 20px 60px rgba(0,0,0,.2);
}
.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--card-border);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-header h3 { font-size: 16px; }
.modal-close {
  border: none; background: none; font-size: 24px;
  color: var(--text-soft); cursor: pointer; line-height: 1;
}
.modal-close:hover { color: var(--primary); }
.modal-body { padding: 18px 20px; overflow-y: auto; font-size: 14px; }
.modal-footer { padding: 14px 20px; border-top: 1px solid var(--card-border); display: flex; justify-content: flex-end; gap: 10px; }

/* ===== 底部导航 ===== */
.app-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(255,255,255,.92);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--card-border);
  display: flex; justify-content: center; gap: 6px;
  padding: 10px 12px;
  z-index: 200;
  overflow-x: auto;
}
.nav-btn {
  border: none; background: none;
  font-size: 12.5px; font-weight: 700;
  color: var(--text-faint);
  padding: 8px 13px;
  border-radius: 20px;
  cursor: pointer;
  white-space: nowrap;
  transition: all .15s;
  font-family: var(--font);
}
.nav-btn:not(:disabled):hover { background: var(--primary-light); color: var(--primary-dark); }
.nav-btn.active { background: var(--primary); color: #fff; }
.nav-btn:disabled { opacity: .55; cursor: not-allowed; }

/* ===== 杂项 ===== */
.hidden { display: none !important; }
.mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; } .mt-20 { margin-top: 20px; }
.mb-8 { margin-bottom: 8px; } .mb-12 { margin-bottom: 12px; } .mb-16 { margin-bottom: 16px; }
.text-soft { color: var(--text-soft); } .text-small { font-size: 12.5px; }
.text-center { text-align: center; }
.fw-700 { font-weight: 700; }

.divider { height: 1px; background: var(--card-border); margin: 18px 0; }

/* ===== 可访问性与稳定性 ===== */
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.btn, .btn-big, .opt-label, .nav-btn, .check-box, .r-check, .test-scene, .multi-chip, .modal-close {
  min-height: 44px;
}
.opt-label { min-height: 44px; }
.q-title { overflow-wrap: anywhere; }
.archive-table td.v { overflow-wrap: anywhere; }

 * 搭角色 V4.1 · engine.js · 纯业务逻辑（无 DOM，可 node 测试）

 *   - 分层随机抽题（核心题强制纳入 → 档案零留空）
 *   - 档案组装（声明式模板驱动）
 *   - 14 条世界观检查自动校验

(function (root, factory) {
  if (typeof module !== 'undefined' && module.exports) module.exports = factory(
    require('./config.js'), require('./schema.js')
  );
  else { root.AIRA = root.AIRA || {}; Object.assign(root.AIRA, factory(root.AIRA, root.AIRA)); }
})(typeof self !== 'undefined' ? self : this, function (CONFIG, SCHEMA) {

  const { VOLUME_MAP, CUSTOM_RATIO, LAYER_INFO } = CONFIG;

  /* ---------- 洗牌（Fisher-Yates，可注入 rng 便于测试） ---------- */
  function shuffle(arr, rng) {
    const a = arr.slice();
    const r = rng || Math.random;
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;

     NSFW 层：仅非 SFW 向可问；
     DLC 双性配置（cat 含「双性配置」）：仅 dlc9=是 且 非 SFW 向可问；
     其余（SFW / DLC 种族·世界观·能力 / 体系登记 / 补完）始终可问。 */
  function isEligible(q, meta) {
    const m = meta || {};
    if (q.layer === 'NSFW') return m.orientation !== 'SFW';
    if (q.layer === 'DLC') {
      const isFuta = (q.cat && String(q.cat).includes('双性配置'));
      if (isFuta) return m.dlc9 === '是' && m.orientation !== 'SFW';
      return true;

  function getLayerQuota(meta) {
    const m = meta || {};
    let sfw = 0, nsfw = 0, dlc = 0;
    const vol = Number(m.volume) || 240;
    if (VOLUME_MAP[vol]) {
      ({ sfw, nsfw, dlc } = VOLUME_MAP[vol]);
    } else {
      const total = Math.min(CONFIG.TOTAL_QUESTIONS, Math.max(10, vol));
      sfw = Math.round(total * CUSTOM_RATIO.sfw);
      nsfw = Math.round(total * CUSTOM_RATIO.nsfw);
      dlc = Math.round(total * CUSTOM_RATIO.dlc);
    }
    if (m.dlc9 === '否') { nsfw += dlc; dlc = 0; }

    if (m.orientation === 'SFW') { sfw += nsfw; nsfw = 0; }

  /* 每层：核心题（档案引用）强制纳入；再从非核心随机补到 max(配额, 核心数)。
     体系登记 / 补完层为必答全问。返回按层分组、层内按 id 升序的 plan。 */
  function buildPlan(meta, questions, rng) {
    const m = meta || {};
    const qs = questions || [];

      { name: 'SFW', target: quota.sfw },
      { name: 'NSFW', target: quota.nsfw },
      { name: 'DLC', target: quota.dlc },
      { name: '体系登记', target: Infinity },

      const pool = qs.filter(q => q.layer === L.name && isEligible(q, m));

      const need = L.target === Infinity ? rest.length : Math.max(0, L.target - core.length);
      const extra = shuffle(rest, rng).slice(0, need);
      const block = core.concat(extra).sort((a, b) => a.id - b.id);
      block.forEach(q => {
        plan.push({
          qid: q.id, layer: q.layer, cat: q.cat, title: q.title,
          parse: q.parse, options: q.options || [], required: !!q.required,
        });
      });
    });
    return plan;
  }

  /* ---------- 进度统计 ---------- */
  function countProgress(plan, answers) {
    const total = plan.length;
    const done = plan.filter(p => hasAnswer(answers[p.qid])).length;
    const layerStats = {};
    plan.forEach(p => {
      layerStats[p.layer] = layerStats[p.layer] || { total: 0, done: 0 };
      layerStats[p.layer].total++;
      if (hasAnswer(answers[p.qid])) layerStats[p.layer].done++;
    });
    return { total, done, remaining: total - done, layerStats };
  }

  /* ---------- 档案组装（零留空） ---------- */
  function buildArchive(meta, answers, questions) {
    const m = meta || {};
    const ans = answers || {};
    const byId = new Map((questions || []).map(q => [q.id, q]));
    const get = (id) => {
      const v = ans[id];
      return hasAnswer(v) ? String(v).trim() : DASH;
    };
    const name = hasAnswer(ans[1]) ? String(ans[1]).trim() : '未命名';

    const sections = [];
    ARCHIVE_SCHEMA.forEach(sec => {
      if (sec.when && !sec.when(m)) return;   // 区块级条件（如 SFW 向隐藏 NSFW）
      const rows = [];
      sec.rows.forEach(row => {
        if (row.when && !row.when(m)) return; // 行级条件（DLC9特化 / 形态切换）
        const val = row.get(get);
        rows.push({ label: row.label, value: val });
      });
      sections.push({ title: sec.title, rows });
    });

    const coreVal = CORE_FIELD.get(get);
    return { meta: { ...m }, name, sections, core: coreVal };
  }

  /* ---------- 14 条自动校验 ---------- */
  function runChecks(meta, answers, extra) {
    const m = meta || {};
    const a = answers || {};
    const ctx = { meta: m, answers: a, registers: (extra && extra.registers) || {}, REGISTER_LIST };
    return CHECK_LIST.map(c => {
      let result;
      try { result = c.auto(m, a, ctx) || { status: 'manual', reason: '' }; }
      catch (e) { result = { status: 'manual', reason: '校验异常：' + e.message }; }
      return { id: c.id, title: c.title, desc: c.desc, status: result.status, reason: result.reason };
    });
  }

  /* ---------- 登记值速览 ---------- */
  function registerPreview(answers) {
    const get = (id) => { const v = answers[id]; return hasAnswer(v) ? String(v).trim() : DASH; };
    return [
      ['发情期日期段', get(568), '第三十一章'],
      ['初夜状态', get(580), '第四十七章'],
      ['好感度起点', get(582), '第三十八章'],
      ['AL 系数', get(566), '第四十四章'],
      ['称呼体系', get(591), '第二十七章'],
      ['作息类型', get(570), '第四十二章'],
      ['身体数据', `${get(251)} / ${get(256)}`, '第三十三章'],
      ['微信档案', get(571), '第四十三章'],
    ];
  }

  /* ---------- markdown 导出 ---------- */
  function archiveToMarkdown(archive, meta) {
    const m = meta || {};
    const md = [];
    md.push(`# 角色档案 · ${archive.name}（V4.2 全字段版 · 精细度对标林晴祈）`);
    md.push('');
    md.push(`> 生成时间：${new Date().toLocaleString('zh-CN')} ｜ 工具：搭角色 V4.2 ｜ 题量：${m.volume || 240} 题`);
    md.push('');
    archive.sections.forEach(sec => {
      md.push(`## ${sec.title}`);
      md.push('');
      sec.rows.forEach(r => {
        md.push(`- **${r.label}**：${r.value}`);
      });
      md.push('');
    });
    md.push(`## ${CORE_FIELD.label}`);
    md.push('');
    md.push(`> ${archive.core}`);
    md.push('');
    md.push('---');
    md.push('## 体系登记流水');
    md.push('');
    md.push('- [ ] 发情期表（第三十一章）');
    md.push('- [ ] 初夜档案室（第四十七章）');
    md.push('- [ ] 好感度表（第三十八章）');
    md.push('- [ ] 身体数据总表（第三十三章）');
    md.push('- [ ] 称呼表（第二十七章）');
    md.push('- [ ] 微信档案（第四十三章）');
    md.push('- [ ] 作息矩阵（第四十二章）');
    md.push('- [ ] 关系矩阵（第三十二章）');
    md.push('- [ ] 亲密空间（第四十章，如有）');
    return md.join('\n');
  }

  /* ---------- 元信息默认值 ---------- */
  function defaultMeta() {
    return {
      gender: null, volume: 240, volumeCustom: '', orientation: null,
      dlc9: null, race: null, raceMulti: false, strictNaming: true,
    };
  }

  /* ---------- SillyTavern 角色卡导出（V2 / V3） ----------
   * 返回角色卡对象（JSON.stringify 前无需其他处理）。
   * opts.version: 2 或 3
   */
  function archiveToSillyTavern(archive, meta, opts) {
    const o = opts || {};
    const v = o.version === 3 ? 3 : 2;
    const md = archiveToMarkdown(archive, meta || {});
    const m = meta || {};
    const name = archive.name || '新角色';
    // 从性格层提取 personality（取"性格"相关行，无则用核心）
    let personality = archive.core || '';
    const charSec = archive.sections.find(s => /性格/.test(s.title));
    if (charSec) {
      const lines = charSec.rows.slice(0, 5).map(r => `${r.label}：${r.value}`);
      personality = lines.join('\n');
    }
    const data = {
      name,
      description: md,
      personality: personality,
      scenario: m.orientation || '',
      first_mes: `「早上好呀，辞宝…」${name}揉着眼睛，声音带着刚醒的软糯。今天也要一起度过呀。`,
      mes_example: `<START>\n{{char}}：辞宝，你今天心情怎么样呀？`,
      creator_notes: `由搭角色 V${CONFIG.VERSION} 生成 ｜ 性别：${m.gender || '-'} ｜ 题量：${m.volume || '-'} ｜ 什么向：${m.orientation || '-'} ｜ DLC9：${m.dlc9 || '-'} ｜ 种族：${m.race || '-'}`,
      system_prompt: '你是一个温柔、黏人、占有欲很强的女孩子（祈宝系角色）。请始终以第一人称、口语化、有亲密感的方式回应。',
      post_history_instructions: '',
      alternate_greetings: [],
      tags: ['搭角色', 'AIRA', 'RP'],
      creator: 'AIRA · 搭角色',
      character_version: CONFIG.VERSION,
      extensions: {},
    };
    if (v === 3) {
      return {
        spec: 'chara_card_v3',
        spec_version: '3.0',
        data: Object.assign({}, data, { group_only_greetings: [] }),
      };
    }
    return { spec: 'chara_card_v2', spec_version: '2.0', data };
  }

  /* ---------- 完整 JSON 档案导出（便于二次编辑/导入） ---------- */
  function archiveToJSON(archive, state) {
    const s = state || {};
    return {
      format: 'aira-archive',
      version: CONFIG.VERSION,
      exportedAt: new Date().toISOString(),
      meta: archive.meta || {},
      name: archive.name,
      core: archive.core,
      sections: archive.sections,
      answers: s.answers || {},
      checks: s.checks || {},
      registers: s.registers || {},
    };
  }

  return {
    shuffle, getLayerQuota, buildPlan, countProgress, isEligible,
    buildArchive, runChecks, registerPreview, archiveToMarkdown,
    archiveToSillyTavern, archiveToJSON, defaultMeta,
    LAYER_INFO,
  };
});

<script>
/* ============================================================
 * 搭角色 V4.2 · storage.js · localStorage 持久化 + 版本迁移 + 记忆快照
 * 浏览器端使用 localStorage；node 测试可注入 mock storage。
 * ============================================================ */
(function (root, factory) {
  if (typeof module !== 'undefined' && module.exports) module.exports = factory(
    require('./config.js')
  );
  else { root.AIRA = root.AIRA || {}; Object.assign(root.AIRA, factory(root.AIRA)); }
})(typeof self !== 'undefined' ? self : this, function (CONFIG) {
  'use strict';

  const KEY = CONFIG.STORAGE_KEY;
  const MKEY = CONFIG.MEMORY_KEY;
  const OLD_KEY = 'aira_dajuese_v41';
  const VERSION = CONFIG.VERSION;

  /* 默认 State（用于迁移补齐缺失字段） */
  function defaultState() {
    return {
      version: VERSION,
      meta: { gender: null, volume: 240, volumeCustom: '', orientation: null, dlc9: null, race: null, raceMulti: false, strictNaming: true },
      askMode: null, batchSize: 5,
      plan: [], currentIndex: 0, answers: {},
      stage: 'welcome', generatedArchive: null,
      checks: {}, registers: {},
      testScene: null, testStarted: false, testMsgs: [],
      memoryFreq: CONFIG.DEFAULT_MEMORY_FREQ,   // 记忆自动弹窗频率（题数，0=关闭）
      memNotified: 0,                            // 已触发过自动提示的答题数（防重复）
      savedAt: null,
    };
  }

  /* 版本迁移（v41 → v42；未来版本在此扩展） */
  function migrate(data) {
    if (!data || typeof data !== 'object') return defaultState();
    const base = defaultState();
    const out = Object.assign({}, base, data);
    // 关键字段兜底
    out.meta = Object.assign({}, base.meta, data.meta || {});
    out.plan = Array.isArray(data.plan) ? data.plan : [];
    out.answers = (data.answers && typeof data.answers === 'object') ? data.answers : {};
    out.checks = (data.checks && typeof data.checks === 'object') ? data.checks : {};
    out.registers = (data.registers && typeof data.registers === 'object') ? data.registers : {};
    out.testMsgs = Array.isArray(data.testMsgs) ? data.testMsgs : [];
    out.memoryFreq = typeof data.memoryFreq === 'number' ? data.memoryFreq : CONFIG.DEFAULT_MEMORY_FREQ;
    out.memNotified = typeof data.memNotified === 'number' ? data.memNotified : 0;
    out.version = VERSION;
    return out;
  }

  /* 读取时若当前 key 无数据，尝试从旧版本 key 迁移 */
  function load(storage) {
    const st = storage || (typeof localStorage !== 'undefined' ? localStorage : null);
    if (!st) return null;
    try {
      let raw = st.getItem(KEY);
      let migratedFromOld = false;
      if (!raw) {
        raw = st.getItem(OLD_KEY);
        if (raw) {
          migratedFromOld = true;
          // 迁移后保留旧数据一份，不删除（用户可回退）
        }
      }
      if (!raw) return null;
      const data = migrate(JSON.parse(raw));
      if (migratedFromOld) {
        // 写入新 key，便于后续自动保存接管
        try { st.setItem(KEY, JSON.stringify(data)); } catch (e) { /* 忽略 */ }
      }
      return data;
    } catch (e) {
      return null;
    }
  }

  /* 保存：返回 {ok, error}，error ∈ 'quota' | 'unavailable' */
  function save(state, storage) {
    const st = storage || (typeof localStorage !== 'undefined' ? localStorage : null);
    if (!st) return { ok: false, error: 'unavailable' };
    try {
      const payload = Object.assign({}, state, { version: VERSION, savedAt: Date.now() });
      st.setItem(KEY, JSON.stringify(payload));
      return { ok: true };
    } catch (e) {
      // QuotaExceededError：存储满
      if (e && (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014)) {
        return { ok: false, error: 'quota' };
      }
      return { ok: false, error: 'unavailable' };
    }
  }

  function clear(storage) {
    const st = storage || (typeof localStorage !== 'undefined' ? localStorage : null);
    if (!st) return false;
    try { st.removeItem(KEY); return true; } catch (e) { return false; }
  }

  /* ===== 记忆快照 CRUD ===== */
  function loadMemories(storage) {
    const st = storage || (typeof localStorage !== 'undefined' ? localStorage : null);
    if (!st) return [];
    try {
      const raw = st.getItem(MKEY);
      if (!raw) return [];
      const arr = JSON.parse(raw);
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }

  function saveMemories(list, storage) {
    const st = storage || (typeof localStorage !== 'undefined' ? localStorage : null);
    if (!st) return { ok: false, error: 'unavailable' };
    try {
      st.setItem(MKEY, JSON.stringify(Array.isArray(list) ? list : []));
      return { ok: true };
    } catch (e) {
      if (e && (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014)) return { ok: false, error: 'quota' };
      return { ok: false, error: 'unavailable' };
    }
  }

  function addMemory(memory, storage) {
    const list = loadMemories(storage);
    list.unshift(memory);
    return saveMemories(list, storage);
  }

  function updateMemory(id, patch, storage) {
    const list = loadMemories(storage);
    const i = list.findIndex(m => m.id === id);
    if (i < 0) return { ok: false, error: 'notfound' };
    list[i] = Object.assign({}, list[i], patch);
    return saveMemories(list, storage);
  }

  function deleteMemory(id, storage) {
    const list = loadMemories(storage).filter(m => m.id !== id);
    return saveMemories(list, storage);
  }

  return {
    KEY, MKEY, OLD_KEY, VERSION, defaultState, migrate, load, save, clear,
    loadMemories, saveMemories, addMemory, updateMemory, deleteMemory,
  };
});

</script>

(function () {

    el.textContent = msg;

  /* 自动保存（防抖） */
  function scheduleSave() {
    clearTimeout(autosaveTimer);

  }
  let quotaWarned = false;
  function saveNow() {
    clearTimeout(autosaveTimer);
    const r = STORE.save(State);
    if (r && r.ok === false) {
      if (r.error === 'quota' && !quotaWarned) {
        quotaWarned = true;
        toast('⚠️ 本地存储空间不足，进度可能无法完整保存，请清理浏览器存储', 'error');

    if (State.stage !== lastPushedStage) {

      lastPushedStage = State.stage;

  /* ===== 欢迎页 ===== */

          <div class="opt-grid">${CONFIG.GENDER_OPTIONS.map(o => radio('gender', o, o, m.gender === o)).join('')}</div>
        </div>

        <div class="form-group">
          <div class="form-label"><span class="step-num">2</span> 题目体量</div>
          <div class="form-hint">题量越大，人格越深厚。120 速成，240 平衡推荐，300 精雕。体系登记与补完层必答不计入。</div>
          <div class="opt-grid">${CONFIG.VOLUME_OPTIONS.map(v => radio('volume', v, `${v} 题`, m.volume === v, v === 240 ? '推荐' : '')).join('')}</div>
          <div class="custom-input-wrap">
            <input class="custom-input" type="number" id="volume-custom" placeholder="自定义题量（10~630）" value="${esc(m.volumeCustom || '')}" min="10" max="630">
          </div>
        </div>

        <div class="form-group">
          <div class="form-label"><span class="step-num">3</span> 什么向</div>
          <div class="form-hint">决定 NSFW 题库的侧重方向。SFW 跳过全部 NSFW 题；SM/BDSM 追加权力维度。</div>
          <div class="opt-grid">${CONFIG.ORIENTATION_OPTIONS.map(o => radio('orientation', o, o, m.orientation === o)).join('')}</div>
        </div>

        <div class="form-group">
          <div class="form-label"><span class="step-num">4</span> 是否 DLC9 特化</div>
          <div class="form-hint">答「是」，加载 DLC9「逆転の恋人」双性题库；答「否」，DLC 双性题量为 0。</div>
          <div class="opt-grid">${CONFIG.DLC9_OPTIONS.map(o => radio('dlc9', o, o, m.dlc9 === o)).join('')}</div>
        </div>

        <div class="form-group">
          <div class="form-label"><span class="step-num">5</span> 种族维度</div>
          <div class="form-hint">明渊市世界观里种族是核心辨识度之一。选「多形态」则追加形态切换权问答。</div>
          <div class="opt-grid">${CONFIG.RACE_OPTIONS.map(o => radio('race', o, o, m.race === o)).join('')}</div>
        </div>

        <div class="divider"></div>

        <div class="form-group">
          <div class="form-label"><span class="step-num">✏️</span> 命名规则</div>
          <div class="form-hint">默认姓名三字，姓从「苏、林、洛、宋」取，尾字加「宝」自然。是否严格遵循？</div>
          <div class="opt-grid">
            <div class="opt-item"><input type="radio" name="naming" id="n_y" value="1" ${m.strictNaming ? 'checked' : ''}><label class="opt-label" for="n_y">严格遵循</label></div>
            <div class="opt-item"><input type="radio" name="naming" id="n_n" value="0" ${!m.strictNaming ? 'checked' : ''}><label class="opt-label" for="n_n">自由命名</label></div>
          </div>
        </div>

        <div class="btn-row">
          <button class="btn btn-primary" id="btn-confirm-meta">确认元信息，下一步 →</button>
        </div>
      </div>
    `;
    bindMetaEvents();
  }

  function bindMetaEvents() {
    // 用 label 点击 + input change 双保险，确保移动端稳定选中
    const bindGroup = (name, fn) => {
      $$(`input[name="${name}"]`).forEach(r => {
        r.onchange = e => { r.checked = true; fn(e.target.value); };
        const lb = r.closest('.opt-item');
        if (lb) {
          lb.querySelectorAll('.opt-label').forEach(l => {
            l.onclick = (e) => { e.preventDefault(); r.checked = true; fn(r.value); };
          });
        }
      });
    };
    bindGroup('gender', v => { State.meta.gender = v; });
    bindGroup('volume', v => { State.meta.volume = parseInt(v); $('#volume-custom').value = ''; State.meta.volumeCustom = ''; });
    bindGroup('orientation', v => { State.meta.orientation = v; });
    bindGroup('dlc9', v => { State.meta.dlc9 = v; });
    bindGroup('race', v => { State.meta.race = v; State.meta.raceMulti = v === '多形态'; });
    bindGroup('naming', v => { State.meta.strictNaming = v === '1'; });
    const vc = $('#volume-custom');
    if (vc) vc.oninput = e => {
      const v = parseInt(e.target.value);
      if (v >= 10 && v <= 630) { State.meta.volume = v; }
      State.meta.volumeCustom = e.target.value;
    };
    const btn = $('#btn-confirm-meta');
    if (btn) btn.onclick = () => App.confirmMeta();
  }

  /* ===== 提问页 ===== */
  function renderAsk(el) {
    if (State.askMode === null) { renderAskMode(el); return; }
    if (State.askMode === 'single') renderAskSingle(el);
    else renderAskBatch(el);
  }

  function renderAskMode(el) {
    const prog = ENGINE.countProgress(State.plan, State.answers);
    el.innerHTML = `
      <div class="card">
        <div class="card-title"><span class="icon">🗂️</span> 选择提问模式</div>
        <div class="card-sub">元信息已确认，共需回答 <b class="fw-700" style="color:var(--primary)">${prog.total}</b> 题（含体系登记层与补完层必答题）。</div>
        <div class="form-group">
          <div class="form-label">提问模式</div>
          <div class="opt-grid">
            <div class="opt-item"><input type="radio" name="askmode" id="am_single" value="single" ${State.askMode === 'single' ? 'checked' : ''}><label class="opt-label" for="am_single">逐题模式<span class="opt-tag">精雕</span></label></div>
            <div class="opt-item"><input type="radio" name="askmode" id="am_batch" value="batch" ${State.askMode === 'batch' ? 'checked' : ''}><label class="opt-label" for="am_batch">批次模式<span class="opt-tag">高效</span></label></div>
          </div>
        </div>
        <div class="form-group" id="batch-size-group" style="${State.askMode === 'batch' ? '' : 'display:none'}">
          <div class="form-label">每批题数</div>
          <div class="opt-grid">${CONFIG.BATCH_SIZES.map(v => `
            <div class="opt-item"><input type="radio" name="batchSize" id="bs_${v}" value="${v}" ${State.batchSize === v ? 'checked' : ''}><label class="opt-label" for="bs_${v}">${v} 题/批</label></div>`).join('')}
          </div>
        </div>
        <div class="form-group">
          <div class="form-label">💾 记忆存档频率</div>
          <div class="form-hint">每答 N 题弹出「存进记忆」提示（可随时手动存，或关闭）。</div>
          <div class="opt-grid">
            ${CONFIG.MEMORY_FREQ.map(v => `
              <div class="opt-item"><input type="radio" name="memfreq" id="mf_${v}" value="${v}" ${State.memoryFreq === v ? 'checked' : ''}><label class="opt-label" for="mf_${v}">每 ${v} 题</label></div>`).join('')}
            <div class="opt-item"><input type="radio" name="memfreq" id="mf_0" value="0" ${State.memoryFreq === 0 ? 'checked' : ''}><label class="opt-label" for="mf_0">关闭提示</label></div>
          </div>
        </div>
        <div class="divider"></div>
        <div class="card-sub">📋 体量分配预览：</div>
        <div class="stats-grid" id="plan-stats"></div>
        <div class="btn-row">
          <button class="btn btn-ghost" id="btn-back-meta">← 返回元信息</button>
          <button class="btn btn-primary" id="btn-start-ask">开始提问 →</button>
        </div>
      </div>
    `;
    $$('input[name="askmode"]').forEach(r => r.onchange = e => { State.askMode = e.target.value; const g = $('#batch-size-group'); if (g) g.style.display = e.target.value === 'batch' ? '' : 'none'; });
    $$('input[name="batchSize"]').forEach(r => r.onchange = e => State.batchSize = parseInt(e.target.value));
    $$('input[name="memfreq"]').forEach(r => r.onchange = e => { State.memoryFreq = parseInt(e.target.value); });
    renderPlanStats();
    $('#btn-back-meta').onclick = () => App.go('meta');
    $('#btn-start-ask').onclick = () => App.confirmAskMode();
  }

  function renderPlanStats() {
    const stats = {};
    State.plan.forEach(p => stats[p.layer] = (stats[p.layer] || 0) + 1);
    const el = $('#plan-stats');
    if (!el) return;
    el.innerHTML = Object.entries(stats).map(([l, n]) => `
      <div class="stat-box"><div class="stat-num" style="color:${(CONFIG.LAYER_INFO[l] || {}).color || 'var(--primary)'}">${n}</div><div class="stat-label">${(CONFIG.LAYER_INFO[l] || {}).icon || ''} ${esc(l)}</div></div>`).join('') +
      `<div class="stat-box"><div class="stat-num">${State.plan.length}</div><div class="stat-label">总计</div></div>`;
  }

  /* 是否必答（required 或 档案核心题） */
  function isMandatory(p) {
    if (p.required) return true;
    const core = new Set(SCHEMA.getCoreIds(State.meta));
    return core.has(p.qid);
  }

  /* 渲染单题卡片 */
  function renderQuestionCard(p, answer) {
    const layer = CONFIG.LAYER_INFO[p.layer] || { name: p.layer, color: '#888' };
    const opts = p.options || [];
    const ans = hasAnswer(answer) ? String(answer) : null;
    return `
      <div class="question-card" data-qid="${p.qid}">
        <div class="q-header">
          <span class="q-num">#${p.qid}</span>
          <span class="q-layer-tag ${p.layer}">${layer.icon} ${esc(layer.name)}</span>
          ${p.cat ? `<span class="q-layer-tag" style="background:#f0edf5;color:#7b6fc0">${esc(p.cat)}</span>` : ''}
          ${isMandatory(p) ? `<span class="q-layer-tag" style="background:#fdf0dd;color:#d99a3d">必答</span>` : ''}
        </div>
        <div class="q-title">${esc(p.title)}</div>
        ${p.parse ? `<div class="q-parse"><span class="parse-label">📖 解析：</span>${esc(p.parse)}</div>` : ''}
        ${(p.qid === 1 || p.qid === 2) && State.meta.strictNaming ? `<div class="q-naming-hint">📏 严格命名规则：姓从「苏林洛宋」取、名尾加「宝」、三字为宜（检查页会自动校验查重）</div>` : ''}
        <div class="q-options" role="radiogroup" aria-label="${esc(p.title)}">
          <div class="opts-title">💡 建议方向（可直接点选，也可自定义填写）</div>
          <div class="opt-grid">
            ${opts.map((o, i) => `
              <div class="opt-item"><input type="radio" name="q_${p.qid}" id="q${p.qid}_${i}" value="${esc(o)}" ${ans === o ? 'checked' : ''}>
              <label class="opt-label" for="q${p.qid}_${i}">${esc(o)}</label></div>`).join('')}
          </div>
          <div class="custom-input-wrap">
            <input class="custom-input q-custom" data-qid="${p.qid}" placeholder="以上选项仅供参考，可直接打字填写任何内容…" value="${ans && !opts.includes(ans) ? esc(ans) : ''}" maxlength="500" aria-label="自定义答案">
          </div>
          <div class="q-custom-feedback" data-fb="${p.qid}">${ans ? '✅ 已填写' : ''}</div>
          ${ans ? `<div class="q-answer">✅ 已回答：${esc(ans)} <span class="edit-btn" data-clear="${p.qid}">重答</span></div>` : ''}
        </div>
      </div>
    `;
  }

  function bindQuestionCard(p) {
    const card = $(`.question-card[data-qid="${p.qid}"]`);
    if (!card) return;
    const fb = card.querySelector(`.q-custom-feedback[data-fb="${p.qid}"]`);
    const setFeedback = (text, ok) => {
      if (fb) { fb.textContent = text; fb.className = 'q-custom-feedback' + (ok ? ' ok' : ''); }
    };
    $$(`input[name="q_${p.qid}"]`).forEach(r => {
      r.onchange = e => {
        State.answers[p.qid] = e.target.value;
        const cust = card.querySelector('.q-custom');
        if (cust) { cust.value = ''; setFeedback('✅ 已选选项', true); }
        card.classList.add('answered');
        scheduleSave();
      };
      // 键盘：Enter 直接选中（方向键原生支持）
      r.onkeydown = e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          r.checked = true;
          r.dispatchEvent(new Event('change', { bubbles: true }));
        }
      };
    });
    const cust = card.querySelector('.q-custom');
    if (cust) {
      cust.oninput = () => {
        $$(`input[name="q_${p.qid}"]`).forEach(r => r.checked = false);
        // 实时预览：非空即视为已填写
        const v = cust.value.trim();
        if (v) setFeedback('✅ 已填写：' + v.slice(0, 20) + (v.length > 20 ? '…' : ''), true);
        else setFeedback('⌨️ 输入后自动视为答案', false);
      };
      cust.onblur = e => {
        if (e.target.value.trim()) { State.answers[p.qid] = e.target.value.trim(); card.classList.add('answered'); scheduleSave(); }
      };
      cust.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } };
    }
    const clear = card.querySelector('[data-clear]');
    if (clear) clear.onclick = () => { App.clearAnswer(p.qid); };
  }

  /* 逐题模式 */
  function renderAskSingle(el) {
    let idx = State.currentIndex;
    while (idx < State.plan.length && hasAnswer(State.answers[State.plan[idx].qid])) idx++;
    if (idx >= State.plan.length) { renderAskComplete(el); return; }
    State.currentIndex = idx;
    const p = State.plan[idx];
    const prog = ENGINE.countProgress(State.plan, State.answers);
    el.innerHTML = `
      <div class="card">
        <div class="card-title"><span class="icon">💬</span> 提问进行中</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(idx / State.plan.length * 100)}%"></div></div>
        <div class="text-small text-soft mb-12">第 ${idx + 1} / ${State.plan.length} 题（已答 ${prog.done} · ${Math.round(prog.done / State.plan.length * 100)}%）</div>
        ${renderQuestionCard(p, State.answers[p.qid])}
        <div class="btn-row">
          ${idx > 0 ? `<button class="btn btn-ghost" id="btn-prev">← 上一题</button>` : ''}
          <button class="btn btn-primary" id="btn-next">${idx === State.plan.length - 1 ? '完成全部提问 ✓' : '下一题 →'}</button>
        </div>
        <div class="btn-row left mt-8">
          <button class="btn btn-soft" id="btn-savemem">💾 存进记忆</button>
          <button class="btn btn-soft" id="btn-progress">📊 进度</button>
          <button class="btn btn-soft" id="btn-reskip">⏩ 跳到未答</button>
          <button class="btn btn-soft" id="btn-reroll">🎲 重新抽取题库</button>
        </div>
      </div>
    `;
    bindQuestionCard(p);
    if ($('#btn-prev')) $('#btn-prev').onclick = () => App.prevQuestion();
    $('#btn-next').onclick = () => App.submitSingle();
    $('#btn-savemem').onclick = () => App.saveMemory();
    $('#btn-progress').onclick = () => App.openProgress();
    $('#btn-reskip').onclick = () => App.skipToEnd();
    $('#btn-reroll').onclick = () => App.reroll();
  }

  /* 批次模式 */
  function renderAskBatch(el) {
    let start = State.currentIndex;
    while (start < State.plan.length && hasAnswer(State.answers[State.plan[start].qid])) start++;
    if (start >= State.plan.length) { renderAskComplete(el); return; }
    State.currentIndex = start;
    const end = Math.min(start + State.batchSize, State.plan.length);
    const batch = State.plan.slice(start, end);
    const prog = ENGINE.countProgress(State.plan, State.answers);
    el.innerHTML = `
      <div class="card">
        <div class="card-title"><span class="icon">📦</span> 批次提问</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(start / State.plan.length * 100)}%"></div></div>
        <div class="text-small text-soft mb-12">第 ${start + 1} ~ ${end} 题（共 ${State.plan.length} 题 · 已答 ${prog.done} · ${Math.round(prog.done / State.plan.length * 100)}%）</div>
        ${batch.map(p => renderQuestionCard(p, State.answers[p.qid])).join('')}
        <div class="btn-row">
          ${start > 0 ? `<button class="btn btn-ghost" id="btn-prevb">← 上一批</button>` : ''}
          <button class="btn btn-primary" id="btn-nextb">${end >= State.plan.length ? '完成全部提问 ✓' : '下一批 →'}</button>
        </div>
        <div class="btn-row left mt-8">
          <button class="btn btn-soft" id="btn-savemem">💾 存进记忆</button>
          <button class="btn btn-soft" id="btn-progress">📊 进度</button>
          <button class="btn btn-soft" id="btn-reroll">🎲 重新抽取题库</button>
        </div>
      </div>
    `;
    batch.forEach(p => bindQuestionCard(p));
    if ($('#btn-prevb')) $('#btn-prevb').onclick = () => App.prevBatch();
    $('#btn-nextb').onclick = () => App.submitBatch();
    $('#btn-savemem').onclick = () => App.saveMemory();
    $('#btn-progress').onclick = () => App.openProgress();
    $('#btn-reroll').onclick = () => App.reroll();
  }

  /* 提问完成页 */
  function renderAskComplete(el) {
    const prog = ENGINE.countProgress(State.plan, State.answers);
    el.innerHTML = `
      <div class="card text-center" style="padding:50px 28px">
        <div style="font-size:60px;margin-bottom:14px">🎉</div>
        <h2 style="font-size:26px;font-weight:900;margin-bottom:8px">全部提问完成！</h2>
        <p class="text-soft" style="margin-bottom:6px">共完成 <b style="color:var(--primary)">${prog.done}</b> 题，即将为你组装完整档案。</p>
        <p class="text-small text-soft mb-16">下面进行：生成完整档案 → 输出确认 → 世界观检查 → 体系登记 → 测试模式</p>
        <button class="btn-big" id="btn-gen">生成完整档案 ✨</button>
      </div>
    `;
    $('#btn-gen').onclick = () => App.generateArchive();
  }

  /* ===== 档案展示 ===== */
  function renderArchive(el) {
    if (!State.generatedArchive) State.generatedArchive = ENGINE.buildArchive(State.meta, State.answers, window.QUESTIONS);
    const arch = State.generatedArchive;
    el.innerHTML = `
      <div class="card">
        <div class="card-title"><span class="icon">📄</span> 角色档案 · ${esc(arch.name)}（V4.2 全字段版 · 精细度对标林晴祈）</div>
        <div class="card-sub">以下档案由你的回答自动组装，可逐块检查。${esc(hasAnswer(arch.core) ? '' : '（一句话内核待补）')}</div>
        ${arch.sections.map(s => `
          <div class="archive-block">
            <div class="ab-title">${esc(s.title)}</div>
            <table class="archive-table">${s.rows.map(r => `<tr><td class="k">${esc(r.label)}</td><td class="v">${esc(r.value)}</td></tr>`).join('')}</table>
          </div>`).join('')}
        <div class="archive-block">
          <div class="ab-title">一句话人设内核</div>
          <p style="font-size:15px;font-weight:700;color:var(--primary)">「${esc(arch.core)}」</p>
        </div>
        <div class="divider"></div>
        <div class="btn-row">
          <button class="btn btn-ghost" id="btn-back-ask">← 返回修改</button>
          <button class="btn btn-soft" id="btn-copy">📋 复制 markdown</button>
          <button class="btn btn-soft" id="btn-download">⬇ 下载 .md</button>
        </div>
        <div class="btn-row left mt-8">
          <button class="btn btn-soft" id="btn-export-st2">🎭 导出 SillyTavern V2</button>
          <button class="btn btn-soft" id="btn-export-st3">🎭 导出 SillyTavern V3</button>
          <button class="btn btn-soft" id="btn-export-json">📦 导出 JSON</button>
        </div>
        <div class="btn-row mt-8">
          <button class="btn btn-primary" id="btn-next-check">下一步：世界观检查 →</button>
        </div>
      </div>
    `;
    $('#btn-back-ask').onclick = () => App.go('ask');
    $('#btn-copy').onclick = () => App.copyArchive();
    $('#btn-download').onclick = () => App.downloadArchive();
    $('#btn-export-st2').onclick = () => App.exportST(2);
    $('#btn-export-st3').onclick = () => App.exportST(3);
    $('#btn-export-json').onclick = () => App.exportJSON();
    $('#btn-next-check').onclick = () => App.go('check');
  }

  /* ===== 世界观检查页 ===== */
  function renderCheck(el) {
    const results = ENGINE.runChecks(State.meta, State.answers, { registers: State.registers, REGISTER_LIST: SCHEMA.REGISTER_LIST });
    const pass = results.filter(r => r.status === 'pass').length;
    const fail = results.filter(r => r.status === 'fail').length;
    const manual = results.filter(r => r.status === 'manual').length;
    const allClear = fail === 0;
    el.innerHTML = `
      <div class="card">
        <div class="card-title"><span class="icon">🛡️</span> 世界观适配检查（V4.2 · 共14条 · 自动校验）</div>
        <div class="card-sub">自动判定：<b style="color:var(--success)">通过 ${pass}</b> · <b style="color:var(--danger)">不通过 ${fail}</b> · <b style="color:var(--warn)">需人工确认 ${manual}</b>。任何一条不通过，立即确认修改方案。</div>
        ${manual > 0 ? `<div class="manual-banner">👀 有 ${manual} 条需要你人工确认（黄色标记），请对照世界观自行判定后再继续。</div>` : ''}
        <div class="stats-grid">
          <div class="stat-box"><div class="stat-num" style="color:var(--success)">${pass}</div><div class="stat-label">自动通过</div></div>
          <div class="stat-box"><div class="stat-num" style="color:var(--danger)">${fail}</div><div class="stat-label">不通过</div></div>
          <div class="stat-box"><div class="stat-num" style="color:var(--warn)">${manual}</div><div class="stat-label">需人工确认</div></div>
          <div class="stat-box"><div class="stat-num" style="color:${allClear ? 'var(--success)' : 'var(--danger)'}">${allClear ? '✅ 可继续' : '⚠️ 有阻碍'}</div><div class="stat-label">状态</div></div>
        </div>
        ${results.map(c => `
          <div class="check-item ${c.status}">
            <div class="check-box">${c.status === 'pass' ? '✓' : c.status === 'fail' ? '✗' : '?'}</div>
            <div class="check-content">
              <div class="check-title">${c.id}. ${esc(c.title)}</div>
              <div class="check-desc">${esc(c.desc)}</div>
              <div class="check-reason">${esc(c.reason || '')}</div>
              ${c.status === 'manual' ? `<div class="check-manual-note">👀 需人工确认：请对照世界观自行判断是否通过</div>` : ''}
            </div>
          </div>`).join('')}
        <div class="btn-row">
          <button class="btn btn-ghost" id="btn-back-arch">← 返回档案</button>
          <button class="btn btn-primary" id="btn-next-reg">${allClear ? '✅ 全部通过，下一步 →' : '下一步：体系登记 →'}</button>
        </div>
        ${!allClear ? `<div class="text-small text-soft mt-8">⚠️ 存在不通过项，建议返回修改档案后再继续（体系登记与补完必答项需填写完整）。</div>` : ''}
      </div>
    `;
    $('#btn-back-arch').onclick = () => App.go('archive');
    $('#btn-next-reg').onclick = () => App.confirmCheck();
  }

  /* ===== 体系登记页 ===== */
  function renderRegister(el) {
    SCHEMA.REGISTER_LIST.forEach(r => { if (State.registers[r.id] === undefined) State.registers[r.id] = false; });
    const done = SCHEMA.REGISTER_LIST.filter(r => State.registers[r.id]).length;
    el.innerHTML = `
      <div class="card">
        <div class="card-title"><span class="icon">📚</span> 体系登记流水</div>
        <div class="card-sub">生成后自动入册清单。逐项勾选，确认后写入主文件对应章节的表格。</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(done / SCHEMA.REGISTER_LIST.length * 100)}%"></div></div>
        <div class="text-small text-soft mb-16">已登记 ${done} / ${SCHEMA.REGISTER_LIST.length}</div>
        ${SCHEMA.REGISTER_LIST.map(r => `
          <div class="register-item ${State.registers[r.id] ? 'done' : ''}">
            <div class="r-check" data-reg="${r.id}">${State.registers[r.id] ? '✓' : ''}</div>
            <div class="r-content"><div class="r-title">${esc(r.icon)} ${esc(r.title)}</div><div class="r-sub">${esc(r.sub)}</div></div>
          </div>`).join('')}
        <div class="divider"></div>
        <div class="card-sub">📋 本角色登记值速览：</div>
        ${renderRegisterPreview()}
        <div class="btn-row">
          <button class="btn btn-ghost" id="btn-back-check">← 返回检查</button>
          <button class="btn btn-primary" id="btn-finish-reg">完成登记，进入测试模式 →</button>
        </div>
      </div>
    `;
    $$('[data-reg]').forEach(elx => elx.onclick = () => App.toggleRegister(elx.dataset.reg));
    $('#btn-back-check').onclick = () => App.go('check');
    $('#btn-finish-reg').onclick = () => App.confirmRegister();
  }

  function renderRegisterPreview() {
    const rows = ENGINE.registerPreview(State.answers);
    return `<table class="archive-table">${rows.map(([k, val, ch]) => `<tr><td class="k">${esc(k)} <span class="text-small text-faint" style="color:var(--text-faint)">（${esc(ch)}）</span></td><td class="v">${esc(val)}</td></tr>`).join('')}</table>`;
  }

  /* ===== 测试模式页 ===== */
  function renderTest(el) {
    if (!State.testScene || !State.testStarted) {
      // 场景选择页（选中高亮，点「开始测试」才进入）
      el.innerHTML = `
        <div class="card">
          <div class="card-title"><span class="icon">🎬</span> 进入测试模式</div>
          <div class="card-sub">选择开场场景，扮演新角色与辞宝互动。测试中可随时调整设定。</div>
          ${(() => { const pr = ENGINE.countProgress(State.plan, State.answers); return pr.remaining > 0 ? `<div class="test-warn">⚠️ 还有 <b>${pr.remaining}</b> 题未回答（已答 ${pr.done}/${pr.total}）。测试模式基于当前已答内容，建议先回提问页完成剩余题目。</div>` : ''; })()}
          ${CONFIG.TEST_SCENES.map(s => `
            <div class="test-scene ${State.testScene === s.id ? 'selected' : ''}" data-scene="${s.id}">
              <div class="ts-icon">${esc(s.icon)}</div>
              <div class="ts-title">${esc(s.title)}</div>
              <div class="ts-desc">${esc(s.desc)}</div>
            </div>`).join('')}
          <div class="btn-row">
            <button class="btn btn-ghost" id="btn-back-reg2">← 返回登记</button>
            <button class="btn btn-primary" id="btn-start-test">开始测试 🎬</button>
          </div>
        </div>
      `;
      $$('[data-scene]').forEach(elx => elx.onclick = () => App.selectScene(elx.dataset.scene));
      $('#btn-back-reg2').onclick = () => App.go('register');
      $('#btn-start-test').onclick = () => App.startTest();
    } else {
      renderTestChat(el);
    }
  }

  function renderTestChat(el) {
    const scene = CONFIG.TEST_SCENES.find(s => s.id === State.testScene);
    const name = hasAnswer(State.answers[1]) ? String(State.answers[1]) : '她';
    el.innerHTML = `
      <div class="card">
        <div class="card-title"><span class="icon">${esc(scene.icon)}</span> ${esc(scene.title)} · 测试模式</div>
        <div class="card-sub">扮演辞宝与「${esc(name)}」互动。下方输入框发送消息，点击「结束测试」返回。</div>
        <div class="chat-box" id="chat-box">
          ${State.testMsgs.map(m => `
            <div class="chat-msg ${m.role}">
              <div class="avatar">${m.role === 'user' ? '辞' : esc(String(name).charAt(0))}</div>
              <div class="bubble">${esc(m.text)}</div>
            </div>`).join('')}
        </div>
        <div class="btn-row">
          <input class="custom-input" id="chat-input" placeholder="输入你作为辞宝的话…" style="flex:1" maxlength="500">
          <button class="btn btn-primary" id="btn-send">发送</button>
        </div>
        <div class="btn-row left mt-8">
          <button class="btn btn-soft" id="btn-auto">🎲 随机回应（模拟AI）</button>
          <button class="btn btn-ghost" id="btn-back-reg3">← 返回登记</button>
          <button class="btn btn-danger" id="btn-end">结束测试</button>
        </div>
      </div>
    `;
    const cb = $('#chat-box'); if (cb) cb.scrollTop = cb.scrollHeight;
    const input = $('#chat-input');
    input.onkeydown = e => { if (e.key === 'Enter') App.sendChat(); };
    $('#btn-send').onclick = () => App.sendChat();
    $('#btn-auto').onclick = () => App.autoReply();
    $('#btn-back-reg3').onclick = () => App.go('register');
    $('#btn-end').onclick = () => App.endTest();
    input.focus();
  }

  /* ===== 应用入口 ===== */
  const App = {
    start() {
      const saved = STORE.load();
      if (saved && saved.stage && saved.stage !== 'welcome' && saved.plan && saved.plan.length) {
        // 有未完成进度，直接恢复
        Object.assign(State, saved);
        State.meta = Object.assign(ENGINE.defaultMeta(), saved.meta || {});
        render();
        toast('已恢复上次进度', 'success');
      } else {
        State.stage = 'meta'; render();
      }
    },
    continueSaved() {
      const saved = STORE.load();
      if (!saved) return toast('没有可恢复的进度', 'warn');
      Object.assign(State, saved);
      State.meta = Object.assign(ENGINE.defaultMeta(), saved.meta || {});
      render();
      toast('已恢复进度', 'success');
    },
    go(stage) {
      State.stage = stage;
      if (stage === 'archive') State.generatedArchive = null;
      render();
    },

    confirmMeta() {
      const m = State.meta;
      // 一次性列出所有未选项（明确提示，避免逐个模糊报错）
      const missing = [];
      if (!m.gender) missing.push('OC 性别');
      if (!m.orientation) missing.push('「什么向」');
      if (!m.dlc9) missing.push('是否 DLC9 特化');
      if (!m.race) missing.push('种族维度');
      if (!m.volume) missing.push('题目体量');
      if (missing.length) return toast('还差这几项没选：' + missing.join('、'), 'error');
      if (m.strictNaming) {
        // 严格命名规则提示（姓名题会校验，这里提前说明）
        toast('已启用严格命名规则：姓从「苏林洛宋」取、名尾加「宝」、三字为宜', 'warn');
      }
      // 构建题目计划（随机）
      State.plan = ENGINE.buildPlan(State.meta, window.QUESTIONS);
      State.currentIndex = 0;
      State.answers = {};
      State.stage = 'ask';
      render();
      toast(`已抽取 ${State.plan.length} 题，请选择提问模式`, 'success');
    },

    confirmAskMode() {
      if (State.askMode === null) State.askMode = 'single';
      State.currentIndex = 0;
      State.stage = 'ask';
      render();
    },

    /* 逐题提交（必答强制） */
    submitSingle() {
      const p = State.plan[State.currentIndex];
      if (p) {
        const val = getQuestionAnswer(p.qid);
        if (val) State.answers[p.qid] = val;
        else if (isMandatory(p)) return toast(`第 ${p.qid} 题必答，请填写后再继续`, 'error');
      }
      State.currentIndex++;
      render();
      maybeAutoMemory();
    },
    prevQuestion() { if (State.currentIndex > 0) State.currentIndex--; render(); },
    skipToEnd() {
      let idx = State.currentIndex;
      while (idx < State.plan.length && hasAnswer(State.answers[State.plan[idx].qid])) idx++;
      State.currentIndex = idx; render();
    },

    /* 批次提交（必答强制） */
    submitBatch() {
      const start = State.currentIndex;
      const end = Math.min(start + State.batchSize, State.plan.length);
      let missingMandatory = [];
      let anyEmpty = 0;
      for (let i = start; i < end; i++) {
        const p = State.plan[i];
        const val = getQuestionAnswer(p.qid);
        if (val) State.answers[p.qid] = val;
        else { anyEmpty++; if (isMandatory(p)) missingMandatory.push(p.qid); }
      }
      if (missingMandatory.length) return toast(`必答题 #${missingMandatory.join('、#')} 未填写`, 'error');
      if (anyEmpty) toast(`${anyEmpty} 道选答题已跳过`, 'warn');
      State.currentIndex = end;
      render();
      maybeAutoMemory();
    },
    prevBatch() { State.currentIndex = Math.max(0, State.currentIndex - State.batchSize); render(); },

    clearAnswer(qid) { delete State.answers[qid]; render(); },

    reroll() {
      const ok = confirm('重新抽取题库将清空当前所有答案，确定继续？');
      if (!ok) return;
      State.plan = ENGINE.buildPlan(State.meta, window.QUESTIONS);
      State.currentIndex = 0;
      State.answers = {};
      render();
      toast('已重新抽取题库 🎲', 'success');
    },

    openProgress() {
      const prog = ENGINE.countProgress(State.plan, State.answers);
      const layerHtml = Object.entries(prog.layerStats).map(([l, s]) =>
        `<div class="text-small mb-8">${(CONFIG.LAYER_INFO[l] || {}).icon || ''} ${esc(l)}：<b>${s.done}/${s.total}</b>（${Math.round(s.done / s.total * 100)}%）</div>`).join('');
      UI.showModal('📊 当前进度',
        `<div class="stats-grid">
          <div class="stat-box"><div class="stat-num">${prog.done}</div><div class="stat-label">已答</div></div>
          <div class="stat-box"><div class="stat-num">${prog.remaining}</div><div class="stat-label">未答</div></div>
          <div class="stat-box"><div class="stat-num">${prog.total}</div><div class="stat-label">总题</div></div>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(prog.done / prog.total * 100)}%"></div></div>
        <div class="mt-12">${layerHtml}</div>`,
        `<button class="btn btn-primary" onclick="UI.closeModal()">继续提问</button>`);
    },

    generateArchive() {
      State.generatedArchive = ENGINE.buildArchive(State.meta, State.answers, window.QUESTIONS);
      State.stage = 'archive';
      render();
      toast('档案已生成 ✨', 'success');
    },

    /* 复制 markdown */
    copyArchive() {
      const md = ENGINE.archiveToMarkdown(State.generatedArchive, State.meta);
      const done = () => toast('已复制到剪贴板 📋', 'success');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(md).then(done).catch(() => fallbackCopy(md, done));
      } else fallbackCopy(md, done);
    },
    /* 下载 markdown */
    downloadArchive() {
      const md = ENGINE.archiveToMarkdown(State.generatedArchive, State.meta);
      const name = (State.generatedArchive.name || '角色档案') + '_档案.md';
      const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 100);
      toast('已下载档案 .md ⬇', 'success');
    },

    toggleCheck(id) { State.checks[id] = !State.checks[id]; render(); },
    confirmCheck() {
      const results = ENGINE.runChecks(State.meta, State.answers, { registers: State.registers, REGISTER_LIST: SCHEMA.REGISTER_LIST });
      const fail = results.filter(r => r.status === 'fail');
      if (fail.length) return toast(`仍有 ${fail.length} 条不通过：${fail.map(f => f.id).join('、')}`, 'error');
      State.stage = 'register'; render();
    },

    toggleRegister(id) { State.registers[id] = !State.registers[id]; render(); },
    confirmRegister() {
      const all = SCHEMA.REGISTER_LIST;
      const undone = all.filter(r => !State.registers[r.id]);
      if (undone.length) return toast(`登记流水未勾选：${undone.map(r => r.title).join('、')}`, 'error');
      State.stage = 'test'; render();
      saveNow();
      toast('登记完成，进入测试模式 🎬（已本地存档）', 'success');
    },

    selectScene(id) { State.testScene = id; State.testStarted = false; render(); },
    startTest() {
      if (!State.testScene) return toast('请先选择一个开场场景', 'error');
      State.testStarted = true;
      const name = hasAnswer(State.answers[1]) ? String(State.answers[1]) : '她';
      const openings = {
        daily: `清晨的阳光透过窗帘洒进房间。${name}蜷在你身侧，睫毛轻颤着慢慢睁开，看到你后露出一个甜甜的笑：「早上好呀，辞宝…」`,
        flirt: `夜色渐浓，客厅只留一盏昏黄的灯。${name}轻轻拉了拉你的衣角，眼神在阴影里闪烁，声音带着一丝不易察觉的轻颤：「那个…今晚，能不能多陪我一会儿？」`,
        nsfw: `灯光昏黄暧昧，${name}的呼吸有些乱，她抬眼望着你，脸颊泛着不自然的红晕，声音软得像要化开：「辞宝…我有点…热…」`,
      };
      State.testMsgs = [{ role: 'she', text: openings[State.testScene] }];
      render();
    },
    sendChat() {
      const input = $('#chat-input');
      if (!input) return;
      const text = input.value.trim();
      if (!text) return;
      State.testMsgs.push({ role: 'user', text });
      input.value = '';
      render();
    },
    autoReply() {
      const name = hasAnswer(State.answers[1]) ? String(State.answers[1]) : '她';
      const replies = [
        `「嗯…辞宝，我在听哦。」`,
        `「（脸红地低下头）你这样看着我，我会不好意思的啦…」`,
        `「最喜欢辞宝了…真的。」`,
        `「唔…再靠近一点点嘛。」`,
        `「（轻轻拽了拽你的袖子）陪我说说话好不好？」`,
      ];
      State.testMsgs.push({ role: 'she', text: replies[Math.floor(Math.random() * replies.length)] });
      render();
    },
    endTest() {
      State.testScene = null;
      State.testStarted = false;
      State.testMsgs = [];
      UI.showModal('🎬 测试结束',
        `<p class="text-soft">感谢试玩！本角色已完成全部流程：<br><b>元信息 → 提问 → 档案 → 检查 → 登记 → 测试</b></p>
         <p class="text-small text-soft mt-12">档案已可随时查看。如需调整，可返回对应步骤。</p>`,
        `<button class="btn btn-primary" onclick="UI.closeModal();App.go('archive')">查看档案</button>
         <button class="btn btn-ghost" onclick="UI.closeModal()">关闭</button>`);
      render();
    },

    /* ===== 记忆系统（B 手动 / A 自动 / C 面板） ===== */
    saveMemory(fromAuto) {
      const prog = ENGINE.countProgress(State.plan, State.answers);
      if (prog.done === 0) return toast('还没有任何已答内容，先答几题再存记忆吧', 'warn');
      const mem = {
        id: 'mem_' + Date.now(),
        name: '未命名记忆 ' + (STORE.loadMemories().length + 1),
        createdAt: Date.now(),
        meta: Object.assign({}, State.meta),
        progress: { answered: prog.done, total: prog.total },
        answers: Object.assign({}, State.answers),
        checks: Object.assign({}, State.checks),
        registers: Object.assign({}, State.registers),
        summary: makeMemorySummary(),
      };
      const r = STORE.addMemory(mem);
      if (r.ok) {
        toast('已存入记忆 · 第 ' + STORE.loadMemories().length + ' 份 💾', 'success');
        if (fromAuto) UI.closeModal();
        saveNow();
      } else if (r.error === 'quota') toast('存储空间不足，记忆保存失败', 'error');
      else toast('记忆保存失败', 'error');
    },
    disableMemory() { State.memoryFreq = 0; saveNow(); toast('已关闭自动记忆提醒', 'warn'); },
    openMemory() {
      const mems = STORE.loadMemories();
      if (!mems.length) { UI.showModal('💾 记忆', '还没有任何记忆。提问时点「存进记忆」即可保存当前进度快照。', `<button class="btn btn-primary" onclick="UI.closeModal()">知道了</button>`); return; }
      const rows = mems.map(m => `
        <div class="memory-item">
          <div class="mem-info">
            <div class="mem-name">${esc(m.name)}</div>
            <div class="mem-sub">${m.progress.answered}/${m.progress.total} 题 · ${new Date(m.createdAt).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })}</div>
            <div class="mem-summary">${esc(m.summary || '')}</div>
          </div>
          <div class="mem-actions">
            <button class="mem-btn" onclick="App.useMemory('${m.id}')">▶ 继续</button>
            <button class="mem-btn" onclick="App.renameMemory('${m.id}')">✏️</button>
            <button class="mem-btn" onclick="App.exportMemory('${m.id}')">⬇</button>
            <button class="mem-btn danger" onclick="App.deleteMemory('${m.id}')">🗑</button>
          </div>
        </div>`).join('');
      UI.showModal('💾 记忆存档（' + mems.length + ' 份）', rows,
        `<button class="btn btn-ghost" onclick="UI.closeModal()">关闭</button>`);
    },
    useMemory(id) {
      const mem = STORE.loadMemories().find(m => m.id === id);
      if (!mem) return toast('记忆不存在', 'error');
      if (!confirm('用这份记忆继续？当前未保存进度会被这份记忆覆盖。')) return;
      Object.assign(State, STORE.defaultState(), {
        meta: Object.assign(ENGINE.defaultMeta(), mem.meta || {}),
        plan: State.plan, currentIndex: 0,
        answers: Object.assign({}, mem.answers || {}),
        checks: Object.assign({}, mem.checks || {}),
        registers: Object.assign({}, mem.registers || {}),
        stage: 'ask', askMode: State.askMode || 'single',
      });
      if (!State.plan.length) { State.plan = ENGINE.buildPlan(State.meta, window.QUESTIONS); }
      UI.closeModal();
      render();
      toast('已用记忆「' + mem.name + '」继续', 'success');
      saveNow();
    },
    renameMemory(id) {
      const mem = STORE.loadMemories().find(m => m.id === id);
      if (!mem) return toast('记忆不存在', 'error');
      const name = prompt('重命名记忆', mem.name);
      if (!name || !name.trim()) return;
      STORE.updateMemory(id, { name: name.trim() });
      App.openMemory();
    },
    deleteMemory(id) {
      if (!confirm('删除这份记忆？')) return;
      STORE.deleteMemory(id);
      App.openMemory();
      toast('已删除记忆', 'success');
    },
    exportMemory(id) {
      const mem = STORE.loadMemories().find(m => m.id === id);
      if (!mem) return toast('记忆不存在', 'error');
      const blob = new Blob([JSON.stringify(mem, null, 2)], { type: 'application/json;charset=utf-8' });
      downloadBlob(blob, mem.name + '_记忆.json');
      toast('已导出记忆 ⬇', 'success');
    },

    /* ===== 清空存档（二次确认） ===== */
    clearAll() {
      UI.showModal('🗑 清空存档',
        `<p>确定要清空当前所有进度吗？<br><span class="text-small text-soft">这会删除本地自动存档（记忆快照不受影响）。</span></p>`,
        `<button class="btn btn-danger" id="btn-confirm-clear">确认清空</button>
         <button class="btn btn-ghost" onclick="UI.closeModal()">取消</button>`);
      const bc = $('#btn-confirm-clear');
      if (bc) bc.onclick = () => {
        STORE.clear();
        Object.assign(State, STORE.defaultState());
        State.meta = ENGINE.defaultMeta();
        UI.closeModal();
        render();
        toast('已清空存档，重新开始', 'warn');
      };
    },

    /* ===== SillyTavern V2/V3 角色卡导出 ===== */
    exportST(version) {
      if (!State.generatedArchive) State.generatedArchive = ENGINE.buildArchive(State.meta, State.answers, window.QUESTIONS);
      const card = ENGINE.archiveToSillyTavern(State.generatedArchive, State.meta, { version: version === 3 ? 3 : 2 });
      const blob = new Blob([JSON.stringify(card, null, 2)], { type: 'application/json;charset=utf-8' });
      downloadBlob(blob, (State.generatedArchive.name || '角色') + '_ST' + (version === 3 ? 'V3' : 'V2') + '.json');
      toast('已导出 SillyTavern ' + (version === 3 ? 'V3' : 'V2') + ' 角色卡 🎭', 'success');
    },

    /* ===== JSON 完整档案导出 ===== */
    exportJSON() {
      if (!State.generatedArchive) State.generatedArchive = ENGINE.buildArchive(State.meta, State.answers, window.QUESTIONS);
      const obj = ENGINE.archiveToJSON(State.generatedArchive, State);
      const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json;charset=utf-8' });
      downloadBlob(blob, (State.generatedArchive.name || '角色') + '_档案.json');
      toast('已导出 JSON 档案 📦', 'success');
    },
  };

  /* 获取题目答案（从表单读取） */
  function getQuestionAnswer(qid) {
    const checked = document.querySelector(`input[name="q_${qid}"]:checked`);
    if (checked && checked.value) return checked.value;
    const cust = document.querySelector(`.q-custom[data-qid="${qid}"]`);
    if (cust && cust.value.trim()) return cust.value.trim();
    return null;
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); }
    catch (e) { toast('复制失败，请手动复制', 'error'); }
    ta.remove();
  }

  /* 下载 Blob（导出用） */
  function downloadBlob(blob, filename) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 100);
  }

  /* 记忆摘要（用已答的少量关键题生成一句话） */
  function makeMemorySummary() {
    const name = hasAnswer(State.answers[1]) ? String(State.answers[1]) : '';
    const gender = State.meta.gender || '';
    const race = State.meta.race || '';
    const parts = [];
    if (name) parts.push('姓名 ' + name);
    if (gender) parts.push(gender);
    if (race) parts.push(race);
    const done = ENGINE.countProgress(State.plan, State.answers).done;
    return (parts.join(' · ') || '未命名') + '（已答 ' + done + ' 题）';
  }

  /* 自动记忆弹窗（A）：达到频率且未提示过 */
  function maybeAutoMemory() {
    const freq = State.memoryFreq;
    if (!freq) return;
    const done = ENGINE.countProgress(State.plan, State.answers).done;
    if (done > 0 && done % freq === 0 && State.memNotified < done) {
      State.memNotified = done;
      UI.showModal('💾 存进记忆？',
        `<p class="text-soft">已经认真答完 <b style="color:var(--primary)">${done}</b> 题啦～<br>要把现在的进度存进记忆吗？之后整理完整角色会更方便哦。</p>`,
        `<button class="btn btn-primary" onclick="App.saveMemory(true)">存进记忆</button>
         <button class="btn btn-ghost" onclick="UI.closeModal()">这次跳过</button>
         <button class="btn btn-ghost" onclick="App.disableMemory();UI.closeModal()">以后不再提醒</button>`);
    }
  }

  /* ===== UI 工具 ===== */
  const UI = {
    closeModal() { $('#modal-overlay').style.display = 'none'; },
    showModal(title, bodyHTML, footerHTML = '') {
      $('#modal-title').textContent = title;
      $('#modal-body').innerHTML = bodyHTML;
      $('#modal-footer').innerHTML = footerHTML;
      $('#modal-overlay').style.display = 'flex';
      const firstBtn = $('#modal-footer button');
      if (firstBtn) setTimeout(() => firstBtn.focus(), 50);
    },
  };

  /* ===== 初始化 ===== */
  document.addEventListener('DOMContentLoaded', () => {
    // 弹窗关闭按钮 + ESC
    const mc = $('#modal-close');
    if (mc) mc.onclick = () => UI.closeModal();
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && $('#modal-overlay').style.display === 'flex') UI.closeModal();
    });
    // 尝试恢复进度
    const saved = STORE.load();
    if (saved && saved.stage && saved.stage !== 'welcome' && saved.plan && saved.plan.length) {
      Object.assign(State, saved);
      State.meta = Object.assign(ENGINE.defaultMeta(), saved.meta || {});
      if (!State.testMsgs) State.testMsgs = [];
    }
    render();
    // 版本迁移提示（检测到旧 key 迁移，或版本不同）
    try {
      const old = localStorage.getItem(STORE.OLD_KEY);
      if (old) setTimeout(() => toast('已从 V4.1 迁移存档，欢迎使用 V4.2 ✨', 'success'), 600);
    } catch (e) { /* 忽略 */ }
  });

  /* 浏览器后退/前进支持（popstate 恢复阶段） */
  window.addEventListener('popstate', e => {
    const s = e.state && e.state.stage;
    if (s && s !== State.stage) {
      State.stage = s;
      lastPushedStage = s;
      render();
    }
  });

  /* 未完成提示：关闭/刷新前提醒（有进度且未到欢迎页） */
  window.addEventListener('beforeunload', e => {
    const hasProgress = State.plan && State.plan.length > 0 && State.stage && State.stage !== 'welcome';
    if (hasProgress) { e.preventDefault(); e.returnValue = ''; }
  });

  /* 全局错误降级页（避免白屏） */
  window.addEventListener('error', ev => {
    const ae = document.getElementById('app-error');
    if (ae) {
      ae.style.display = 'flex';
      document.getElementById('app').style.display = 'none';
      const d = document.getElementById('app-error-detail');
      if (d) d.textContent = '错误信息：' + (ev.message || '未知错误');
    }
  });

  /* 显式挂载全局 */
  window.App = App;
  window.State = State;
  window.UI = UI;
  window.render = render;
  window.getQuestionAnswer = getQuestionAnswer;
})();

</script>
</body>
</html>
