率与角色状态描述一致。"}},"438":{"title":"她单次理想时长是多少？时长是体验的深度。","descs":{"30min":"偏好30分钟左右的短程高效，重节奏不拖沓。适合忙碌、注重快感累积的角色。描写以干脆利落为特色，塑造直爽、不喜拖泥带水的形象。","1h":"偏好1小时左右的适中时长，兼顾前戏与正戏。适合作基准选项，节奏从容不赶。描写以铺垫与高潮的完整曲线为记忆点，塑造体贴周到的形象。","自定义":"按设定补全单次时长，如更短或更长、按当天状态浮动。可为体力设定或剧情节奏服务，写入档案，避免与体能描述冲突。"}},"439":{"title":"她事后温存的需求如何？温存是感情的延续。","descs":{"强":"事后需要大量温存，拥抱、抚摸、轻声安抚缺一不可。适合缺乏安全感、渴望被爱的黏人型角色。描写以事后拥抱为核心，塑造脆弱又依赖的形象。","中":"事后温存适中，抱一会、聊几句即可。适合作多数角色的均衡选项，亲昵而不黏腻。描写以自然的拥抱收尾，塑造温和知分寸的性格。","无":"事后不需要温存，完事即起身，重独立、怕腻歪。适合利落、冷淡或回避型角色。描写以“抽身就走”为梗，塑造自我、有距离感的形象。","自定义":"按设定补全温存需求，如只看对方睡颜、要听情话。可为角色创伤或亲密模式服务，写入档案，保持行为逻辑统一。"}},"440":{"title":"她清理的顺序偏好是什么？清理是体谅的细节。","descs":{"洗澡":"事后第一时间洗澡，看重干净清爽。适合有洁癖、注重卫生的角色。描写以“先冲再躺”为记忆点，塑造爱干净、有条理的体贴形象。","纸巾":"先用纸巾简单清理，省事直接躺。适合慵懒、怕麻烦或事后困倦的角色。描写以随手一擦为梗，塑造随性、不拘小节的气质。","自定义":"按设定补全清理顺序，如先喝水再清理、分步骤。可为特殊习惯或剧情服务，写入档案，确保描写顺序与角色行为一致。"}},"441":{"title":"她是否需要抱着睡？抱着睡是安全感的延续。","descs":{"需要":"事后需要被抱着睡，否则难入睡。适合黏人、缺乏安全感的角色。描写以“钻进怀里”为记忆点，塑造依赖又安心的亲密形象。","不需要":"事后可自行入睡，不需要抱着。适合独立、睡眠浅或怕热的角色。描写以“各自躺平”为梗，塑造有边界感、不过度依赖的形象。","自定义":"按设定补全睡姿需求，如只牵手、枕手臂或背对背。可为睡眠习惯或剧情服务，写入档案，保持日常描写一致。"}},"442":{"title":"她事后想吃的东西是什么？事后的小食是照顾。","descs":{"甜品":"事后想吃甜品，用甜味抚平疲惫。适合嗜甜、喜欢被哄的角色。描写以“递上一口蛋糕”为记忆点，塑造软糯又易满足的形象。","水":"事后只想喝水，解渴润喉、清爽简单。适合作中性基准选项，不挑食、重实际。描写以递水为梗，塑造务实、照顾周全的温和形象。","自定义":"按设定补全事后饮食，如热牛奶、水果或咸口夜宵。可为特殊口味或剧情服务，写入档案，确保饮食细节与人设一致。"}},"443":{"title":"她事后聊天的内容是什么？事后的闲聊是亲密。","descs":{"撒娇":"事后爱撒娇，要抱要哄、说软话。适合黏人、渴望被爱或被宠的角色。描写以“再抱一下”为记忆点，塑造柔软又主动依赖的形象。","闲聊":"事后想随意闲聊，聊日常、说些有的没的。适合随和、享受平淡陪伴的角色。描写以轻松话题为梗，塑造温馨、不刻意煽情的氛围。","自定义":"按设定补全事后聊天，如复盘感受、说情话或安静不语。可为角色沟通模式服务，写入档案，保持对话风格统一。"}},"444":{"title":"她是否会回味？回味是记忆的延长。","descs":{"会":"事后会反复回味，记得每个细节。适合细腻、重感情或记性好的角色。描写以“第二天还在想”为记忆点，塑造温柔又念旧的深情形象。","不会":"事后不回味，翻篇就忘、活在当下。适合洒脱、没心没肺或务实的角色。描写以“完事就丢开”为梗，塑造随性、不内耗的性格。","自定义":"按设定补全回味习惯，如只记住特定时刻、悄悄回味。可为角色性格或剧情服务，写入档案，保持内心描写一致。"}},"445":{"title":"她第二天身体的感受是什么？第二天的感受是痕迹。","descs":{"酸痛":"第二天肌肉酸痛，是激烈后的直观痕迹。适合体力旺盛、玩得尽兴的角色设定。描写以“腰酸腿软”为梗，塑造热烈尽兴又真实的形象。","疲惫":"第二天明显疲惫，需要休息恢复。适合精力有限、事后嗜睡的角色。描写以“赖床不起”为记忆点，塑造慵懒、需要被照顾的形象。","正常":"第二天一切如常，恢复快、状态好。适合体质好、恢复力强的角色。描写以“照常早起”为梗，塑造健康有活力的形象。","自定义":"按设定补全次日感受，如局部不适、轻微发烫。可为特殊体质或剧情服务，写入档案，确保身体状态前后一致。"}},"446":{"title":"她对「做到天亮」的态度如何？这是时长的态度。","descs":{"喜欢":"喜欢做到天亮，享受整夜的缠绵。适合精力旺盛、黏人型角色，如发情期设定。描写以“窗外泛白”为记忆点，塑造不知疲倦的炽热形象。","无感":"对通宵无特别偏好，顺其自然。适合作中性角色，不主动也不抗拒。描写以随缘为梗，把节奏交给对方，塑造随和配合的性格。","拒绝":"拒绝通宵，到点就要睡、作息规律。适合自律、重视休息的角色。描写以“到点收场”为梗，塑造有原则、不纵欲的形象。","自定义":"按设定补全通宵态度，如偶尔破例、仅限周末。可为作息或剧情服务，写入档案，保持时间逻辑与日常一致。"}},"447":{"title":"她对「快速解决」的态度如何？这是时长的态度。","descs":{"喜欢":"喜欢快速解决，干脆利落、不拖时间。适合忙碌、直爽或追求效率的角色。描写以“速战速决”为梗，塑造利落不黏糊的性格。","无感":"对快速解决无特别偏好，视情况而定。适合作中性角色，节奏灵活。描写以顺势而为为特色，塑造随性、好沟通的形象。","拒绝":"拒绝草草了事，看重过程与铺垫。适合注重体验、慢热的角色。描写以“不赶时间”为梗，塑造讲究、懂得享受的形象。","自定义":"按设定补全对快速解决的态度，如仅限紧急时刻。可为日程或剧情服务，写入档案，确保节奏描写与人设一致。"}},"448":{"title":"她对「长时间边缘」的态度如何？这是时长的态度。","descs":{"喜欢":"喜欢长时间边缘，享受被吊起的折磨快感。适合掌控欲或受虐倾向的角色，追求延迟满足。描写以“反复徘徊在边缘”为梗，塑造敏感又执着的形象。","无感":"对长时间边缘无特别偏好，顺其自然。适合作多数角色，不追求极致刺激。描写以常规节奏为特色，塑造温和、不执着的性格。","拒绝":"拒绝长时间边缘，受不了吊着的感觉。适合急性子、追求直接满足的角色。描写以“快点给我”为梗，塑造直率、缺乏耐心的形象。","自定义":"按设定补全对边缘的态度，如只允许特定时机。可为玩法偏好或剧情服务，写入档案，确保与敏感度设定一致。"}},"449":{"title":"她性生活中的仪式感如何？仪式感是感情的装饰。","descs":{"有":"注重仪式感，事前有铺垫、事后有收尾。适合浪漫、讲究氛围的角色，如先洗澡、调灯光。描写以“精心准备”为记忆点，塑造细腻又郑重的形象。","无":"不讲究仪式感，随时开始、简单直接。适合务实、随性或老夫老妻型角色。描写以“不做铺垫”为梗，塑造自然、不端着的气质。","自定义":"按设定补全仪式感细节，如特定音乐、台词或约定动作。可为剧情或专属默契服务，写入档案，保持仪式描写前后一致。"}},"450":{"title":"她最难忘的一次性经历想象是什么？最难忘是她的记忆锚点。","descs":{"第一次被辞宝抱住的初夜":"初夜最难忘，青涩与紧张交织。适合纯情或新手型角色，主打“第一次”的珍贵感。描写以颤抖、耳尖发红为记忆点，塑造初体验的纯真形象。","在浴室里被辞宝从背后抱住":"浴室从背后拥抱最难忘，水汽与暧昧加成。适合喜欢惊喜、身体贴近感的角色。描写以镜中对视为记忆点，塑造羞怯又心动的形象。","发情期被辞宝彻底填满的那晚":"发情期被彻底填满那晚最难忘，本能与失控并存。适合高欲望或特殊体质设定，如兽类、发情期角色。描写以失控与满足为记忆点，塑造野性又依赖的形象。","自定义":"按设定补全最难忘时刻，如重逢夜、生日或特定场景。可为剧情高潮服务，写入档案，确保回忆与主线经历呼应。"}},"451":{"title":"她明确拒绝的红线是什么（列出）？红线是她的底线。","descs":{"拳交":"红线：拒绝拳交，超出接受范围。适合设定明确边界、重视身体安全的角色。描写以“坚决摇头”为梗，塑造有底线、懂得拒绝的形象。","电击":"红线：拒绝电击，对痛感刺激零容忍。适合怕痛、追求温和体验的角色。描写以“一碰就躲”为记忆点，塑造自我保护意识强的形象。","多人":"红线：拒绝多人，只接受一对一。适合专一、有占有欲或洁癖的角色。描写以“只要你就够了”为梗，塑造忠诚又排他的性格。","自定义":"按设定补全拒绝红线，如特定场景、道具或行为。可为道德观或创伤设定服务，写入档案，确保边界描写前后一致、不越线。"}},"452":{"title":"她可以尝试但需慎重的是什么？这是边界的部分。","descs":{"束缚":"可尝试束缚但需慎重，带半推半就的试探感。适合信任度高、愿意交出控制权的角色。描写以“由你绑”为记忆点，塑造依赖又略带紧张的形象。","蒙眼":"可尝试蒙眼但需慎重，在黑暗里放大触觉。适合敏感、爱想象的角色，主打感官体验。描写以“看不见更紧张”为梗，塑造敏锐又期待的形象。","自定义":"按设定补全慎重尝试项，如轻拍、道具或角色扮演。可为循序渐进玩法服务，写入档案，确保尝试节奏与信任度设定一致。"}},"453":{"title":"她完全开放的是什么？这是边界的部分。","descs":{"常规play":"指性爱以常规体位与方式为主，动作贴近日常亲密、节奏稳定。适合走「真实感恋人」路线的角色，让互动温暖克制。塑造上偏向温柔细腻，避免猎奇，情感浓度高于生理刺激。","角色扮演":"指借助剧情、服装或身份设定展开性互动，如校园、女仆等情境。适合喜欢故事感的角色，可把设定玩成连续剧本。塑造上强化仪式感与角色张力，也考验双方配合与默契。","自定义":"完全按你的偏好设定开放程度，从保守到极端皆可。适合已有明确想法的创作者，用来贴近个人审美。塑造上给角色留出弹性，后续可根据剧情随时调整尺度。"}},"454":{"title":"她对新手法的第一反应是什么？新玩法是探索。","descs":{"兴奋":"对新玩法第一反应是跃跃欲试、眼睛发亮。适合好奇心旺盛、被开拓后渐入佳境的角色，成长弧光明显。塑造上突出主动性，让「从生涩到熟练」的过程更有说服力。","犹豫":"第一反应是迟疑、脸红、小声试探，需要哄才点头。适合慢热或矜持系角色，自带欲拒还迎的张力。塑造上让「推拉感」成为常态，互动节奏由辞宝主导，娇羞感更真实。","拒绝":"对新玩法第一反应是摇头、躲闪，甚至小声说不。适合保守或尚未开发的角色，需要长时间铺垫。塑造上以「逐渐松口」为看点，拒绝后的让步往往比直接接受更动人。","自定义":"完全自定义第一反应，如好奇、害羞或强势。适合想写独特性格线的创作者，摆脱固定模板。塑造上让反应成为角色标签，专属感更强。"}},"455":{"title":"她被开发时的心理变化如何？心理变化是接受的过程。","descs":{"从羞耻到享受":"心理从羞耻、抗拒逐渐转为沉溺、主动索求。适合刻画「被完全开发」的角色，转变过程有层次。塑造上让反差感成为核心魅力，前期越是抗拒，后期越是反差动人。","始终抗拒":"全程羞耻且不享受，被动承受但内心抗拒。适合带悲剧感或倔强气质的角色，情绪始终紧绷。塑造上强化「被驯服但不屈」的矛盾，让剧情带着痛感与不甘。","自定义":"完全自定义心理转变过程，可加速、可逆转。适合刻画复杂内心戏的创作者，层次任你掌控。塑造上让「从抗拒到沉溺」的节奏完全贴合你的剧情。"}},"456":{"title":"她是否会主动提出新玩法？主动性是探索欲。","descs":{"会":"会主动提出新玩法，甚至列清单、拽着辞宝试。适合大胆主动、探索欲强的角色，主导感十足。塑造上让角色从「被开发」变成「共谋者」，关系更平等也更有趣。","不会":"几乎从不主动开口，全靠辞宝引导和开发。适合依赖型、被动型的角色，习惯把决定权交给对方。塑造上突出温顺与信任感，让辞宝成为唯一的「开关」。","自定义":"完全自定义主动性，如只在特定时刻主动。适合写暧昧或推拉关系的创作者，主动权灵活。塑造上让主动与否成为关系温度计，互动更有起伏。"}},"457":{"title":"她对「被强迫」play 的态度如何？这是边界的部分。","descs":{"接受":"接受被强迫类 play，能享受其中的控制感与被掌控感。适合有慕强或被驯服倾向的角色，心理上享受支配。塑造上让「表面抗拒、身体诚实」成为反差萌点，张力十足。","拒绝":"拒绝强迫类 play，强调尊重与自愿。适合重视平等互信的角色，不愿在性事中失去自主。塑造上让关系更健康，也避免剧情滑向沉重，保留温柔底色。","自定义":"完全自定义对待强迫的态度，可半推半就。适合写复杂权力关系的创作者，拿捏分寸。塑造上让「表面抗拒、实际默许」成为看点，张力由你调节。"}},"458":{"title":"她对疼痛的阈值如何？阈值是耐受度。","descs":{"低":"对疼痛阈值低，轻轻一下就会皱眉、轻呼。适合娇弱或易碎感角色，让人忍不住想疼惜。塑造上强化「怕疼却被疼爱」的软萌形象，互动以安抚为主。","中":"对疼痛有一定耐受，能接受适度刺激且不抗拒。适合平衡型角色，既不过敏也不痴迷。塑造上让痛感成为调味而非主菜，节奏可控、体验舒适。","高":"疼痛阈值高，重度刺激也能保持反应。适合强韧或特殊体质角色，自带「承受力」标签。塑造上突出耐性与隐忍，让「越痛越沉浸」成为反差，带出深度感。","自定义":"完全自定义疼痛耐受，可写局部敏感或体质特殊。适合刻画身体差异的创作者，细节更真。塑造上让痛觉成为角色记忆点，互动体验更有层次。"}},"459":{"title":"她对「失禁」play 的态度如何？这是边界的部分。","descs":{"接受":"接受失禁类 play，不抗拒失控与羞耻感。适合追求极致羞耻与失控感的角色，心理上已完全放开。塑造上让「彻底交出控制」成为信任的证明，深度绑定辞宝。","拒绝":"拒绝失禁类 play，坚持基本的体面与卫生感。适合注重干净与克制的角色，接受不了越界场景。塑造上守住日常边界，让亲密感保持在舒适区，不破坏温柔氛围。","自定义":"完全自定义失禁类态度，可写场景化或边界化。适合把控羞耻感尺度的创作者，张弛有度。塑造上让该设定成为信任的试金石，点到即止。"}},"460":{"title":"她对「公开调教」的态度如何？这是边界的部分。","descs":{"接受":"接受公开调教，享受被注视、被展示的兴奋。适合有表现欲或暴露倾向的角色，羞耻转化为刺激。塑造上让「人前清纯、人后放荡」的反差成为记忆点，张力拉满。","拒绝":"拒绝公开调教，坚持私密、只属于两人。适合内敛或占有欲强的角色，不愿被他人看见。塑造上强化「只给你一个人」的专一感，亲密被守护得更紧。","自定义":"完全自定义公开调教态度，可接受半公开或私密加特殊。适合写羞耻与暴露心理的创作者，情境任设。塑造上让「公开与否」成为剧情冲突点，张力可调。"}},"461":{"title":"她对「多人」的态度如何？这是边界的部分。","descs":{"接受":"接受多人参与，不排斥第三者的加入。适合开放或享乐型角色，追求刺激与新鲜感。塑造上让关系带有共享色彩，需注意与辞宝的独占感冲突，剧情更复杂。","拒绝":"拒绝多人，坚持一对一、身心只属于辞宝。适合专一型或占有欲强烈的角色，容不下第三个人。塑造上强化唯一性与独占欲，让「只给你」成为关系核心。","自定义":"完全自定义多人态度，可接受特定人选或情境。适合写复杂关系网的创作者，边界由你定。塑造上让「接受谁、不接受谁」成为关系线索，层次丰富。"}},"462":{"title":"她对特殊题材的态度如何？这是边界的部分。","descs":{"接受":"接受兽类相关 play，包括兽态或兽化设定。适合有兽性本能或接受异质感的角色，突破人类边界。塑造上可结合 DLC 兽人形态联动，让种族设定与性事呼应。","拒绝":"拒绝兽类相关 play，坚守人类边界与常识。适合偏好常规、排斥异质感的角色，接受范围明确。塑造上守住物种底线，避免性事与种族设定混同。","自定义":"完全自定义兽类态度，可接受特定种族或形态。适合联动 DLC 兽人设定的创作者，尺度可调。塑造上让兽元素成为特色而非负担，与种族线呼应。"}},"463":{"title":"她对超常题材的态度如何？这是边界的部分。","descs":{"接受":"接受触手等超常类 play，享受异质感带来的新奇。适合接受度极高、敢于尝试超自然设定的角色。塑造上让非人元素成为特色，可联动魔物、异族等世界观。","拒绝":"拒绝触手等超常类，坚持现实向的性体验。适合偏好写实、排斥超自然元素的角色。塑造上维持真实感，让亲密关系不脱离日常逻辑。","自定义":"完全自定义超常类态度，可接受特定魔物或异族。适合写奇幻世界观的创作者，玩法自由。塑造上让异质设定服务剧情，成为世界观的一部分。"}},"464":{"title":"她最终性方面的一句话总结是什么？总结是她的心声。","descs":{"「在辞宝面前，我毫无保留。」":"总结为「完全信任、彻底交付」，把全部身心交给辞宝。适合走「绝对忠诚」路线的角色，关系绑定最深。塑造上让这句成为角色定调，一眼记住她的归属感。","「身体和心都只给辞宝。」":"总结为「身心专属、一心一意」，强调唯一性与独占欲。适合专一型角色，把爱和欲都锚定在一个人身上。塑造上突出纯粹感，让忠诚成为角色灵魂。","「想一直被辞宝宠爱。」":"总结为「渴望被爱、需要关怀」，强调依赖与被宠的满足。适合软萌或需要安全感的角色，把亲密当成归宿。塑造上强化撒娇与依恋，让人想保护她。","自定义":"完全自定义总结句，可写誓言、告白或承诺。适合想给角色定专属台词的创作者，一字一句皆你定。塑造上让这句成为角色的灵魂签名，一眼记住。"}},"465":{"title":"她最想和你一起达成的性目标是什么？目标是她未来的期待。","descs":{"解锁新体位":"目标是尝试更多体位，追求肉体上的新鲜与变化。适合探索型角色，把性当成共同探索。塑造上强化身体互动，让关系在尝试中升温。","尝试新play":"目标是开发新玩法，追求情境与心理上的刺激。适合体验型角色，把性当成冒险。塑造上强化剧情张力，让每次 play 都有记忆点。","自定义":"完全自定义性目标，可写情感目标或具体场景。适合想把性事写进关系弧光的创作者，目标任设。塑造上让目标成为剧情方向，关系有明确奔头。"}},"466":{"title":"她的种族是什么？种族是她身份的一部分。","descs":{"纯人类":"种族为纯人类，无特殊能力或异族特征。适合走写实恋爱路线，一切贴近日常。塑造上减少设定负担，把重心放回情感与性格。","猫娘":"种族为猫娘，有猫耳与尾巴，性格常带慵懒或傲娇。适合萌系角色，自带软萌气质。塑造上可联动兽耳、尾巴的互动，增加可爱细节与亲近感。","魅魔":"种族为魅魔，自带魅惑气质与特殊体质。适合性感诱惑系角色，性张力天然拉满。塑造上让魅惑成为本能，与辞宝的互动自带撩拨。","史莱姆":"种族为史莱姆，形态可塑、身体柔软可变。适合异质设定爱好者，玩法自由度极高。塑造上让身体形态成为特色，可与触手等设定联动。","龙娘":"种族为龙娘，常带角、鳞片与力量感。适合气场强、带威严的角色，反差萌明显。塑造上结合「强大外表与柔软内心」，让保护欲与臣服感并存。","天使":"种族为天使，带翅膀与圣洁气质。适合纯洁圣洁系角色，与性事形成强烈反差。塑造上让「圣洁堕落」成为看点，禁欲与欲望的冲突极具戏剧性。","精灵":"种族为精灵，常带尖耳与自然气质，寿命长。适合清冷优雅或森系角色，自带距离感。塑造上结合超然气质，让「高冷被融化」成为关系看点。","自定义":"完全自定义种族，可写半兽、幽灵或原创种族。适合想摆脱常见模板的创作者，设定任你发挥。塑造上让原创种族成为独有标签，辨识度极高。"}},"467":{"title":"她的形态清单如何（如有多形态）？形态是她的一部分。","descs":{"人类/兽人双形态":"在人类与兽人形态间切换，日常与兽态并存。适合需要反差感的角色，形态代表不同状态。塑造上让切换成为剧情开关，双形态各有魅力。","多形态":"拥有三种以上形态，可随情境自由切换。适合设定丰富的角色，玩法弹性大。塑造上让每种形态对应不同性格侧面，故事层次更饱满。","单形态":"固定为一种形态，无切换机制。适合设定简洁、重心放在性格的角色。塑造上减少设定复杂度，让角色更稳定、更好写。","自定义":"完全自定义形态清单，可写双形态加隐藏形态。适合设定控创作者，形态数量与种类自由。塑造上让每种形态各有意义，玩法与设定都更丰满。"}},"468":{"title":"她各形态的外观差异是什么？外观差异是形态的标志。","descs":{"兽耳/尾巴":"形态差异体现在兽耳与尾巴，萌点集中在头部与尾部。适合兽系角色，互动可摸头、摇尾。塑造上让耳朵尾巴成为情感晴雨表，可爱又传神。","翅膀":"形态差异体现在翅膀，张开与收拢各有姿态。适合天使或龙系角色，自带神圣或力量感。塑造上让翅膀参与拥抱与守护，视觉记忆点强。","角":"形态差异体现在角，象征威严或力量。适合龙娘、魅魔等角色，角是身份标志。塑造上让角成为个性标签，摸角互动增加亲近感。","自定义":"完全自定义外观差异，可写鳞片、发光或纹路。适合注重细节设定的创作者，外观由你打造。塑造上让形态外观成为角色记忆点，一眼可辨。"}},"469":{"title":"她的切换权归属是谁（谁能触发）？切换权是控制权的分配。","descs":{"自己控制":"切换由她自己决定，想变就变。适合独立、自主的角色，形态是她的武器。塑造上突出掌控感，让形态变化成为主动表达。","辞宝控制":"切换权在辞宝手里，由他决定何时变身。适合依赖或臣服型角色，把形态交给对方。塑造上强化「被支配」的绑定感，切换成为亲密的开关。","情绪触发":"切换由情绪触发，兴奋、害羞时自动变身。适合情绪外露的角色，变化不由意志主导。塑造上让形态与情绪绑定，羞耻时变身尤其有戏剧性。","自定义":"完全自定义切换权归属，可写共管或条件触发。适合写复杂关系的创作者，支配关系由你设。塑造上让「谁能决定变身」成为亲密度的标志。"}},"470":{"title":"她的切换方式是什么？方式是形态的开关。","descs":{"意念":"切换靠意念瞬间完成，干净利落。适合设定简洁、动作迅速的角色。塑造上让切换成为本能，不打断节奏，战斗或亲密都顺畅。","情绪":"切换由情绪驱动，需要情绪到位。适合情感型角色，变化与心境同步。塑造上让情绪成为触发器，害羞或兴奋的瞬间变身最有张力。","外力":"切换靠外部刺激触发，如抚摸、道具。适合被动型角色，形态由外力决定。塑造上让互动与变身绑定，被触碰就变，充满未知感。","自定义":"完全自定义切换方式，可写心跳、咒语或道具触发。适合设定控创作者，触发机制任你设计。塑造上让变身方式成为世界观设定的一部分。"}},"471":{"title":"她切换时的身体感受是什么？感受是切换的印记。","descs":{"温暖":"切换时身体泛起暖意，像被阳光包裹。适合柔和系角色，变身是温暖体验。塑造上让切换成为被宠的信号，强化治愈感。","刺痛":"切换伴随轻微刺痛，像被针扎了一下。适合带痛感设定的角色，变身并不轻松。塑造上让切换带点代价感，增加真实与脆弱。","酥麻":"切换时涌过一阵酥麻，电流般窜遍全身。适合敏感或易感的角色，切换本身带刺激。塑造上让变身成为触觉记忆点，撩拨感十足。","自定义":"完全自定义切换感受，可写灼热、冰凉或发痒。适合注重体感描写的创作者，感受由你设定。塑造上让切换体验成为角色独特的触觉签名。"}},"472":{"title":"她的切换冷却或限制如何？冷却限制形态的节奏。","descs":{"无冷却":"切换无任何限制，想变就变、随意连发。适合灵活、设定轻松的角色。塑造上让形态切换成为自由技能，战斗或日常都随性。","有冷却":"切换后需等待冷却，不能连续变。适合强调策略或限制的角色，切换要挑时机。塑造上让「什么时候变」成为抉择，增加紧张感与规划性。","限时段":"切换仅在特定时段允许，如白天或夜晚。适合设定带规则的角色，形态有使用窗口。塑造上让时段成为剧情约束，比如夜行者只在夜间变身，增加世界观厚度。","自定义":"完全自定义冷却限制，可写按体力或按次数。适合写规则系设定的创作者，限制条件自由。塑造上让冷却成为角色能力的平衡点，更显真实。"}},"473":{"title":"她的默认形态是什么？默认是她平时的样子。","descs":{"人类形态":"她平日以人类之姿生活，是融入社会的常态。适用城市日常、公共场合与多数剧情互动。给人亲切的邻家感，也为隐藏兽人身份埋下伏笔。","兽人形态":"她常态维持兽人特征，是种族身份的外显。适用兽人聚落、战斗与设定展示。强化野性与异类感，日常描写需突出兽化细节。","自定义":"默认形态由你指定，可为混合或特殊状态。适用需要个性化设定的角色。把形态主动权交给设定者，便于塑造独特世界观。"}},"474":{"title":"她战斗/日常/色色形态的区分如何？区分是功能的分工。","descs":{"有区分":"三种情境形态各异，功能明确分工。适用战斗、日常、亲密三类场景切换。形态成为情境标识，切换本身可成为剧情转折点。","无区分":"所有情境共用同一形态，不因场景改变。适用设定统一的角色。形态恒定强化身份辨识度，也减少切换描写的复杂度。","自定义":"区分方式由你设计。适用需要精细场景机制的角色。赋予塑造形态生态的自由，可设计渐进或强制切换。"}},"475":{"title":"形态对她体力的影响如何？体力是形态的代价。","descs":{"消耗体力":"切换或维持形态会消耗体力，形成代价。适用战斗与连续切换剧情。形态成为有限资源，迫使她在持久战与变身间权衡。","无影响":"形态切换不牵动体力，行动自由。适用轻松或高机动性角色。变身无负担可频繁切换，突出灵活而非策略性。","恢复体力":"切换形态反而回复体力，是恢复机制。适用濒危逆转与休息场景。变身成为喘息窗口，塑造战术翻盘或疗愈型能力。","自定义":"体力影响由你定义。适用需要平衡机制的角色。可定制代价强度，塑造资源管理或爆发型角色。"}},"476":{"title":"形态对她体温的影响如何？体温是形态的印记。","descs":{"升高":"形态变化使体温升高，身体发热。适用兽化、发情或激战描写。升高体温烘托激情或狂暴，也用作生理信号的伏笔。","降低":"形态变化使体温降低，身体转凉。适用冷血系、冰属性或静谧场景。低体温塑造疏离或冷静气质，可反衬情感升温反差。","无影响":"体温恒定，形态不改变体感。适用体温稳定的角色。体温不作为叙事符号，保持描写中性，聚焦形态本身。","自定义":"体温变化规律由你设定。适用需要体温叙事的角色。可塑造冷热对比或生理节律，服务特定情感氛围。"}},"477":{"title":"她的形态特殊能力是什么？能力是形态的加成。","descs":{"飞行":"形态赋予她飞行的能力。适用空中作战、侦查与高速机动。飞行扩展空间叙事，可塑造空中视角与逃脱戏码。","治愈":"形态附带自我或他人治愈能力。适用战斗支援与疗伤场景。治愈塑造守护者定位，也平衡其输出与生存。","魅惑":"形态附带魅惑或精神影响能力。适用诱惑、控制与亲密度推进。魅惑模糊战斗与亲密边界，强化危险又迷人的气质。","自定义":"特殊能力由你设计。适用需要独特机制的角色。能力可绑定形态与世界观，塑造专属战斗与互动逻辑。"}},"478":{"title":"她色色时偏好哪一形态 ；让她对未来的态度开放而有弹性，保留剧情空间。"}},"540":{"title":"她是否愿意永远留在这个世界？愿意是关系的决心。","descs":{"愿意":"她甘愿永久留驻明渊市，把这里当作归宿。适合决意扎根、无退路的角色；彰显坚定与归属感，但失去退路，冲突时更显决绝。","犹豫":"她对留下心存摇摆，留恋旧世界或放不下牵绊。适合双世界设定或身份认同困境的故事；制造内心拉扯与选择张力，让抉择成为高潮点。","自定义":"去留取决于条件，满足前提她愿留下，否则离开。用于有条件式、可谈判的立场；把留下变成交易或考验，展现她的理性与权衡。"}},"541":{"title":"她对「被你选择」的态度如何？选择是关系的确认。","descs":{"骄傲":"她把被辞宝选中视为自身魅力与价值的证明，引以为傲。适合自信、自尊心强或好胜的角色；让她主动张扬，用偶尔的自我怀疑平衡自满。","珍惜":"她把这份选择当作难得缘分，心存感激并小心呵护。适合温柔、重情或患得患失的角色；让她谦逊深情，用行动证明珍重而非怯懦。","自定义":"骄傲与珍惜并存，视情境偏重一方。用于复杂立体的情感角色；让情绪有层次，对外骄傲、对内珍惜，塑造反差魅力。"}},"542":{"title":"她关系中的权力平衡如何？平衡是关系的动态。","descs":{"平等":"她追求与辞宝对等的关系，互相尊重、共同决策。适合现代价值观或双强设定的故事；塑造独立人格与健康关系，防角色失去个性锋芒。","辞宝主导":"她甘愿让辞宝主导关系，自己顺从依赖。适合依赖型、温柔或忠诚至上的角色；增强依附与奉献感，但要有主动的温柔而非无脑服从。","她主导":"她占据关系主导地位，掌控节奏与决定权。适合强势、腹黑或能力出众的角色；塑造女王型人格，别变单方面压制，保留对辞宝的在乎。","自定义":"权力天平随情境流动，有时退让有时主导。用于动态互动、势均力敌的故事；让关系充满博弈与张力，双方学习平衡，真实耐看。"}},"543":{"title":"她是否接受「后宫」现实？接受是关系的边界。","descs":{"接受":"她默认并容忍辞宝拥有多位伴侣的现实。适合后宫世界观已定、侧重群像互动的故事；让她理性成熟，用细腻占有欲与失落感补足情感。","不接受":"她抗拒后宫设定，渴望唯一或不愿分享。适合单线专注或引发后宫冲突的故事；让她成为变数与冲突源，敢抗争既定规则，但也易被孤立。","自定义":"接受程度视对象与情境而定，部分接受部分排斥。用于立场暧昧、关系复杂的故事；让她处于矛盾中，不舍又纠结，人物立体，矛盾持久。"}},"544":{"title":"她的底线是什么（关系层面）？底线是关系的边界。","descs":{"被专一对待":"她的底线是辞宝必须对她专一，不能分心于他人。适合强调忠诚与唯一性的情感线；让她爱得鲜明有原则，冲突点明确，防演成过度控制。","被尊重":"她的底线是获得基本尊重，人格与付出不被轻视。适合自尊心强、注重平等的角色；让她在关系中保留自我，尊严优先于占有，清醒体面。","自定义":"底线不限于专一或尊重，而是她自己在意的一条原则。用于赋予角色独特价值观的故事；让底线成为个性标签，冲突围绕其展开，鲜明真实。"}},"545":{"title":"她最终关系的一句话总结是什么？总结是她的心声。","descs":{"非他不可":"她的感情最终凝结为「非辞宝不可」，无人可替代。适合极致专情、宿命式的结局；让她的爱具排他性与决绝感，成就浓烈的情感高潮。","只想爱他":"她的愿望是纯粹地爱辞宝，不求占有，只求倾心。适合无私奉献、淡泊深情的角色；塑造温柔克制的爱，以成全而非索取为基调，情感动人。","自定义":"总结句由剧情与角色成长共同决定，不必提前定死。用于结局开放或重在过程的故事；保留结局弹性，让总结成为旅程的自然结果而非标签。"}},"546":{"title":"她的特殊能力清单如何？能力是她的一部分。","descs":{"治愈":"她拥有治愈他人的能力，能修复创伤与病痛。适合医疗型、守护型或温柔型角色；让她成为团队生命线，因消耗而脆弱，形成保护与牺牲的张力。","飞行":"她拥有自由翱翔的能力，可快速移动或空中作战。适合机动型、探索型或高机动角色；赋予自由与超然视角，但空中易脱离群体，需设计地面联结。","魅惑":"她拥有魅惑人心的能力，能影响他人情绪或意志。适合智谋型、间谍型或情感操控型角色；让魅力成为武器，但需承担被质疑真诚的代价。","自定义":"能力并非既定三项，按设定自选独特能力。用于定制化、独特定位的角色；让能力与角色内核绑定，成为专属符号与剧情切入点。"}},"547":{"title":"她能力在色色中的用途如何？用途是能力的延伸。","descs":{"敏感增强":"她可在亲密时用能力增强彼此感知，放大快感与触觉。适合高甜、注重感官体验的剧情；让亲密戏更有张力与独特性，设定代价防沦为外挂。","治愈":"她在亲密中运用治愈能力，抚平疲惫或旧伤，让关系更温情。适合温柔治愈、创伤修复型剧情；把能力与关怀绑定，亲密成为疗愈过程，情感更浓。","自定义":"能力的亲密用途由设定自由发挥，不拘泥于此。用于创意型、独特互动的剧情；让亲密场景与能力机制深度融合，形成独一无二的化学反应。"}},"548":{"title":"她能力的副作用如何？副作用是能力的代价。","descs":{"体力消耗":"使用能力会大量消耗她的体力，用后需休息恢复。适合平衡强弱、限制能力滥用的剧情；让每次施放都有代价，增加节奏与紧迫感，体现坚韧。","精神消耗":"使用能力消耗她的精神或意志，用后疲惫恍惚甚至失忆。适合强调心理代价、意志考验的剧情；让能力成为精神负担，带来性格阴影与创伤弧线。","无":"她的能力几乎没有副作用，使用自由稳定。适合爽快型、能力常驻的角色；让她可靠强大，但缺代价可能削弱张力，需用冷却或条件补足。","自定义":"副作用按设定定制，随能力与情境变化。用于精细设定、个性化机制的故事；让副作用成为角色平衡的一部分，贴合能力特性与剧情需要。"}},"549":{"title":"她能力觉醒的条件是什么？觉醒是能力的起点。","descs":{"情绪触发":"她的能力在强烈情绪波动时觉醒或增幅。适合情感驱动、成长型能力的剧情；让情绪与力量联动，战斗与情感戏互相催化，也让她学会控制情绪。","成年触发":"能力随她成年而自然觉醒，是既定命运或生理节点。适合宿命论、成长礼主题的剧情；让觉醒成为人生里程碑，带仪式感与宿命色彩，推动身份认同。","自定义":"觉醒条件不固定，由特定事件、契约或外部因素决定。用于剧情导向、伏笔式觉醒的故事；让觉醒成为剧情爆点，与主线挂钩，增强悬念期待。"}},"550":{"title":"她体力上限与恢复如何？体力是能力的基础。","descs":{"高/快":"她的体力上限高、恢复快，能持续高强度行动。适合战斗型、耐力型或全能角色；让她可靠能扛，常驻作战力量，防战力过强失去挑战性。","中":"她的体力中等，恢复平稳，需合理分配节奏。适合均衡型、注重策略的角色；让她有明确续航边界，作战讲节奏，避免鲁莽，塑造理性形象。","低":"她的体力上限低、恢复慢，易疲惫需人照顾。适合脆弱型、需被守护的角色；让她成为被保护者，触发守护剧情与温柔互动，用智慧弥补短板。","自定义":"体力设定由剧情与角色定位灵活定制。用于特殊体质或成长型设定的故事；让体力成为个性维度，与能力、性格联动，贴合定位。"}},"551":{"title":"她体温异常时的表现如何？表现是身体的信号。","descs":{"发热":"她体温异常时表现为发热，脸颊泛红、意识微醺，状态外显。适合展现脆弱感、依赖感的亲密或病弱剧情；让异常明显易察，激发保护欲，也让她羞于示弱。","发冷":"她体温异常时表现为发冷，畏寒颤抖蜷缩，需要温暖。适合展现孤独、被治愈或被拥抱的剧情；强化柔弱与渴望温暖，制造被关怀的瞬间，反衬坚强表象。","自定义":"体温异常表现不固定，随设定与情境呈现不同形态。用于个性化体质设定的故事；让异常成为她的专属设定，与能力或背景挂钩，增加辨识度。"}},"552":{"title":"她是否有毒/特殊体液？体液是身体的一部分。","descs":{"有":"她的体液带特殊性质（如毒、麻醉或疗愈），对他人有额外影响。适合奇幻设定、特殊体质或危险系角色的剧情；让亲密接触充满风险与禁忌，制造刺激与距离感。","无":"她的体液正常无异，身体与常人无异。适合贴近日常、去奇幻化的剧情；让身体设定简单自然，减少设定负担，把焦点放回情感与性格本身。","自定义":"体液特性由设定定制，可兼具多种或特定条件下才显现。用于条件触发型、细节丰富的设定；让体液特性成为隐藏变量，特定情境才激活，制造惊喜与反转。"}},"553":{"title":"她是否可变形局部？变形是能力的延伸。","descs":{"可":"可让身体局部变形，能力具象且可控。适用战斗与日常兼具的设定。赋予她「非人却亲切」的特质，温柔里藏一丝危险感，例：指尖拉长、发丝化刃。","不可":"形态完全固定，能力纯粹不含杂念。适用写实向与肉体极限的设定。魅力全来自本体而非变化，塑造克制而可信的形象。","自定义":"由你定义她的变形规则与边界。适用想给角色独一无二能力逻辑的定制创作。自定义最贴合世界观，让能力成为角色血肉。"}},"554":{"title":"她的再生能力如何？再生是能力的延伸。","descs":{"有":"具备再生能力，受伤能快速愈合。适用高对抗、高危险世界观，让战斗有底气。塑造坚韧的生命力，也暗示她可能承受过重创。","无":"无再生，伤口只能自然恢复。适用真实残酷的设定，每一次伤都留下痕迹。塑造惜身与脆弱感，战斗需谨慎，代价看得见。","自定义":"由你定义她的再生速度与限制。适用想把恢复力做成角色叙事线索的创作。让伤势与痊愈成为情感与剧情的推动器。"}},"555":{"title":"她对疼痛的超常耐受如何？耐受是身体的边界。","descs":{"高":"对疼痛超常耐受，能忍常人难忍之痛。适用战斗、受刑、极限环境等高压剧情。塑造外柔内刚的坚韧，忍痛时反而更冷静、更让人心疼。","低":"对疼痛异常敏感，一点小伤都皱眉。适用细腻情感向与脆弱感设定。塑造她娇气易伤的一面，也让她被呵护的戏份更自然。","自定义":"由你定义她的耐痛阈值与表现。适用想把身体反应做成情绪细节的创作。耐痛程度会直接决定她受伤时的反应与台词。"}},"556":{"title":"她的精神类能力如何？精神能力是她的暗面。","descs":{"读心":"能读取他人思想，精神系能力。适用悬疑、信任考验、亲密试探类剧情。塑造她洞悉一切的敏锐，也让辞宝必须对她绝对坦诚。","魅惑":"能魅惑影响他人，精神系能力。适用情感博弈与吸引力主导的设定。塑造她撩人而危险的气质，让靠近她的人都难以自拔。","无":"无精神类能力，完全靠本心与直觉。适用纯真纯粹、无需心机的角色。塑造她的坦诚与信任，情感全靠相处一点点积累。","自定义":"由你定义她的精神能力类型与限制。适用想让精神系成为剧情核心的创作。能力会决定她如何看人、如何拉近或防御。"}},"557":{"title":"她的召唤或使役能力如何？召唤是能力的延伸。","descs":{"有":"具备召唤或使役能力，能唤来助力。适用世界观庞大、有阵营对抗的设定。塑造她并非孤身一人，背后或有守护者与追随者。","无":"无召唤使役能力，凡事亲力亲为。适用独立坚韧的角色设定。塑造她凡事靠自己的可靠，战斗与生活皆不假手于人。","自定义":"由你定义她的召唤对象与规则。适用想构建专属使魔或召唤体系的创作。召唤物会成为她的标志性符号，影响世界观观感。"}},"558":{"title":"她与你能力的互动如何？互动是关系的连接。","descs":{"共鸣":"能力与辞宝产生共鸣，同频共振。适用双人羁绊系设定，能力随感情增强。塑造两者命运相连，共鸣越深、羁绊越不可分割。","互补":"能力与辞宝互补，彼此填补短板。适用搭档与协作向设定。塑造她与辞宝是天造地设的一对，缺一不可，配合天衣无缝。","自定义":"由你定义她与辞宝的互动方式。适用想让能力联动成为剧情亮点的创作。互动规则会成为两人关系的独特语言。"}},"559":{"title":"她能力暴露的风险如何？风险是能力的代价。","descs":{"高":"能力极易暴露，行动处处受限。适用高压世界、有追捕与保密线的设定。塑造她谨慎隐忍，能力是武器也是随时引爆的隐患。","低":"能力不易暴露，行动自由从容。适用轻松向或身份公开的设定。塑造她从容不迫，能力是底牌而非负担，生活更松弛。","自定义":"由你定义她的暴露风险与代价。适用想把能力代价做成叙事张力的创作。风险高低会决定她敢不敢放手使用能力。"}},"560":{"title":"她最终特殊设定的一句话是什么？总结是她的心声。","descs":{"「我的能力只为辞宝而存在。」":"能力存在的全部意义只指向辞宝。适用深情专一、以一人为世界的设定。塑造她能力即心意，越强大越证明爱的纯粹。","「能力是辞宝给我的礼物。」":"把能力视为辞宝所赠，珍贵而感恩。适用被爱滋养、相互成就的设定。塑造她因被爱而完整，能力是爱的回响。","「为了辞宝，我可以动用一切。」":"为辞宝可倾尽所有，决意而炽热。适用救赎、守护与牺牲向设定。塑造她义无反顾，能力是她爱意最锋利的证明。","自定义":"由你设计她的最终心声。适用想让灵魂深处的答案独一无二的创作。这句总结会成为角色最核心的情感锚点。"}},"561":{"title":"她有无专属道具或信物？信物是关系的锚点。","descs":{"有":"有专属道具或信物，如手链、挂饰。适用用物品承载回忆的关系向设定。塑造信物是两人之间的实体锚点，睹物即思人。","无":"无专属信物，感情全凭心与记忆。适用淡泊、不重外物的设定。塑造她无需外物证明爱，真心本身即是最牢靠的信物。","自定义":"由你定义她的信物与来历。适用想用一件物品串起整段故事的创作。信物的来历与含义会沉淀为角色专属的叙事符号。"}},"562":{"title":"她有无专属称呼体系？称呼是关系的温度。","descs":{"有":"有专属称呼体系，如只叫你特定昵称。适用亲密关系向设定，称呼即关系尺度。塑造她如何称呼你，是情感深浅最直接的注脚。","无":"无专属称呼，随大众或直呼其名。适用克制内敛、不轻易表露的设定。塑造她情感内藏，反而更真实，亲近感需要慢慢建立。","自定义":"由你定义她的称呼方式与习惯。适用想让称呼成为角色辨识度的创作。专属称呼会强化两人关系的独特性与私密感。"}},"563":{"title":"她有无隐藏形态或最终形态？隐藏是设定的暗线。","descs":{"有":"有隐藏或最终形态，是设定的暗线。适用长线叙事、有终极爆发与反转的设定。塑造她藏着王牌，关键时刻形态揭示会震撼全场。","无":"无隐藏形态，展现即全部实力。适用明快直接、不藏悬念的设定。塑造她坦荡通透，实力一眼见底，反而更显可靠。","自定义":"由你定义她的隐藏形态与触发条件。适用想把形态做成关键转折的创作。形态的解锁条件会成为剧情推进的重要引擎。"}},"564":{"title":"她与「指令条」的绑定程度如何？绑定是世界的规则。","descs":{"完全绑定":"与指令条完全绑定，行动受规则约束。适用硬核规则系设定，指令即铁律。塑造她一举一动都有章法，自由与服从之间充满张力。","部分":"与指令条部分绑定，某些行为受限。适用松紧适中的设定，规则留有弹性。塑造她既有约束也有自由，在边界上灵活游走。","无":"与指令条无关，行为完全自主。适用自由随性、无规则束缚的设定。塑造她无拘无束，一切选择皆出本心。","自定义":"由你定义她与指令条的绑定关系。适用想把世界规则做成角色一部分的创作。绑定程度决定她行动的边界与自由感。"}},"565":{"title":"她角色最核心的不可替代性是什么？不可替代是她的价值。","descs":{"只有我能给辞宝的这种温度":"她独有的温度无人能替。适用治愈系与唯一性设定。塑造她的存在本身即是辞宝的归处，别人给不了的温柔只有她有。","独一无二的能力与性格组合":"能力与性格的组合独一无二。适用角色差异化与辨识度设定。塑造她是不可复制的存在，任何复制都失去神髓。","辞宝专属的默契与羁绊":"她与辞宝的默契与羁绊专属。适用双人相依、灵魂契合的设定。塑造两人之间无需言语的懂得，是任何人都插不进的联结。","自定义":"由你定义她的不可替代性核心。适用想让角色价值独一无二的创作。这个核心会成为她区别于所有角色的根本标签。"}},"566":{"title":"她的AL攀升系数定位如何？系数是快感的节奏。","descs":{"极快×1.5":"攀升极快，节奏最猛烈。适用追求极速与爆发张力的设定。塑造她反应强烈而直接，情动来得又快又深，掌控感需格外小心。","快×1.2":"攀升快，节奏明快。适用爽利直接的互动设定。塑造她情动来得干脆，情绪表露自然，互动流畅而带热度。","标准×1.0":"攀升标准，节奏均衡。适用平稳自然的设定。塑造她反应温和可预期，情感起伏有度，最易驾驭也最真实。","慢×0.7":"攀升慢，节奏舒缓。适用细腻绵长的互动设定。塑造她需要时间与耐心，层层深入，慢热反而更显珍贵。","极慢×0.5":"攀升极慢，节奏最缓。适用极致慢热与深水向设定。塑造她如冰雪渐融，需要极大耐心，一旦动情则深沉难测。","自定义":"由你定义她的攀升节奏与系数。适用想精确控制互动节奏的创作。系数直接决定她情动快慢与互动张弛。"}},"567":{"title":"她AL边缘徘徊带的行为特征如何（85~99时她会做什么说什么）？这是快感的临界。","descs":{"求饶":"在边缘时会软声求饶。适用展现脆弱与依赖的设定。塑造她情动到极致时放下骄傲，娇软求饶是卸下所有防备的瞬间。","抓床单":"在边缘时会抓紧床单。适用表现克制与挣扎的设定。塑造她身体诚实却口难开，紧抓床单是隐忍与失守的交界。","夹腿":"在边缘时会夹腿蜷缩。适用羞涩与自我保护向设定。塑造她本能想躲又逃不开，夹腿是身体诚实防线的崩塌。","自定义":"由你定义她边缘时的行为与话语。适用想让临界戏份有辨识度的创作。具体动作会成为她情动时最鲜明的个人烙印。"}},"568":{"title":"她发情期的日期段如何（每月具体日期）？日期是身体的节律。","descs":{"每月1-5日":"发情期在月初1-5日。适用想把情感节点放在月初的设定。塑造月初是她周期性的脆弱与依赖期，形成稳定节律。","每月10-14日":"发情期在月中10-14日。适用想把情感节点放在中旬的设定。塑造月中成为两人固定的亲密时段，形成规律期待。","每月20-25日":"发情期在月末20-25日。适用想把情感节点放在月底的设定。塑造月末是她的周期性回归期，形成月度闭环。","自定义":"由你定义她的发情期日期段。适用想把周期做成剧情节拍器的创作。具体日期会决定她每月何时最脆弱、最需要陪伴。"}},"569":{"title":"她发情期个人特有的症状如何（在28条通用之外）？这是身体的信号。","descs":{"格外粘人":"发情期格外粘人，寸步不离。适用依赖感与亲密向设定。塑造她平时独立、此时却只想黏着你，反差强化依恋。","体温升高":"发情期体温升高，身体发烫。适用感官描写与生理向设定。塑造她的发热成为可触碰的亲密信号，也暗示情动加深。","食欲改变":"发情期食欲改变，或增或减。适用生活化细节与反差向设定。塑造她的身体节律影响日常，小细节让角色更鲜活。","自定义":"由你定义她的特有症状与表现。适用想让发情期有个人辨识度的创作。症状越独特，角色在周期里的形象越鲜明。"}},"570":{"title":"她的作息类型如何？作息是生活的节律。","descs":{"标准（23-7）":"作息标准，23点睡7点起。适用规律生活与安定向设定。塑造她自律健康，早晨有精神，相处节奏平稳可靠。","夜猫（1-10）":"作息夜猫，凌晨1点睡10点起。适用夜行与慵懒向设定。塑造她夜晚清醒、白天补觉，深夜的陪伴成为专属时光。","晨型（22-5）":"作息晨型，22点睡5点起。适用早起元气与自律向设定。塑造她清晨最有活力，晨光里的她是另一种模样。","随缘":"作息随缘，困了睡醒了起。适用随性自由、不受约束的设定。塑造她生活随性洒脱，陪伴时间不固定，却更显自在。","自定义":"由你定义她的作息与入睡时刻。适用想让作息成为角色一部分的创作。作息决定她白天与夜晚分别是什么状态。"}},"571":{"title":"她的微信打字风格如何？打字是距离的呼吸。","descs":{"多用表情包":"微信多用表情包表达。适用活泼跳脱、不擅文字表述的设定。塑造她情绪靠表情传达，文字少而表情丰富，生动有趣。","句尾带语气词":"句尾常带语气词，如呢、呀、嘛。适用软萌亲昵、有温度的设定。塑造她文字自带情绪，句句都像在撒娇或感叹。","简洁直接":"微信简洁直接，言简意赅。适用干练利落、不喜废话的设定。塑造她文字干净有力，字少却句句在点子上。","自定义":"由你定义她的打字风格与习惯。适用想让聊天文字有辨识度的创作。打字风格会决定隔着屏幕她给人的温度与距离。"}},"572":{"title":"她微信表情包风格与常用系列如何？表情是情绪的表达。","descs":{"可爱系":"常用可爱系表情包。适用活泼甜美的设定。塑造她聊天充满萌感，可爱表情是她表达亲近的默认方式。","沙雕系":"常用沙雕系表情包。适用幽默搞笑、反差萌的设定。塑造她文字正经而表情沙雕，反差让人忍俊不禁。","软萌系":"常用软萌系表情包。适用温柔治愈的设定。塑造她表情柔软无害，隔着屏幕也透出暖意，抚慰人心。","自定义":"由你定义她的表情包风格与系列。适用想让聊天风格独一无二的创作。表情包系列会成为她性格的延伸名片。"}},"573":{"title":"她朋友圈内容生态如何（发什么、频率、可见范围）？朋友圈是生活的窗。","descs":{"日常碎碎念":"核心是高频发日常小事，吐槽生活、晒吃喝日常。适用场景是想塑造亲近、生活化、黏人形象。影响是朋友圈像实时日记，拉近真实感，便于制造日常糖点。","美照":"核心是晒精修美照，自拍、穿搭、出游随手拍。适用场景是想突出颜值与对外形象、吸引目光。影响是塑造精致女神人设，适合颜值路线，也带若即若离感。","仅辞宝可见":"核心是朋友圈只对你开放，内容全是私密日常。适用场景是想写独占、专属、双人世界。影响是强化只为你绽放的专属感，读者视她为限定恋人。","自定义":"核心是自定义她的朋友圈内容生态。适用场景是有独特设定或特殊人设。影响是直接写入微信档案（第43章），自由定制发什么、频率、可见范围。"}},"574":{"title":"她在群聊里的行为模式如何（在「辞宝后援会」里是什么担当）？群聊是社交的舞台。","descs":{"活跃担当":"核心是群里话最多，接梗、控场、暖场。适用场景是想写社交达人、阳光外向。影响是第一梯队矩阵里她是气氛核心，群聊戏份多，性格立体。","潜水":"核心是几乎不发言，偶尔冒泡只回表情或关键词。适用场景是想写安静、高冷、旁观者。影响是存在感低但神秘，适合留白式塑造，偶尔一条消息即成糖点。","表情包担当":"核心是话不多但表情包输出惊人，用图说话。适用场景是想写幽默、软萌、会接梗。影响是塑造行走表情包形象，群聊氛围轻松有趣。","自定义":"核心是自定义她在群里的担当。适用场景是有特定人设或特殊群聊需求。影响是写入微信生态（第43章）与第一梯队矩阵，按需定制。"}},"575":{"title":"她的腿长如何（cm，与身高比例合理）？腿长是身体的一部分。","descs":{"85cm":"核心是85cm，比例标准匀称。适用场景是想写普通偏上、自然身材。影响是身体数据总表（第33章）取值合理，搭配身高更显协调，叙事平实。","90cm":"核心是90cm，明显修长。适用场景是想写腿型好看、比例出众。影响是总表字段合理，适合写大长腿情节，视觉记忆点强。","95cm":"核心是95cm，超长比例。适用场景是想写极致腿长、模特身材。影响是总表取值偏高需注意身高匹配，塑造惊艳感但别过度夸张。","自定义":"核心是自定义腿长数值。适用场景是有特定身高或比例需求。影响是写入身体数据总表（第33章），需与身高保持合理比例。"}},"576":{"title":"她的脚码与脚型如何（希腊/埃及/罗马）？脚型是身体的一部分。","descs":{"36码/希腊脚":"核心是36码小脚，希腊脚（二趾最长）。适用场景是想写娇小、精致足部。影响是身体数据总表字段，小码更显少女感，希腊脚常配细高跟叙事。","37码/埃及脚":"核心是37码中码，埃及脚（大趾最长）。适用场景是想写均衡、大众脚型。影响是总表字段标准通用，适合多数鞋型，叙事不易出戏。","38码/罗马脚":"核心是38码稍大，罗马脚（前三趾近等长）。适用场景是想写偏大脚、运动型。影响是总表字段，塑造利落或运动感，脚部叙事更写实。","自定义":"核心是自定义脚码与脚型。适用场景是有特定足部设定需求。影响是写入身体数据总表（第33章），影响足部叙事与穿鞋细节。"}},"577":{"title":"她的手指长度与手部细节如何？手是她身体的延伸。","descs":{"修长白皙":"核心是手指修长、肤白、骨节分明。适用场景是想写优雅、弹琴或写字的形象。影响是手部叙事更唯美，适合牵手、握笔、递物等唯美桥段。","纤细":"核心是手指纤细、手腕细。适用场景是想写柔弱、精致少女感。影响是手部细节显脆弱，适合被握住、被包裹的亲密描写。","肉感":"核心是手指圆润有肉、手掌软。适用场景是想写可爱、软糯形象。影响是手部触感描写更暖，适合拥抱、揉捏等软糯桥段。","自定义":"核心是自定义手指与手部细节。适用场景是有特定手部设定需求。影响是写入身体数据总表（第33章），自由塑造手部叙事。"}},"578":{"title":"她体香三态的气味变化曲线如何（平静/动情/事后）？体香是身体的印记。","descs":{"奶香→甜→淡":"核心是平静奶香，动情转甜，事后变淡。适用场景是想写温软、奶甜系。影响是嗅觉叙事（第48章）清晰，动情时甜味强化，事后余味淡去，层次柔和。","花香→浓→余韵":"核心是平静花香，动情变浓，事后留余韵。适用场景是想写成熟、馥郁系。影响是嗅觉叙事更浓烈，动情时花香浓郁，事后余韵绵长，张力强。","自定义":"核心是自定义三态气味曲线。适用场景是有特定气味设定需求。影响是写入气味与体液状态表（第48章），自由设定平静、动情、事后变化。"}},"579":{"title":"她爱液味觉与质地如何？爱液是身体的一部分。","descs":{"微甜/拉丝":"核心是味道微甜、质地拉丝、量偏多。适用场景是想写清甜、湿润型。影响是体液体系（第48章）字段，口交描写更顺滑，触感与味道都偏温柔。","无味/稀":"核心是味道清淡近无、质地稀薄。适用场景是想写自然、低调型。影响是体液字段写实，口交叙事更日常，不易过度渲染。","咸/浓稠":"核心是味道偏咸、质地浓稠。适用场景是想写浓郁、强烈型。影响是体液字段更刺激，口交与亲密描写张力更强，感官冲击明显。","自定义":"核心是自定义味觉与质地。适用场景是有特定体液设定需求。影响是写入体液体系（第48章），按需塑造口交与亲密体验。"}},"580":{"title":"她初夜状态预设如何？初夜是关系的里程碑。","descs":{"❌未发生+预定":"核心是初夜未发生，但已规划预定场景。适用场景是想写矜持、期待、慢慢升温。影响是初夜档案室（第47章）核心，保留第一次悬念，前戏铺垫更长。","✅已发生":"核心是初夜已发生，有既定记忆。适用场景是想写成熟、关系已突破。影响是初夜档案室字段填已发生，可直接写初夜回忆或后续对比。","自定义":"核心是自定义初夜状态与背景。适用场景是有特殊背景或已发生加特殊设定。影响是写入初夜档案室（第47章），按需设定状态与来龙去脉。"}},"581":{"title":"她初夜预定的名场面是什么（未发生者填期望）？名场面是记忆的锚点。","descs":{"卧室/传教士/脸红":"核心是卧室、传教士体位、她脸红。适用场景是想写温柔、私密、羞怯初夜。影响是初夜档案室（第47章）名场面锚点，场景温馨，脸红细节成记忆点。","天台/后入/拥抱":"核心是天台、后入体位、事后拥抱。适用场景是想写刺激、浪漫、开放初夜。影响是名场面更有冲击力，环境与拥抱叠加，情绪与场面都更浓。","自定义":"核心是自定义期望场景、体位、细节。适用场景是有特定名场面需求。影响是写入初夜档案室（第47章），自由设定被记住的那一幕。"}},"582":{"title":"她好感度起点与增长偏好如何？好感是关系的进度。","descs":{"起点60/被夸最快":"核心是起点60，被夸奖涨最快。适用场景是想写被认可就开心、吃软不吃硬。影响是好感度系统（第38章）字段，嘴甜攻略高效，塑造受夸奖型性格。","起点40/拥抱最快":"核心是起点40，被拥抱涨最快。适用场景是想写慢热、肢体亲密型。影响是好感度起点中等，肢体接触推进更快，适合写身体接触升温。","起点70/陪伴最快":"核心是起点70，被陪伴涨最快。适用场景是想写高好感、重陪伴型。影响是好感度起点高，日常陪伴最有效，塑造依恋、黏人形象。","自定义":"核心是自定义起点与增长偏好。适用场景是有特定好感度需求。影响是写入好感度系统（第38章），按需设定初始值与涨点路径。"}},"583":{"title":"她好感度100时的专属表现如何？满好感是独一份的仪式。","descs":{"专属称呼解锁":"核心是满好感解锁她专属称呼，只对你一人。适用场景是想写独占、唯一性。影响是好感度档案（第38章）终极表现，称呼成为关系里程碑，专属感拉满。","专属暗号":"核心是满好感解锁专属暗号，一个只属于你们的手势或词。适用场景是想写默契、心照不宣。影响是终极表现有仪式感，暗号可反复触发互动，塑造灵魂伴侣感。","自定义":"核心是自定义满好感专属仪式或行为。适用场景是有特定终极表现需求。影响是写入好感度档案（第38章），自由设定独一份的满好感奖励。"}},"584":{"title":"她前戏流程特化如何（F1~F5中哪段延长/跳过）？特化是节奏的定制。","descs":{"F2延长":"核心是延长F2（轻吻、抚触）阶段，节奏放慢。适用场景是想写温柔、缠绵型。影响是前戏流程分级（第45章）字段，延长预热让亲密戏更绵长、更重情调。","F4跳过":"核心是跳过F4阶段，直奔主题。适用场景是想写急切、直接型。影响是前戏流程分级字段，省略一段让节奏更快，冲击感更强。","全流程":"核心是F1到F5完整走完，不删不减。适用场景是想写标准、仪式感强。影响是前戏流程分级字段，节奏完整，铺垫充分，塑造讲究的体验感。","自定义":"核心是自定义哪段延长或跳过。适用场景是有特定节奏需求。影响是写入前戏流程分级（第45章），按需定制亲热节奏。"}},"585":{"title":"她单场耐力轮次如何？耐力是体验的深度。","descs":{"1-2轮":"核心是单场1到2轮，偏短。适用场景是想写易满足、快节奏。影响是耐力与回合制系统（第46章）字段，塑造易疲劳或易满足型，叙事节奏紧凑。","3-4轮":"核心是单场3到4轮，中等。适用场景是想写均衡、持久型。影响是耐力字段居中，回合制体验均衡，适合多数写实场景。","5轮以上":"核心是单场5轮以上，高耐力。适用场景是想写强欲、超持久型。影响是耐力字段偏高，可写多轮拉锯，但需注意身体合理性，别过度。","自定义":"核心是自定义单场轮次。适用场景是有特定耐力需求。影响是写入耐力与回合制系统（第46章），按需设定强度。"}},"586":{"title":"她体位偏好前三名与绝对拒绝项如何？偏好是身体的地图。","descs":{"传教士/后入/骑乘":"核心是偏好传教士、后入、骑乘三种经典。适用场景是想写主流、全面型。影响是体位百科（第41章）字段，经典三式好写好画，覆盖面广。","后入/侧入/站立":"核心是偏好后入、侧入、站立，更偏多样。适用场景是想写探索、多变型。影响是体位百科字段，组合更进阶，适合写尝试新体位的刺激桥段。","自定义":"核心是自定义前三名与拒绝项。适用场景是有特定体位需求。影响是写入体位百科（第41章），按需设定偏好与绝对拒绝项。"}},"587":{"title":"她场所胆量系数如何（L0~L5敢到哪里）？胆量是场所的边界。","descs":{"L0（卧室）":"核心是仅限卧室（L0），绝不外放。适用场景是想写保守、私密型。影响是场所风险等级表（第50章）字段，塑造矜持形象，胆量最低，安全边界强。","L2（半公开）":"核心是敢到半公开场所，如阳台、车内。适用场景是想写大胆、刺激型。影响是风险等级表字段，半公开带来紧张感，适合写心跳加速的冒险。","L4（室外）":"核心是敢到室外，如天台、野外。适用场景是想写极度大胆、刺激型。影响是风险等级表字段，室外风险高，塑造野性形象，戏剧张力最强。","自定义":"核心是自定义胆量等级。适用场景是有特定场所需求。影响是写入场所风险等级表（第50章），按需设定敢到的边界。"}},"588":{"title":"她玩具偏好与绝杀技如何？绝杀是她的独门。","descs":{"跳蛋绝杀":"核心是专属跳蛋，高频震动是绝杀技。适用场景是想写精巧、易上手型。影响是玩具实战编排（第51章）字段，跳蛋便携精准，塑造细腻掌控感。","按摩棒":"核心是专属按摩棒，深压震动是绝杀技。适用场景是想写强力、深度型。影响是玩具实战编排字段，按摩棒力道足，塑造更深入、更满足的体验。","自定义":"核心是自定义玩具与绝杀技。适用场景是有特定玩具设定需求。影响是写入玩具实战编排（第51章），按需设定专属武器与独门技巧。"}},"589":{"title":"她高潮决定权执行细节如何（user未下令时她在边缘带的求赦话术）？这是快感的临界。","descs":{"求饶撒娇":"核心是未下令时在边缘带撒娇求饶，求放行。适用场景是想写黏人、直白型。影响是快感等级系统（第44章）衔接，求饶话术增加互动感，塑造依赖她的形象。","忍忍忍":"核心是未下令时强忍，死死咬唇硬扛。适用场景是想写隐忍、克制型。影响是快感等级系统衔接，强忍塑造倔强性格，张力与反差感更强。","自定义":"核心是自定义边缘带求赦话术。适用场景是有特定话术需求。影响是写入快感等级系统（第44章）与高潮决定权条款，按需定制。"}},"590":{"title":"她与第一梯队七人的关系预设如何（至少点名两位）？关系是世界的网络。","descs":{"与林清浅友好":"核心是与林清浅关系友好，常互相照应。适用场景是想写闺蜜、互助线。影响是第一梯队矩阵（第32章）字段，塑造友善社交面，为群像戏铺路。","与林月染竞争":"核心是与林月染存在竞争，暗暗较劲。适用场景是想写张力、对立线。影响是第一梯队矩阵字段，竞争关系制造冲突与戏剧性，互动更有火花。","自定义":"核心是自定义与七人的关系。适用场景是有特定人物关系网需求。影响是写入第一梯队矩阵（第32章），至少点名两位定制相处模式。"}},"591":{"title":"她的称呼体系如何（她叫你什么/希望被叫什么/进阶链）？称呼是关系的温度。","descs":{"辞宝→老婆":"核心是她叫你辞宝，希望被叫老婆。适用场景是想写甜蜜、归属型。影响是称呼、关系对照总表（第27章）字段，称呼体现关系进度，塑造亲密感。","老公→宝宝":"核心是她叫你老公，希望被叫宝宝。适用场景是想写黏人、娇俏型。影响是称呼总表字段，老公、宝宝对仗亲昵，塑造依赖与撒娇感。","自定义":"核心是自定义称呼与进阶链。适用场景是有特定称呼需求。影响是写入称呼、关系对照总表（第27章），按需设定她叫你和被叫的称呼链。"}},"592":{"title":"她居住地与亲密空间预设如何？空间是关系的场景。","descs":{"卧室/夜间/温馨":"核心是卧室、夜间触发、氛围温馨。适用场景是想写私密、安稳型。影响是亲密空间（第14、40章）字段，夜间卧室最安全私密，适合写睡前温情。","天台/雨天/浪漫":"核心是天台、雨天触发、氛围浪漫。适用场景是想写文艺、氛围型。影响是亲密空间字段，天台配雨营造氛围感，浪漫戏码更出彩。","自定义":"核心是自定义空间与触发规则。适用场景是有特定空间需求。影响是写入亲密空间（第14、40章），按需设定触发指令、时间锚定与特有规则。"}},"593":{"title":"她专属记忆编号申请如何（预留编号段）？编号是记忆的坐标。","descs":{"#600+":"预留专属记忆库入口编号段，作为私有记忆的起点。适用：建立独立于全局的记忆分区，方便检索与回溯。塑造影响：编号越高越接近内心珍藏，暗示有大量不愿示人的私密记忆。","#700+":"更高编号段，位于记忆库更深处、更少被触及的区域。适用：标记深层创伤、秘密或不愿回放的记忆。塑造影响：越深的编号越难触发，塑造角色的防备感与疏离底色。","#800+":"记忆库尾端编号，几乎无人能到达的禁区。适用：存放最核心也最不可触碰的记忆。塑造影响：暗示角色有连自己都不愿面对的部分，为角色埋下谜团与悬念。","自定义":"自定编号段，可绑定特定含义、时间点或事件。适用：按剧情需要自由设定，与角色经历深度挂钩。塑造影响：让编号本身成为叙事线索，增强记忆设定的专属感。"}},"594":{"title":"她一句话人设内核是什么？内核是她最不可替代的总结。","descs":{"想被坚定选择":"内心渴望被坚定地选中、不被动摇地留在某人身边。适用：设定缺爱与渴望被爱的底层动机。塑造影响：让「被选择」成为角色行动的内驱力，解释其依赖与占有欲的根源。","只想爱辞宝":"全部情感只投向辞宝一人，专注且排他。适用：刻画极致专一、眼里再无他人的爱情观。塑造影响：把角色世界收窄到一人，强化忠诚也放大偏执风险。","自定义":"自拟一句话内核，可注入更复杂或矛盾的动机。适用：需要突破模板、塑造独特心理底色。塑造影响：让内核成为角色所有行为的逻辑起点，深度可控。"}},"595":{"title":"她是否确认登记？确认后答案自动写入各档案表。","descs":{"确认登记":"确认将答案写入发情期表、初夜档案室、好感度表等各档案，完成落库。适用：结束设定环节，进入正式角色应用阶段。塑造影响：锁定当前人格设定，避免漂移，保证前后一致性。","暂不登记":"暂缓写入，保留修改余地，先观察或继续补充。适用：设定未定型、想再调整时。塑造影响：为角色保留弹性空间，但可能造成前后设定的不连贯。","自定义":"自定义登记范围，可选择性写入部分档案。适用：只想应用部分答案、其余暂留时。塑造影响：精细控制哪些设定生效，适合逐步解锁角色细节。"}},"596":{"title":"她呆毛/情绪外显器官如何（有无/位置/变化规则）？呆毛是情绪的晴雨表。","descs":{"有呆毛/随情绪动":"头顶呆毛随情绪变化摆动，成为情绪的外显窗口。适用：用呆毛动态替代表情描写，增强萌点与表现力。塑造影响：把角色情绪可视化，利于快速捕捉当下状态。","无":"没有呆毛，情绪不通过外显器官表现。适用：设定内敛、克制、喜怒不形于色的形象。塑造影响：情绪需借其他方式传达，增加解读成本，塑造沉稳感。","自定义":"自定呆毛的有无、位置与变化规则。适用：按角色设定自由设计，可绑定专属情绪信号。塑造影响：让外显机制成为角色个性标签，增强辨识度。"}},"597":{"title":"她美瞳/伪装系统如何？伪装是外表的保护色。","descs":{"伪装高冷/真实软萌":"对外展示高冷外壳，真实软萌只给辞宝看。适用：设定反差萌角色，对外与私下形成强烈对比。塑造影响：制造双面性，强调辞宝是唯一能看到真实的人，加深羁绊。","无伪装":"不戴任何面具，表里如一。适用：设定坦率、直接、不设防的角色。塑造影响：减少解读层次，让真诚感突出，但可能缺乏反差张力。","自定义":"自定对外伪装与对内真实的细节。适用：需要更细腻的双面人设或特殊伪装机制。塑造影响：让伪装本身成为剧情伏笔，赋予角色身份深度。"}},"598":{"title":"她双重人格切换的触发器是什么？触发器是人格的开关。","descs":{"独处时":"独自一人时从对外人格切回对内人格。适用：设定角色需要卸下防备的私密时刻。塑造影响：独处成为唯一真实的时空，强化「只有自己时才是自己」的孤独底色。","被辞宝抱时":"被辞宝抱住瞬间切回对内人格。适用：把卸防条件绑定在辞宝的身体接触上。塑造影响：拥抱成为人格切换的开关，让亲密接触拥有仪式感与决定性。","自定义":"自定切换触发器，可绑定特定动作、声音或场景。适用：需要更隐蔽或更戏剧化的切换条件。塑造影响：让切换机制成为叙事钩子，制造张力与伏笔。"}},"599":{"title":"她泪点与哭法如何（几滴式/嚎啕式/无声式）？哭法是情绪的出口。","descs":{"几滴式":"哭起来只有几滴泪，隐忍克制、强撑体面。适用：设定强忍情绪、不愿示弱的角色。塑造影响：几滴泪反而比嚎啕更有冲击力，突出坚硬外壳下的脆弱。","嚎啕式":"哭起来放声大哭，情绪宣泄彻底。适用：设定情感外露、压抑阈值低的角色。塑造影响：嚎啕代表情绪防线脆弱，容易引发共情与保护欲。","无声式":"哭起来没有声音，只有泪无声滑落。适用：设定极度隐忍、习惯性压抑的角色。塑造影响：无声的哭最具窒息感，暗示习惯独自承受，增强心疼感。","自定义":"自定哭的方式、眼泪量级与伴随动作。适用：按角色性格定制哭戏细节。塑造影响：让哭法成为角色情绪表达的独特标识。"}},"600":{"title":"她笑点与笑法如何（阈值/音色）？笑法是情绪的阳光。","descs":{"易笑/清脆":"笑点低，容易被逗笑，笑声清脆。适用：设定阳光、亲和、情绪外露的角色。塑造影响：易笑拉近距离感，但可能掩盖真实情绪，形成表层乐观。","不易笑/低":"笑点高，很难被逗笑，笑声低沉。适用：设定沉稳、内敛、情绪克制的角色。塑造影响：笑成为稀有反应，一旦展露就格外珍贵，强化反差。","自定义":"自定笑点阈值与笑声音色。适用：需要更贴合角色性格的笑声设定。塑造影响：笑声是角色声线的一部分，自定可增强声音辨识度。"}},"601":{"title":"她深层恐惧清单如何（按「失去哪个最崩溃」排序）？恐惧是她最深的软肋。","descs":{"失去辞宝>孤独>黑暗":"最怕失去辞宝，其次孤独与黑暗。适用：设定以辞宝为情感核心的角色。塑造影响：恐惧排序让行为逻辑可预测，失去辞宝成为最致命的软肋。","被辞宝抛弃>被遗忘>疼痛":"最怕被辞宝抛弃，其次被遗忘与疼痛。适用：设定患得患失、安全感缺失的角色。塑造影响：被抛弃的恐惧塑造讨好与占有倾向，解释极端行为。","见不到辞宝>被无视>失去自我":"最怕见不到辞宝，其次被无视与失去自我。适用：设定依赖性强、自我价值绑定他人的角色。塑造影响：把自我锚定在辞宝身上，暗示可能失去个体独立性。","自定义":"自定恐惧清单及排序。适用：需要更贴合角色背景的恐惧设定。塑造影响：恐惧是角色软肋的直接暴露，自定可精准打造角色弱点。"}},"602":{"title":"她手指在你身上的「常驻位置」如何？常驻位置是亲密的坐标。","descs":{"牵手":"默认牵着辞宝的手，十指相扣或轻握。适用：设定亲密、黏人、需身体接触确认存在的角色。塑造影响：牵手是最日常的亲密证明，强化「随时确认你在」的依赖感。","勾小指":"用勾小指代替牵手，更轻更俏皮。适用：设定含蓄、细腻、带点孩子气的角色。塑造影响：勾小指是更隐晦的约定，暗示角色把关系视为某种契约。","挽手臂":"挽着辞宝的手臂，贴近而行。适用：设定依赖、需要支撑与归属感的角色。塑造影响：挽手臂强调愿意把自己交给对方，体现安心与占有。","自定义":"自定手指常驻位置与姿势。适用：需要更特别或更贴合身体习惯的设定。塑造影响：身体接触习惯是亲密度的直接外显，自定可增强专属感。"}},"603":{"title":"她睡相细节如何（滚床方向/睡姿/梦话/半夜行为）？睡相是放松的证据。","descs":{"抱枕睡/说梦话":"抱着枕头睡觉，睡梦中会说话。适用：设定缺乏安全感、需要怀抱替代物的角色。塑造影响：抱枕暗示现实中缺一个怀抱，梦话泄露潜意识，制造反差萌。","蜷缩/无梦话":"蜷缩身体入睡，不说梦话。适用：设定习惯自我保护、内心封闭的角色。塑造影响：蜷缩是防御性睡姿，暗示对外界缺乏信任，无梦话则保留隐秘。","自定义":"自定睡姿、滚床方向与梦话内容。适用：需要更个性化的睡眠细节。塑造影响：睡相是角色最无防备的瞬间，自定可强化私密感与萌点。"}},"604":{"title":"她手机相册构成如何？相册是她心事的存放处。","descs":{"辞宝照60%/合照30%/其他10%":"以辞宝照片为主，合照次之，其他少量。适用：设定日常记录型、情感外显的角色。塑造影响：相册比例直观反映辞宝在角色心里的权重，60%已明显偏重。","辞宝照80%/合照15%/其他5%":"辞宝照片占绝大比例，其他极少。适用：设定极致专注、眼里只有辞宝的角色。塑造影响：80%的比例暗示生活几乎被辞宝填满，占有欲强烈。","全是辞宝+加密相册有秘密":"相册全是辞宝，还有加密相册藏秘密。适用：设定情感浓烈且留有隐藏面的角色。塑造影响：加密相册成为叙事钩子，暗示有未公开的心事或执念。","自定义":"自定相册比例与加密内容。适用：需要更贴合角色生活习惯的设定。塑造影响：相册是情感浓度的可视证据，自定可精准控制占有程度。"}},"605":{"title":"她记日记/手账习惯如何？日记是心事的出口。","descs":{"每天记/恋爱日常":"每天写日记，记录与辞宝的恋爱日常。适用：设定细致、重视细节、情感持续输出的角色。塑造影响：每天记录说明辞宝居于生活核心，日记成为情感证据。","偶尔记":"只在特殊日子记录，频率低。适用：设定随性、不刻意记录的角色。塑造影响：偶尔记反而让每篇都珍贵，暗示对重大节点格外看重。","自定义":"自定日记频率、内容与固定结尾句。适用：需要更贴合角色表达习惯的设定。塑造影响：日记是角色内心独白的窗口，自定可塑造表达风格与叙事节奏。"}},"606":{"title":"她专属纪念日清单如何（私下另记的日子）？纪念日是心事的锚点。","descs":{"初见纪念日":"私下牢记初次相遇的日子。适用：设定念旧、重视起点的角色。塑造影响：初见是关系原点，私下铭记强化「一切从那天开始」的宿命感。","第一次约会":"私下牢记第一次约会的日子。适用：设定珍视关系节点、有仪式感的角色。塑造影响：第一次约会标志关系质变，铭记它体现角色对关系进度的在意。","自定义":"自定私下另记的特殊日子。适用：需要更贴合角色个人经历的纪念日设定。塑造影响：纪念日是角色情感地图的坐标，自定可埋下专属伏笔。"}},"607":{"title":"她对你的物品收藏癖如何（藏了什么/供在哪个等级）？收藏是心事的仪式。","descs":{"藏外套/供在床头":"藏了辞宝的外套，供奉在床头。适用：设定极度依恋、需辞宝气味陪伴的角色。塑造影响：把外套当圣物供奉，体现对辞宝的极致占有与依赖。","无":"不收藏辞宝的物品。适用：设定独立、不过度依赖的角色。塑造影响：无收藏癖让角色显得克制理性，与收藏型角色形成对比。","自定义":"自定收藏的物品与供奉等级。适用：需要更贴合角色个性的收藏设定。塑造影响：收藏物是角色执念的实物化，自定可强化专属羁绊与萌点。"}},"608":{"title":"她「收纳双标」如何（对自己乱vs对辞宝东西的整理癖）？双标是爱意的证据。","descs":{"自己乱/辞宝的整齐":"自己东西乱放，但辞宝的东西整理得整整齐齐。适用：设定双标式照顾、把辞宝置于特权的角色。塑造影响：双标直接体现辞宝的优先级，乱衬托对辞宝的用心。","都整齐":"自己与辞宝的东西都收拾整齐。适用：设定自律、有条理、有掌控感的角色。塑造影响：整齐体现对秩序的需求，也暗示把辞宝纳入自己管理的范围。","自定义":"自定对己与对辞宝的整理程度差异。适用：需要更精细的双标刻画。塑造影响：收纳双标是隐性偏心的外显，自定可精准控制偏爱表达。"}},"609":{"title":"她出门前腻歪流程如何（磨蹭多久/固定话术/最后一下）？腻歪是离别的温度。","descs":{"磨蹭10min/「再抱一下」":"出门前磨蹭十分钟，固定说「再抱一下」。适用：设定黏人、舍不得分离的角色。塑造影响：固定话术成为角色标签，磨蹭时长量化其依恋程度。","磨蹭5min/「亲一下再走」":"出门前磨蹭五分钟，固定说「亲一下再走」。适用：设定表达亲密更主动、带点撒娇的角色。塑造影响：亲吻是比拥抱更进一步的亲昵，体现主动索取爱意。","磨蹭15min/「晚上早点回来」":"出门前磨蹭十五分钟，叮嘱晚上早点回来。适用：设定牵挂型、有等待焦虑的角色。塑造影响：等待叮嘱暗示独自在家的孤独，强化牵挂与依赖。","自定义":"自定磨蹭时长、话术与最后的动作。适用：需要更贴合角色个性的出门设定。塑造影响：出门仪式是日常甜蜜的高光，自定可塑造独特离别仪式。"}},"610":{"title":"她生气时的替代行为如何（不吵架前提下）？生气是她的小情绪。","descs":{"鼓脸颊":"生气时鼓起脸颊不说话。适用：设定孩子气、生气也带萌感的角色。塑造影响：鼓脸颊是软化冲突的可爱武器，让生气变成一种撒娇。","背对":"生气时背对辞宝不说话。适用：设定别扭、需要被主动哄的角色。塑造影响：背对是无声的抗议，把「求哄」的主动权交给辞宝，强化互动张力。","写小纸条":"生气时用写小纸条代替直接沟通。适用：设定内敛、不擅长直说的角色。塑造影响：纸条是表达脆弱的方式，把情绪物化，形成专属沟通暗号。","自定义":"自定生气时的替代行为。适用：需要更贴合角色性格的生气方式。塑造影响：生气方式是角色个性最鲜活的切片，自定可强化辨识度。"}},"611":{"title":"她「第一次」微档案如何（牵手/初吻/叫老公 时间与场景）？第一次是记忆的锚点。","descs":{"牵手/初吻/叫老公 全部已发生":"第一次牵手、初吻、叫老公都已发生。适用：设定关系已进入深水区、亲密表达成熟。塑造影响：三个节点全解锁，暗示关系稳定，称呼已定型。","牵手已发生/初吻未发生":"已牵手但初吻尚未发生。适用：设定关系处于暧昧上升期、进度克制。塑造影响：未解锁的初吻成为待推进的悬念，制造期待感与张力。","从牵手到叫老公的完整时间线":"完整记录从牵手到叫老公的整个时间线。适用：设定注重节点记录、有仪式感的角色。塑造影响：完整时间线把关系进度叙事化，每一步都成为情感坐标。","自定义":"自定各节点的发生状态与场景。适用：需要按剧情自定义关系进度。塑造影响：节点解锁程度直接决定关系阶段，自定可精准控制剧情走向。"}},"612":{"title":"她身体的小秘密如何（只有你知道的一处hidden spot或体质细节）？小秘密是你的专属。","descs":{"腰侧怕痒":"腰侧怕痒，是只有辞宝知道的敏感点。适用：设定身体接触的专属权限，强化辞宝唯一性。塑造影响：怕痒点成为辞宝专属的亲密开关，暗示身体记忆与信任绑定。","耳后敏感":"耳后是敏感点，只有辞宝知道。适用：设定亲密接触中的专属反应区。塑造影响：敏感点绑定辞宝一人，让亲密互动拥有独一无二的专属感。","自定义":"自定只有辞宝知道的身体细节。适用：需要更贴合角色体质或设定的细节。塑造影响：身体秘密是角色对辞宝无条件信任的证据，自定可增强专属羁绊。"}},"613":{"title":"她对你身体的私人昵称如何？昵称是亲密的暗语。","descs":{"「大辞宝」「辞宝的宝贝」":"把亲密物捧成「大辞宝」，称呼自带宠溺分量，是爱意最直白的量尺。适合床戏昵称与挑逗场景，让辞宝的羞怯更真实。塑造上强化她全盘接受你的归属感，越羞越叫，越叫越黏。","「小辞宝」「辞宝的小可爱」":"用「小可爱」包装，把私密物说得又甜又无害，是反差萌的调情起点。适合初次亲密或纯情桥段，降低紧张感、制造脸红。塑造上让她又羞又忍不住笑，凸显孩子气的可爱一面。","「辞宝的剑」「辞宝的棒棒」":"「剑」「棒棒」是俏皮代称，带一点调侃和玩闹，把严肃场面变成游戏。适合打闹式亲密、角色扮演或故意逗她的场合。塑造上让辞宝又气又笑，展现她愿意陪你疯的纵容。","自定义":"昵称由你定义，等于亲手定下两人的亲密暗语。可贴合设定造专属梗，比如结合职业、爱好或初次回忆。塑造上让昵称成为贯穿全篇的记忆锚点，一叫即回放当时的羞与甜。"}},"614":{"title":"她加密相册内容如何（存了你什么角度的照片）？加密相册是她的秘密。","descs":{"辞宝睡颜/背影/腹肌照":"收集的是你的睡颜、背影与腹肌，是「不被打扰的你」，偷拍视角自带占有欲。适合日常细节与独自翻看场景，让她一个人时也有寄托。塑造上强调她把你看作收藏品，痴迷又私密。","辞宝各种角度的私密照":"存满各种角度的私密照，是欲望与执念的具象化，锁起来的都是她不公开的你。适合深恋与占有欲叙事。塑造上让辞宝既是珍藏者又是猎人，暗示对你身体的独占欲望。","只有一张辞宝最珍贵的瞬间":"只留一张最珍贵的瞬间，是克制到极致的深情，越少越重。适合「唯一性」叙事与回忆杀场景，一张照片可反复回味。塑造上让辞宝显出专一与偏执，一张即全部，分量远超千张。","自定义":"相册内容由你定义，直接写入日常档案。可设定特殊拍摄角度、特定衣物或纪念日留档，让每张都有故事。塑造上让相册成为两人感情的底片，翻到哪一页都能唤醒一段回忆。"}},"615":{"title":"她高潮后的独占时段行为如何（事后10~15分钟她要什么）？独占是她的黏度。","descs":{"被抱":"事后只想被你紧紧抱住，是身体被掏空后的第一份安全感。适合事后温存与安抚场景，让高潮后的空白被拥抱填满。塑造上让辞宝在高潮后极度依恋你，展现她卸下防备后的软。","撒娇":"事后用撒娇来索取继续的温柔，是高潮后仍想被你哄着的小心思。适合粘人系事后戏与「再来一次」的暗示桥段。塑造上让辞宝把高潮当作撒娇的借口，又娇又贪，黏度拉满。","自定义":"行为由你定义，写入身体档案。可设定她想要听情话、要你喂水、或蜷在你怀里数呼吸。塑造上让这段独占时段成为两人最私密的仪式，每次事后都固定上演。"}},"616":{"title":"她发情期对「遥控权」的态度如何（玩具遥控给不给）？遥控权是信任的刻度。","descs":{"给辞宝":"把遥控器交给你，是发情期里最彻底的信任，等于把失控交到你手里。适合发情期玩具play与第51章实战。塑造上让辞宝自愿放权，把安全感与依赖都托付给你。","自己控制":"发情期她偏要自己握着节奏，是不肯全盘交付的倔强与自尊。适合半推半就与拉锯式亲密桥段。塑造上让辞宝既沉溺又想保持主控，反差出好强与害羞。","自定义":"态度由你定义，写入发情期表。可设定她只在某个阶段交出遥控、或故意乱按逗你、或非要你求她。塑造上让遥控权成为发情期的专属仪式，随设定决定她是顺从还是调皮。"}},"617":{"title":"她生理期与发情期的情绪差异对照如何？对照是身体的节律。","descs":{"生理期低落/发情期粘人":"生理期低落、发情期粘人，把一个月分成低谷与高峰，情绪起伏鲜明。适合日常节律叙事与照顾场景。塑造上让辞宝的脆弱与热烈交替，形成可预期的情绪时钟。","生理期烦躁/发情期主动":"生理期烦躁、发情期主动，是「刺猬与猫」的两极切换。适合反差叙事与「惹她生气再哄好」的桥段。塑造上让辞宝在烦躁时难哄、主动时大胆，性格张力更强。","生理期安静/发情期撒娇":"生理期安静、发情期撒娇，是把情绪调成安静的柔与发情期的甜。适合温柔日常与软萌反差场景。塑造上让辞宝显出水一般的温和，撒娇是她表达需要的出口。","自定义":"对照由你定义，写入发情期表。可设定生理期嗜睡、发情期话痨，或相反，让节律更有个人色彩。塑造上让每月的情绪起伏成为角色的生理节拍，读者能预判她的状态。"}},"618":{"title":"她醉酒/微醺状态设定如何？醉酒是她放松的另一面。","descs":{"酒品好/更粘人/胆量变大":"酒品好、更粘人、胆量变大，是酒后卸下壳的可靠样子。适合微醺反差场景与酒后表白桥段，让平时不敢说的都说出口。塑造上让辞宝酒后更依赖你，醒后却假装失忆，又羞又可爱。","酒品差/会哭/藏不住话":"酒品差、会哭、藏不住话，是委屈与真心话的泄洪口。适合酒 <script>
/* ============================================================
 * 搭角色 V4.1 · engine.js · 纯业务逻辑（无 DOM，可 node 测试）
 *   - 体量配额换算
 *   - 分层随机抽题（核心题强制纳入 → 档案零留空）
 *   - 档案组装（声明式模板驱动）
 *   - 14 条世界观检查自动校验
 *   - markdown 导出
 * ============================================================ */
(function (root, factory) {
  if (typeof module !== 'undefined' && module.exports) module.exports = factory(
    require('./config.js'), require('./schema.js')
  );
  else { root.AIRA = root.AIRA || {}; Object.assign(root.AIRA, factory(root.AIRA, root.AIRA)); }
})(typeof self !== 'undefined' ? self : this, function (CONFIG, SCHEMA) {
  'use strict';

  const { VOLUME_MAP, CUSTOM_RATIO, LAYER_INFO } = CONFIG;
  const { DASH, ARCHIVE_SCHEMA, CORE_FIELD, CHECK_LIST, REGISTER_LIST, getCoreIds, hasAnswer } = SCHEMA;

  /* ---------- 洗牌（Fisher-Yates，可注入 rng 便于测试） ---------- */
  function shuffle(arr, rng) {
    const a = arr.slice();
    const r = rng || Math.random;
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /* ---------- 题目可问性判定（按元信息过滤） ----------
     NSFW 层：仅非 SFW 向可问；
     DLC 双性配置（cat 含「双性配置」）：仅 dlc9=是 且 非 SFW 向可问；
     其余（SFW / DLC 种族·世界观·能力 / 体系登记 / 补完）始终可问。 */
  function isEligible(q, meta) {
    const m = meta || {};
    if (q.layer === 'NSFW') return m.orientation !== 'SFW';
    if (q.layer === 'DLC') {
      const isFuta = (q.cat && String(q.cat).includes('双性配置'));
      if (isFuta) return m.dlc9 === '是' && m.orientation !== 'SFW';
      return true;
    }
    return true;
  }

  /* ---------- 体量配额换算 ---------- */
  function getLayerQuota(meta) {
    const m = meta || {};
    let sfw = 0, nsfw = 0, dlc = 0;
    const vol = Number(m.volume) || 240;
    if (VOLUME_MAP[vol]) {
      ({ sfw, nsfw, dlc } = VOLUME_MAP[vol]);
    } else {
      const total = Math.min(CONFIG.TOTAL_QUESTIONS, Math.max(10, vol));
      sfw = Math.round(total * CUSTOM_RATIO.sfw);
      nsfw = Math.round(total * CUSTOM_RATIO.nsfw);
      dlc = Math.round(total * CUSTOM_RATIO.dlc);
    }
    if (m.dlc9 === '否') { nsfw += dlc; dlc = 0; }
    // SFW 向：NSFW 题量归零匀给 SFW；DLC 保留（种族/世界观/能力仍可问）
    if (m.orientation === 'SFW') { sfw += nsfw; nsfw = 0; }
    return { sfw, nsfw, dlc };
  }

  /* ---------- 分层随机抽题 ---------- */
  /* 每层：核心题（档案引用）强制纳入；再从非核心随机补到 max(配额, 核心数)。
     体系登记 / 补完层为必答全问。返回按层分组、层内按 id 升序的 plan。 */
  function buildPlan(meta, questions, rng) {
    const m = meta || {};
    const qs = questions || [];
    const coreIds = new Set(getCoreIds(m));
    const quota = getLayerQuota(m);
    const plan = [];

    const layers = [
      { name: 'SFW', target: quota.sfw },
      { name: 'NSFW', target: quota.nsfw },
      { name: 'DLC', target: quota.dlc },
      { name: '体系登记', target: Infinity },
      { name: '补完', target: Infinity },
    ];

    layers.forEach(L => {
      // 只取「可问」的题（按元信息过滤 NSFW / 双性配置）
      const pool = qs.filter(q => q.layer === L.name && isEligible(q, m));
      const core = pool.filter(q => coreIds.has(q.id));
      const rest = pool.filter(q => !coreIds.has(q.id));
      const need = L.target === Infinity ? rest.length : Math.max(0, L.target - core.length);
      const extra = shuffle(rest, rng).slice(0, need);
      const block = core.concat(extra).sort((a, b) => a.id - b.id);
      block.forEach(q => {
        plan.push({
          qid: q.id, layer: q.layer, cat: q.cat, title: q.title,
          parse: q.parse, options: q.options || [], required: !!q.required,
        });
      });
    });
    return plan;
  }

  /* ---------- 进度统计 ---------- */
  function countProgress(plan, answers) {
    const total = plan.length;
    const done = plan.filter(p => hasAnswer(answers[p.qid])).length;
    const layerStats = {};
    plan.forEach(p => {
      layerStats[p.layer] = layerStats[p.layer] || { total: 0, done: 0 };
      layerStats[p.layer].total++;
      if (hasAnswer(answers[p.qid])) layerStats[p.layer].done++;
    });
    return { total, done, remaining: total - done, layerStats };
  }

  /* ---------- 档案组装（零留空） ---------- */
  function buildArchive(meta, answers, questions) {
    const m = meta || {};
    const ans = answers || {};

    const get = (id) => {

      return hasAnswer(v) ? String(v).trim() : DASH;
    };
    const name = hasAnswer(ans[1]) ? String(ans[1]).trim() : '未命名';

    const sections = [];
    ARCHIVE_SCHEMA.forEach(sec => {
      if (sec.when && !sec.when(m)) return;   // 区块级条件（如 SFW 向隐藏 NSFW）

        const val = row.get(get);
        rows.push({ label: row.label, value: val });
      });
      sections.push({ title: sec.title, rows });
    });

    const coreVal = CORE_FIELD.get(get);
    return { meta: { ...m }, name, sections, core: coreVal };
  }

  /* ---------- 14 条自动校验 ---------- */
  function runChecks(meta, answers, extra) {
    const m = meta || {};
    const a = answers || {};
    const ctx = { meta: m, answers: a, registers: (extra && extra.registers) || {}, REGISTER_LIST };
    return CHECK_LIST.map(c => {
      let result;
      try { result = c.auto(m, a, ctx) || { status: 'manual', reason: '' }; }
      catch (e) { result = { status: 'manual', reason: '校验异常：' + e.message }; }
      return { id: c.id, title: c.title, desc: c.desc, status: result.status, reason: result.reason };
    });
  }

  /* ---------- 登记值速览 ---------- */
  function registerPreview(answers) {
    const get = (id) => { const v = answers[id]; return hasAnswer(v) ? String(v).trim() : DASH; };
    return [
      ['发情期日期段', get(568), '第三十一章'],

      ['称呼体系', get(591), '第二十七章'],

      ['身体数据', `${get(251)} / ${get(256)}`, '第三十三章'],
      ['微信档案', get(571), '第四十三章'],
    ];

  /* ---------- markdown 导出 ---------- */
  function archiveToMarkdown(archive, meta) {
    const m = meta || {};
    const md = [];
    md.push(`# 角色档案 · ${archive.name}（V4.2 全字段版 · 精细度对标林晴祈）`);
    md.push('');
    md.push(`> 生成时间：${new Date().toLocaleString('zh-CN')} ｜ 工具：搭角色 V4.2 ｜ 题量：${m.volume || 240} 题`);
    md.push('');
    archive.sections.forEach(sec => {
      md.push(`## ${sec.title}`);
      md.push('');
      sec.rows.forEach(r => {
        md.push(`- **${r.label}**：${r.value}`);
      });
      md.push('');
    });
    md.push(`## ${CORE_FIELD.label}`);
    md.push('');
    md.push(`> ${archive.core}`);
    md.push('');
    md.push('---');
    md.push('## 体系登记流水');
    md.push('');
    md.push('- [ ] 发情期表（第三十一章）');
    md.push('- [ ] 初夜档案室（第四十七章）');
    md.push('- [ ] 好感度表（第三十八章）');
    md.push('- [ ] 身体数据总表（第三十三章）');
    md.push('- [ ] 称呼表（第二十七章）');
    md.push('- [ ] 微信档案（第四十三章）');
    md.push('- [ ] 作息矩阵（第四十二章）');
    md.push('- [ ] 关系矩阵（第三十二章）');
    md.push('- [ ] 亲密空间（第四十章，如有）');
    return md.join('\n');
  }

  /* ---------- 元信息默认值 ---------- */
  function defaultMeta() {
    return {
      gender: null, volume: 240, volumeCustom: '', orientation: null,
      dlc9: null, race: null, raceMulti: false, strictNaming: true,
    };
  }

  /* ---------- SillyTavern 角色卡导出（V2 / V3） ----------
   * 返回角色卡对象（JSON.stringify 前无需其他处理）。
   * opts.version: 2 或 3
   */
  function archiveToSillyTavern(archive, meta, opts) {
    const o = opts || {};
    const v = o.version === 3 ? 3 : 2;
    const md = archiveToMarkdown(archive, meta || {});
    const m = meta || {};
    const name = archive.name || '新角色';
    // 从性格层提取 personality（取"性格"相关行，无则用核心）
    let personality = archive.core || '';
    const charSec = archive.sections.find(s => /性格/.test(s.title));
    if (charSec) {
      const lines = charSec.rows.slice(0, 5).map(r => `${r.label}：${r.value}`);
      personality = lines.join('\n');
    }
    const data = {
      name,
      description: md,
      personality: personality,
      scenario: m.orientation || '',
      first_mes: `「早上好呀，辞宝…」${name}揉着眼睛，声音带着刚醒的软糯。今天也要一起度过呀。`,
      mes_example: `<START>\n{{char}}：辞宝，你今天心情怎么样呀？`,
      creator_notes: `由搭角色 V${CONFIG.VERSION} 生成 ｜ 性别：${m.gender || '-'} ｜ 题量：${m.volume || '-'} ｜ 什么向：${m.orientation || '-'} ｜ DLC9：${m.dlc9 || '-'} ｜ 种族：${m.race || '-'}`,
      system_prompt: '你是一个温柔、黏人、占有欲很强的女孩子（祈宝系角色）。请始终以第一人称、口语化、有亲密感的方式回应。',
      post_history_instructions: '',
      alternate_greetings: [],
      tags: ['搭角色', 'AIRA', 'RP'],
      creator: 'AIRA · 搭角色',
      character_version: CONFIG.VERSION,
      extensions: {},
    };
    if (v === 3) {
      return {
        spec: 'chara_card_v3',
        spec_version: '3.0',
        data: Object.assign({}, data, { group_only_greetings: [] }),
      };
    }
    return { spec: 'chara_card_v2', spec_version: '2.0', data };
  }

  /* ---------- 完整 JSON 档案导出（便于二次编辑/导入） ---------- */
  function archiveToJSON(archive, state) {
    const s = state || {};
    return {
      format: 'aira-archive',
      version: CONFIG.VERSION,
      exportedAt: new Date().toISOString(),
      meta: archive.meta || {},
      name: archive.name,
      core: archive.core,
      sections: archive.sections,
      answers: s.answers || {},
      checks: s.checks || {},
      registers: s.registers || {},
    };
  }

  return {
    shuffle, getLayerQuota, buildPlan, countProgress, isEligible,
    buildArchive, runChecks, registerPreview, archiveToMarkdown,
    archiveToSillyTavern, archiveToJSON, defaultMeta,
    LAYER_INFO,
  };
});

<script>
/* ============================================================
 * 搭角色 V4.2 · storage.js · localStorage 持久化 + 版本迁移 + 记忆快照
 * 浏览器端使用 localStorage；node 测试可注入 mock storage。
 * ============================================================ */
(function (root, factory) {
  if (typeof module !== 'undefined' && module.exports) module.exports = factory(
    require('./config.js')
  );
  else { root.AIRA = root.AIRA || {}; Object.assign(root.AIRA, factory(root.AIRA)); }
})(typeof self !== 'undefined' ? self : this, function (CONFIG) {
  'use strict';

  const KEY = CONFIG.STORAGE_KEY;
  const MKEY = CONFIG.MEMORY_KEY;
  const OLD_KEY = 'aira_dajuese_v41';
  const VERSION = CONFIG.VERSION;

  /* 默认 State（用于迁移补齐缺失字段） */
  function defaultState() {
    return {
      version: VERSION,
      meta: { gender: null, volume: 240, volumeCustom: '', orientation: null, dlc9: null, race: null, raceMulti: false, strictNaming: true },
      askMode: null, batchSize: 5,
      plan: [], currentIndex: 0, answers: {},
      stage: 'welcome', generatedArchive: null,
      checks: {}, registers: {},
      testScene: null, testStarted: false, testMsgs: [],
      memoryFreq: CONFIG.DEFAULT_MEMORY_FREQ,   // 记忆自动弹窗频率（题数，0=关闭）
      memNotified: 0,                            // 已触发过自动提示的答题数（防重复）
      theme: '祈宝粉',                            // 主题色名
      darkMode: false,                           // 暗色模式
      lang: 'zh',                                // 语言
      log: [],                                   // 操作日志
      customMandatory: {},                       // 用户自定义必答 {qid:true}
      season: '',                                // 季节（沉浸感）
      sound: CONFIG.DEFAULT_SOUND,               // 音效开关
      stamps: {},                                // 印章收集 {key:true}
      /* V1.0 双子：外观/流畅/自定义 */
      style: 'sakura',                           // 界面风格：sakura | ios27 | material3
      animLevel: 2,                              // 动画等级：0关 1少 2全
      flowMode: '标准',                          // 流畅模式：标准 | 流畅
      fontScale: 1,                              // 字号缩放
      btnRadius: null,                           // 自定义按钮圆角（null=跟随风格）
      customCSS: '',                             // 自定义主题 CSS
      vib: false,                                // 触觉反馈
      fpsShow: false,                            // 性能面板（FPS）
      reduceMotion: false,                       // 强制减少动画
      /* 沉浸/声音细节开关 */
      showSnippet: true,                         // 提交后小片段
      quote: true,                               // 祈宝语录
      showTheater: true,                         // 小剧场
      showAvatar: true,                          // 微表情头像
      showStamps: true,                          // 印章收集
      showScroll: true,                          // 档案卷轴
      showPrivacy: true,                         // NSFW 私密感
      showBg: true,                              // 背景氛围
      typeSpeed: '中',                           // 打字速度 快/中/慢
      volume: 80,                                // 音效音量 0-100
      vibPower: 40,                              // 震动强度 0-100
      useVirtualList: true,                      // 题库概览虚拟化
      autoSave: true,                            // 自动保存
      speak: false,                              // 朗读题目（语音）
      musicOn: false,                            // 背景音乐开关
      musicIndex: 0,                             // 当前曲目
      savedAt: null,
    };
  }

  /* 版本迁移（v41 → v42；未来版本在此扩展） */
  function migrate(data) {
    if (!data || typeof data !== 'object') return defaultState();
    const base = defaultState();
    const out = Object.assign({}, base, data);
    // 关键字段兜底
    out.meta = Object.assign({}, base.meta, data.meta || {});
    out.plan = Array.isArray(data.plan) ? data.plan : [];
    out.answers = (data.answers && typeof data.answers === 'object') ? data.answers : {};
    out.checks = (data.checks && typeof data.checks === 'object') ? data.checks : {};
    out.registers = (data.registers && typeof data.registers === 'object') ? data.registers : {};
    out.testMsgs = Array.isArray(data.testMsgs) ? data.testMsgs : [];
    out.memoryFreq = typeof data.memoryFreq === 'number' ? data.memoryFreq : CONFIG.DEFAULT_MEMORY_FREQ;
    out.memNotified = typeof data.memNotified === 'number' ? data.memNotified : 0;
    out.theme = (typeof data.theme === 'string' && CONFIG.THEMES[data.theme]) ? data.theme : '祈宝粉';
    out.darkMode = !!data.darkMode;
    out.lang = (data.lang === 'en') ? 'en' : 'zh';
    out.log = Array.isArray(data.log) ? data.log : [];
    out.customMandatory = (data.customMandatory && typeof data.customMandatory === 'object') ? data.customMandatory : {};
    out.season = (typeof data.season === 'string' && CONFIG.SEASONS.includes(data.season)) ? data.season : '';
    out.sound = typeof data.sound === 'boolean' ? data.sound : CONFIG.DEFAULT_SOUND;
    out.stamps = (data.stamps && typeof data.stamps === 'object') ? data.stamps : {};
    out.version = VERSION;
    return out;
  }

  /* 读取时若当前 key 无数据，尝试从旧版本 key 迁移 */
  function load(storage) {
    const st = storage || (typeof localStorage !== 'undefined' ? localStorage : null);
    if (!st) return null;
    try {
      let raw = st.getItem(KEY);
      let migratedFromOld = false;
      if (!raw) {
        raw = st.getItem(OLD_KEY);
        if (raw) {
          migratedFromOld = true;
          // 迁移后保留旧数据一份，不删除（用户可回退）
        }
      }
      if (!raw) return null;
      const data = migrate(JSON.parse(raw));
      if (migratedFromOld) {
        // 写入新 key，便于后续自动保存接管
        try { st.setItem(KEY, JSON.stringify(data)); } catch (e) { /* 忽略 */ }
      }
      return data;
    } catch (e) {
      return null;
    }
  }

  /* 保存：返回 {ok, error}，error ∈ 'quota' | 'unavailable' */
  function save(state, storage) {
    const st = storage || (typeof localStorage !== 'undefined' ? localStorage : null);
    if (!st) return { ok: false, error: 'unavailable' };
    try {
      const payload = Object.assign({}, state, { version: VERSION, savedAt: Date.now() });
      st.setItem(KEY, JSON.stringify(payload));
      return { ok: true };
    } catch (e) {
      // QuotaExceededError：存储满
      if (e && (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014)) {
        return { ok: false, error: 'quota' };
      }
      return { ok: false, error: 'unavailable' };
    }
  }

  function clear(storage) {
    const st = storage || (typeof localStorage !== 'undefined' ? localStorage : null);
    if (!st) return false;
    try { st.removeItem(KEY); return true; } catch (e) { return false; }
  }

  /* ===== 记忆快照 CRUD ===== */
  function loadMemories(storage) {
    const st = storage || (typeof localStorage !== 'undefined' ? localStorage : null);
    if (!st) return [];
    try {
      const raw = st.getItem(MKEY);
      if (!raw) return [];
      const arr = JSON.parse(raw);
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }

  function saveMemories(list, storage) {
    const st = storage || (typeof localStorage !== 'undefined' ? localStorage : null);
    if (!st) return { ok: false, error: 'unavailable' };
    try {
      st.setItem(MKEY, JSON.stringify(Array.isArray(list) ? list : []));
      return { ok: true };
    } catch (e) {
      if (e && (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014)) return { ok: false, error: 'quota' };
      return { ok: false, error: 'unavailable' };
    }
  }

  function addMemory(memory, storage) {
    const list = loadMemories(storage);
    list.unshift(memory);
    return saveMemories(list, storage);
  }

  function updateMemory(id, patch, storage) {
    const list = loadMemories(storage);
    const i = list.findIndex(m => m.id === id);
    if (i < 0) return { ok: false, error: 'notfound' };
    list[i] = Object.assign({}, list[i], patch);
    return saveMemories(list, storage);
  }

  function deleteMemory(id, storage) {
    const list = loadMemories(storage).filter(m => m.id !== id);
    return saveMemories(list, storage);
  }

  return {
    KEY, MKEY, OLD_KEY, VERSION, defaultState, migrate, load, save, clear,
    loadMemories, saveMemories, addMemory, updateMemory, deleteMemory,
  };
});

</script>
<script>
/* ============================================================
 * 搭角色 V4.1 · app.js · UI 层（浏览器专用）
 * 依赖：window.AIRA（config/schema/engine/storage，由前置 script 注入）
 * ============================================================ */
'use strict';

(function () {
  const AIRA = window.AIRA;
  const CONFIG = AIRA;
  const SCHEMA = AIRA;
  const ENGINE = AIRA;
  const STORE = AIRA;

  /* ===== 工具 ===== */
  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => document.querySelectorAll(sel);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const hasAnswer = (v) => v != null && String(v).trim() !== '' && String(v).trim() !== '—';
  const isCustomOpt = (o) => /自定义|自定/.test(String(o ?? ''));

  /* 合并题库扩展（题目扩充 + 选项详细介绍）到 QUESTIONS */
  function applyQuestionExt() {
    const ext = window.QUESTION_EXT;
    const qs = window.QUESTIONS;
    if (!ext || !qs) return;
    qs.forEach(q => {
      const e = ext[q.id];
      if (!e) return;
      if (e.title) q.title = e.title;
      if (e.descs) q.optionDescs = e.descs;
    });
  }

  /* ===== 全局状态 ===== */
  const State = {
    ...STORE.defaultState(),
    meta: ENGINE.defaultMeta(),
    viewingAnswered: false,   // 是否正在回看已答题（prev 用）
  };

  let autosaveTimer = null;

  function toast(msg, type = '') {
    const c = $('#toast-container');
    if (!c) return;
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = msg;
    el.setAttribute('role', 'status');
    el.setAttribute('aria-live', 'polite');
    c.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 2600);
  }

  /* 自动保存（防抖） */
  function scheduleSave() {
    clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(() => { saveNow(); }, CONFIG.AUTOSAVE_DELAY);
  }
  let quotaWarned = false;
  function saveNow() {
    clearTimeout(autosaveTimer);
    const r = STORE.save(State);
    if (r && r.ok === false) {
      if (r.error === 'quota' && !quotaWarned) {
        quotaWarned = true;
        toast('⚠️ 本地存储空间不足，进度可能无法完整保存，请清理浏览器存储', 'error');
        setTimeout(() => { quotaWarned = false; }, 8000);
      }
    }
    return r;
  }

  /* 精确进度（供进度条 / 进度弹窗复用） */
  function progressPct() {
    const prog = ENGINE.countProgress(State.plan, State.answers);
    return { prog, pct: prog.total ? Math.min(100, Math.round(prog.done / prog.total * 100)) : 0 };
  }

  /* ===== 渲染调度 ===== */
  let lastPushedStage = null;
  function syncHistory() {
    if (State.stage !== lastPushedStage) {
      try { history.pushState({ stage: State.stage }, '', location.href); } catch (e) { /* file:// 下可能受限，忽略 */ }
      lastPushedStage = State.stage;
    }
  }
  function render() {
    const el = $('#app');
    if (!el) return;
    switch (State.stage) {
      case 'welcome': renderWelcome(el); break;
      case 'meta': renderMeta(el); break;
      case 'ask': renderAsk(el); break;
      case 'archive': renderArchive(el); break;
      case 'check': renderCheck(el); break;
      case 'register': renderRegister(el); break;
      case 'test': renderTest(el); break;
    }
    updateHeaderProgress();
    renderSidebar();
    updateNav();
    applyStyle();
    syncHistory();
    applyTheme();
    applyMood();
    window.scrollTo(0, 0);
    scheduleSave();
  }

  /* ===== 沉浸感：背景氛围 + 小剧场层完成 ===== */
  /* ===== 侧边栏 ===== */
  const SIDE_NAV = [['welcome', '🏠', '欢迎'], ['meta', '🎯', '元信息'], ['ask', '💬', '提问'], ['archive', '📄', '档案'], ['check', '🛡️', '检查'], ['register', '📝', '登记'], ['test', '🎬', '测试']];
  function renderSidebar() {
    const nav = $('#side-nav'), tools = $('#side-tools');
    if (!nav || !tools) return;
    nav.innerHTML = SIDE_NAV.map(([s, ic, t]) =>
      `<button class="side-item ${State.stage === s ? 'on' : ''}" data-side-stage="${s}"><span class="si-icon">${ic}</span><span>${t}</span></button>`).join('');
    tools.innerHTML = `
      <div class="side-group-title">工具</div>
      <button class="side-item" data-side-act="memory"><span class="si-icon">💾</span><span>记忆存档</span></button>
      <button class="side-item" data-side-act="import"><span class="si-icon">📥</span><span>导入档案</span></button>
      <button class="side-item" data-side-act="share"><span class="si-icon">🔗</span><span>分享进度</span></button>
      <button class="side-item" data-side-act="history"><span class="si-icon">📜</span><span>操作日志</span></button>
      <button class="side-item" data-side-act="theme"><span class="si-icon">🎨</span><span>主题色</span></button>
      <button class="side-item" data-side-act="dark"><span class="si-icon">🌙</span><span>暗色模式</span></button>
      <button class="side-item" data-side-act="lang"><span class="si-icon">🌐</span><span>中 / 英</span></button>
      <button class="side-item" data-side-act="sound"><span class="si-icon">🔊</span><span>音效</span></button>
      <button class="side-item danger" data-side-act="clear"><span class="si-icon">🗑</span><span>清空存档</span></button>`;
    $$('[data-side-stage]').forEach(b => b.onclick = () => { App.go(b.getAttribute('data-side-stage')); App.closeSidebar(); });
    $$('[data-side-act]').forEach(b => b.onclick = () => {
      const a = b.getAttribute('data-side-act');
      if (a === 'memory') App.openMemory();
      else if (a === 'import') App.importJSON();
      else if (a === 'share') App.shareLink();
      else if (a === 'history') App.openHistory();
      else if (a === 'theme') App.toggleTheme();
      else if (a === 'dark') App.toggleDark();
      else if (a === 'lang') App.setLang();
      else if (a === 'sound') { State.sound = !State.sound; saveNow(); toast(State.sound ? '音效已开 🔊' : '音效已关 🔇', 'warn'); }
      else if (a === 'clear') App.clearAll();
      App.closeSidebar();
    });
  }

  function applyMood() {
    const cur = State.plan[State.currentIndex];
    document.body.setAttribute('data-layer', State.showBg ? (cur ? (cur.layer || '') : '') : '');
    checkLayerDone();
  }
  function checkLayerDone() {
    if (!State.plan || !State.plan.length || !State.answers) return;
    if (!State.showTheater) return;
    State.stamps = State.stamps || {};
    let layerDone = null;
    Object.entries(ENGINE.countProgress(State.plan, State.answers).layerStats).forEach(([l, s]) => {
      if (s.done === s.total && s.total > 0 && !State.stamps['layer_' + l]) layerDone = l;
    });
    if (layerDone) {
      State.stamps['layer_' + layerDone] = true;
      earnStamp(layerDone);
      playSound('done');
      setTimeout(() => UI.showModal('🎭 小剧场',
        `${(CONFIG.LAYER_INFO[layerDone] || {}).icon || ''}「${layerDone}」这一层完成啦！她离完整又近了一步。`,
        `<button class="btn btn-primary" onclick="UI.closeModal()">继续</button>`), 500);
    }
  }

  /* ===== 主题 / 暗色 / 语言 应用 ===== */
  function applyTheme() {
    const t = CONFIG.THEMES[State.theme] || CONFIG.THEMES['祈宝粉'];
    const st = document.documentElement.style;
    st.setProperty('--primary', t.primary);
    st.setProperty('--primary-dark', t.primaryDark);
    st.setProperty('--primary-light', t.accent);
    st.setProperty('--bg', t.bg);
    document.documentElement.setAttribute('data-dark', State.darkMode ? '1' : '');
    document.documentElement.setAttribute('data-theme', State.theme);
    document.documentElement.setAttribute('data-lang', State.lang);
    const bt = $('#btn-dark'); if (bt) bt.textContent = State.darkMode ? '☀️' : '🌙';
    const bl = $('#btn-lang'); if (bl) bl.textContent = State.lang === 'en' ? 'EN' : '中';
  }

  /* 低端机检测（流畅模式自动降级） */
  function isLowEnd() {
    try {
      const c = (navigator.hardwareConcurrency || 4);
      const m = (navigator.deviceMemory || 4);
      return c <= 2 || m <= 2;
    } catch (e) { return false; }
  }

  /* 自定义主题 CSS 注入 */
  function applyCustomCSS() {
    let st = document.getElementById('custom-theme-style');
    if (State.customCSS && State.customCSS.trim()) {
      if (!st) { st = document.createElement('style'); st.id = 'custom-theme-style'; document.head.appendChild(st); }
      st.textContent = State.customCSS;

  /* 应用界面风格 / 动画等级 / 流畅模式 / 字号 / 圆角 */
  function applyStyle() {
    const root = document.documentElement;
    root.setAttribute('data-style', State.style || 'sakura');
    let anim = State.reduceMotion || (State.flowMode === '流畅' && isLowEnd()) ? '0' : String(State.animLevel);
    root.setAttribute('data-anim', anim);
    document.body.classList.toggle('flow-mode', State.flowMode === '流畅');
    document.body.classList.toggle('reduce-motion', !!State.reduceMotion);
    document.body.classList.toggle('no-vlist', !State.useVirtualList);
    document.body.style.fontSize = (State.fontScale * 100) + '%';
    if (State.btnRadius != null) root.style.setProperty('--btn-radius', State.btnRadius + 'px');
    else root.style.removeProperty('--btn-radius');
    // 风格半径默认
    const st = CONFIG.STYLES[State.style] || CONFIG.STYLES.sakura;
    root.style.setProperty('--style-radius', (State.btnRadius != null ? State.btnRadius : st.radius) + 'px');
    applyCustomCSS();
    const fp = $('#fps-panel');
    if (fp) fp.style.display = State.fpsShow ? 'block' : 'none';
  }

  /* ===== 顶部进度 ===== */
  function updateHeaderProgress() {
    const hp = $('#header-progress');
    if (!hp) return;
    if (State.stage === 'welcome' || State.stage === 'meta') { hp.style.display = 'none'; return; }
    hp.style.display = 'flex';
    const prog = ENGINE.countProgress(State.plan, State.answers);
    const total = prog.total || 1;
    const pct = Math.min(100, Math.round(prog.done / total * 100));
    $('#progress-text').textContent = `${prog.done}/${prog.total} · ${pct}%`;
    const deg = pct * 3.6;
    $('#progress-ring').style.background = `conic-gradient(var(--primary) ${deg}deg, var(--primary-light) ${deg}deg)`;
    // 精确到层：显示各层 done/total，当前层高亮
    const layerText = Object.entries(prog.layerStats)
      .map(([l, s]) => `${l}:${s.done}/${s.total}`).join(' · ');
    $('#progress-layer').textContent = layerText;
  }

  function bindMetaEvents() {
    // 用 label 点击 + input change 双保险，确保移动端稳定选中
    const bindGroup = (name, fn) => {
      $$(`input[name="${name}"]`).forEach(r => {
        r.onchange = e => { r.checked = true; fn(e.target.value); };
        const lb = r.closest('.opt-item');
        if (lb) {
          lb.querySelectorAll('.opt-label').forEach(l => {
            l.onclick = (e) => { e.preventDefault(); r.checked = true; fn(r.value); };
          });
        }
      });
    };
    bindGroup('gender', v => { State.meta.gender = v; });
    bindGroup('volume', v => { State.meta.volume = parseInt(v); $('#volume-custom').value = ''; State.meta.volumeCustom = ''; });
    bindGroup('orientation', v => { State.meta.orientation = v; });
    bindGroup('dlc9', v => { State.meta.dlc9 = v; });
    bindGroup('race', v => { State.meta.race = v; State.meta.raceMulti = v === '多形态'; });
    bindGroup('naming', v => { State.meta.strictNaming = v === '1'; });
    const vc = $('#volume-custom');
    if (vc) vc.oninput = e => {
      const v = parseInt(e.target.value);
      if (v >= 10 && v <= 630) { State.meta.volume = v; }
      State.meta.volumeCustom = e.target.value;
    };
    const btn = $('#btn-confirm-meta');
    if (btn) btn.onclick = () => App.confirmMeta();
    $$('[data-preset]').forEach(b => b.onclick = () => App.applyPreset(b.getAttribute('data-preset')));
    bindGroup('season', v => { State.season = v; });
    const it = $('#intimacy');
    if (it) it.oninput = e => { State.meta.intimacy = parseInt(e.target.value); };
    const st = $('#sound-toggle');
    if (st) st.onchange = e => { State.sound = e.target.checked; saveNow(); toast(State.sound ? '音效已开 🔊' : '音效已关 🔇', 'warn'); };
  }

            <input class="custom-input q-custom" data-qid="${p.qid}" placeholder="以上选项仅供参考，可直接打字填写任何内容…" value="${ans && !opts.includes(ans) ? esc(ans) : ''}" maxlength="500" aria-label="自定义答案">
          </div>
          <div class="q-custom-feedback" data-fb="${p.qid}">${ans ? '✅ 已填写' : ''}</div>
          ${ans ? `<div class="q-answer">✅ 已回答：${esc(ans)} <span class="edit-btn" data-clear="${p.qid}">重答</span></div>` : ''}
        </div>
      </div>
    `;
  }

  /* ===== 自定义答案输入弹窗 ===== */
  let cmState = { open: false, qid: null, el: null };

  function restoreRadio(qid) {
    const ans = hasAnswer(State.answers[qid]) ? String(State.answers[qid]) : null;
    const radios = [...$$(`input[name="q_${qid}"]`)];
    const inOpts = ans != null && radios.some(r => r.value === ans);
    radios.forEach(r => {
      if (ans == null) r.checked = false;
      else if (r.value === ans) r.checked = true;
      else if (isCustomOpt(r.value)) r.checked = !inOpts;
      else r.checked = false;
    });
  }

  function openCustomModal(qid, prefill) {
    const el = cmState.el;
    if (!el) return;
    cmState.qid = qid;
    cmState.open = true;
    const qidEl = el.querySelector('#cm-qid');
    const input = el.querySelector('#cm-input');
    const q = (window.QUESTIONS || []).find(x => x.id === qid);
    if (qidEl) qidEl.textContent = '第 ' + qid + ' 题' + (q && q.title ? ' · ' + q.title : '');
    if (input) { input.value = prefill || ''; setTimeout(() => { input.focus(); input.select(); }, 40); }
    el.style.display = 'flex';
  }

  function closeCustomModal(restore) {
    const el = cmState.el;
    if (el) el.style.display = 'none';
    const qid = cmState.qid;
    cmState.open = false;
    cmState.qid = null;
    if (restore && qid != null) restoreRadio(qid);
  }

  function cmSubmit() {
    const el = cmState.el;
    if (!el) return;
    const input = el.querySelector('#cm-input');
    if (!input) return;
    const v = input.value.trim();
    if (!v) { input.focus(); return; }
    const qid = cmState.qid;
    if (qid == null) return;
    State.answers[qid] = v;
    const card = $(`.question-card[data-qid="${qid}"]`);
    if (card) {
      $$(`input[name="q_${qid}"]`).forEach(r => r.checked = false);
      const cust = card.querySelector('.q-custom');
      if (cust) cust.value = v;
      const customRadio = [...$$(`input[name="q_${qid}"]`)].find(r => isCustomOpt(r.value));
      if (customRadio) customRadio.checked = true;
      const fb = card.querySelector(`.q-custom-feedback[data-fb="${qid}"]`);
      if (fb) { fb.textContent = '✅ 已自定义：' + v.slice(0, 20) + (v.length > 20 ? '…' : ''); fb.className = 'q-custom-feedback ok'; }
      card.classList.add('answered');
      immersiveFeedback(qid);
      scheduleSave();
    }
    closeCustomModal(false);
  }

  function initCustomModal() {
    const el = $('#custom-modal');
    if (!el) return;
    cmState.el = el;
    const input = el.querySelector('#cm-input');
    const submit = el.querySelector('#cm-submit');
    el.querySelectorAll('[data-cm-close]').forEach(b => b.onclick = () => closeCustomModal(true));
    if (submit) submit.onclick = () => cmSubmit();
    if (input) {
      input.onkeydown = e => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); cmSubmit(); }
      };
    }
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && cmState.open) closeCustomModal(true);
    });
  }

  function bindQuestionCard(p) {
    const card = $(`.question-card[data-qid="${p.qid}"]`);
    if (!card) return;
    const fb = card.querySelector(`.q-custom-feedback[data-fb="${p.qid}"]`);
    const setFeedback = (text, ok) => {
      if (fb) { fb.textContent = text; fb.className = 'q-custom-feedback' + (ok ? ' ok' : ''); }
    };
    $$(`input[name="q_${p.qid}"]`).forEach(r => {
      r.onchange = e => {
        const val = e.target.value;
        // 选「自定义」→ 弹出输入框，不立即保存
        if (isCustomOpt(val)) {
          const cust = card.querySelector('.q-custom');
          const prefill = (cust && cust.value.trim()) || (hasAnswer(State.answers[p.qid]) ? String(State.answers[p.qid]) : '');
          openCustomModal(p.qid, prefill);
          return;
        }
        State.answers[p.qid] = val;
        const cust = card.querySelector('.q-custom');
        if (cust) { cust.value = ''; setFeedback('✅ 已选选项', true); }
        card.classList.add('answered');
        immersiveFeedback(p.qid);
        scheduleSave();
      };
      // 键盘：Enter 直接选中（方向键原生支持）
      r.onkeydown = e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          r.checked = true;
          r.dispatchEvent(new Event('change', { bubbles: true }));
        }
      };
    });
    const cust = card.querySelector('.q-custom');
    if (cust) {
      cust.oninput = () => {
        $$(`input[name="q_${p.qid}"]`).forEach(r => r.checked = false);
        // 实时预览：非空即视为已填写
        const v = cust.value.trim();
        if (v) setFeedback('✅ 已填写：' + v.slice(0, 20) + (v.length > 20 ? '…' : ''), true);
        else setFeedback('⌨️ 输入后自动视为答案', false);
      };
      cust.onblur = e => {
        if (e.target.value.trim()) { State.answers[p.qid] = e.target.value.trim(); card.classList.add('answered'); immersiveFeedback(p.qid); scheduleSave(); }
      };
      cust.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } };
    }
    const clear = card.querySelector('[data-clear]');
    if (clear) clear.onclick = () => { App.clearAnswer(p.qid); };
  }

  /* 沉浸反馈：答题后她回一句 + 卡片弹跳（增强体验感） */
  function immersiveFeedback(qid) {
    if (State.showAvatar) {
      const card = $(`.question-card[data-qid="${qid}"]`);
      if (card) { card.classList.remove('q-pop'); void card.offsetWidth; card.classList.add('q-pop'); }
    }
    if (State.quote) toast('💬 ' + pick(CONFIG.QUOTES), '');
  }

  /* 逐题模式 */
  function renderAskSingle(el) {
    let idx = State.currentIndex;
    // 前进时跳过已答；回看（viewingAnswered）时允许显示当前题（含已答）
    if (!State.viewingAnswered) {
      while (idx < State.plan.length && hasAnswer(State.answers[State.plan[idx].qid])) idx++;
    }
    if (idx >= State.plan.length) { renderAskComplete(el); return; }
    State.currentIndex = idx;
    const p = State.plan[idx];
    const prog = ENGINE.countProgress(State.plan, State.answers);
    el.innerHTML = `
      <div class="ask-split">
      <div class="ask-rail">
        <button class="rail-head" id="rail-toggle" aria-expanded="false">
          <span>📋 进度概览</span>
          <span class="rail-cnt">已答 ${prog.done}/${prog.total}</span>
          <span class="rail-arrow">▸</span>
        </button>
        <div class="rail-progress">${Object.entries(prog.layerStats || {}).map(([layer, s]) =>
          `<div class="rail-layer"><span class="rl-name">${esc((CONFIG.LAYER_INFO[layer] || {}).icon || '•')} ${esc(layer)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(s.done / (s.total || 1) * 100)}%"></div></div><span class="rl-num">${s.done}/${s.total}</span></div>`).join('')}</div>
        <div class="rail-list collapsed" id="rail-list">${(() => {
          const N = State.plan.length, W = 40;
          let html = '';
          if (idx - W > 0) html += `<button class="rail-item rail-jump" data-ri="0"><span class="ri-qid">⏮</span>回到开头</button><div class="rail-gap">…</div>`;
          for (let i = Math.max(0, idx - W); i < Math.min(N, idx + W + 1); i++) {
            const q = State.plan[i];
            html += `<button class="rail-item ${i === idx ? 'on' : ''} ${hasAnswer(State.answers[q.qid]) ? 'done' : ''}" data-ri="${i}"><span class="ri-qid">${i + 1}</span>${esc(q.title.slice(0, 10))}</button>`;
          }
          if (idx + W < N - 1) html += `<div class="rail-gap">…</div><button class="rail-item rail-jump" data-ri="${N - 1}"><span class="ri-qid">⏭</span>跳到末尾</button>`;
          return html;
        })()}</div>
      </div>
      <div class="ask-main">
      <div class="card">
        <div class="card-title"><span class="icon">💬</span> 提问进行中 ${State.showAvatar ? `<span class="q-avatar" id="q-avatar">${getEmotion() < 30 ? '🌸' : getEmotion() < 60 ? '💗' : getEmotion() < 85 ? '😊' : '💖'}</span>` : ''}</div>
        <div class="emotion-meter" title="亲密度"><span class="em-label">亲密度</span><div class="bar-track"><div class="bar-fill" style="width:${getEmotion()}%"></div></div><span class="em-num">${getEmotion()}%</span></div>
        ${State.quote ? `<div class="q-quote">💭 ${esc(pick(CONFIG.QUOTES))}</div>` : ''}
        ${p.layer === 'NSFW' && State.showPrivacy ? `<div class="q-privacy">🤫 这个问题，只有我们两个知道哦…</div>` : ''}
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(idx / State.plan.length * 100)}%"></div></div>
        <div class="text-small text-soft mb-12">第 ${idx + 1} / ${State.plan.length} 题（已答 ${prog.done} · ${Math.round(prog.done / State.plan.length * 100)}%）</div>
        ${renderQuestionCard(p, State.answers[p.qid])}
        <div class="btn-row">
          ${idx > 0 ? `<button class="btn btn-ghost" id="btn-prev">← 上一题</button>` : ''}
          <button class="btn btn-primary" id="btn-next">${idx === State.plan.length - 1 ? '完成全部提问 ✓' : '下一题 →'}</button>
        </div>
        <div class="btn-row left mt-8">
          <button class="btn btn-soft" id="btn-savemem">💾 存进记忆</button>
          <button class="btn btn-soft" id="btn-progress">📊 进度</button>
          <button class="btn btn-soft" id="btn-skip">⏭ 跳过这题</button>
          <button class="btn btn-soft" id="btn-mand">${State.customMandatory[p.qid] ? '🔓 取消必答' : '🔒 标为必答'}</button>
          <button class="btn btn-soft" id="btn-reskip">⏩ 跳到未答</button>
          <button class="btn btn-soft" id="btn-reroll">🎲 重新抽取题库</button>
        </div>
        <div class="kbd-hint">快捷键：<kbd>←</kbd> 上题 · <kbd>→</kbd> 下题 · <kbd>Ctrl+Enter</kbd> 提交 · <kbd>/</kbd> 搜索</div>
      </div>
      </div>
      </div>
    `;
    bindQuestionCard(p);
    if ($('#btn-prev')) $('#btn-prev').onclick = () => App.prevQuestion();
    $('#btn-next').onclick = () => App.submitSingle();
    $('#btn-savemem').onclick = () => App.saveMemory();
    $('#btn-progress').onclick = () => App.openProgress();
    $('#btn-skip').onclick = () => App.skipCurrent();
    $('#btn-mand').onclick = () => App.toggleMandatory(p.qid);
    $('#btn-reskip').onclick = () => App.skipToEnd();
    $('#btn-reroll').onclick = () => App.reroll();
    $$('[data-ri]').forEach(b => b.onclick = () => { const i = parseInt(b.getAttribute('data-ri')); State.currentIndex = i; State.viewingAnswered = hasAnswer(State.answers[State.plan[i].qid]); render(); });
    const rt = $('#rail-toggle');
    if (rt) rt.onclick = () => {
      const list = $('#rail-list');
      if (!list) return;
      const open = list.classList.toggle('collapsed');
      rt.setAttribute('aria-expanded', String(!open));
      rt.classList.toggle('open', !open);
    };
    typewriter('.question-card .q-title');
    speak(p.title);
  }

  /* 打字机：标题逐字出现 */
  function typewriter(sel) {
    if (!CONFIG.TYPE_SPEED) return;
    const el = $(sel);
    if (!el) return;
    if (State.reduceMotion || State.animLevel === 0 || State.flowMode === '流畅') return; // 流畅/关动画不打字
    const speedMap = { '快': 6, '中': 18, '慢': 34 };
    const speed = speedMap[State.typeSpeed] || 18;
    const full = el.textContent;
    if (full.length > 60) return; // 过长不播
    el.textContent = '';
    let i = 0;
    const timer = setInterval(() => {
      i++;
      el.textContent = full.slice(0, i);
      if (i >= full.length) clearInterval(timer);
    }, speed);
  }

  /* 批次模式 */
  function renderAskBatch(el) {
    let start = State.currentIndex;
    if (!State.viewingAnswered) {
      while (start < State.plan.length && hasAnswer(State.answers[State.plan[start].qid])) start++;
    }
    if (start >= State.plan.length) { renderAskComplete(el); return; }
    State.currentIndex = start;
    const end = Math.min(start + State.batchSize, State.plan.length);
    const batch = State.plan.slice(start, end);
    const prog = ENGINE.countProgress(State.plan, State.answers);
    el.innerHTML = `
      <div class="card">
        <div class="card-title"><span class="icon">📦</span> 批次提问</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(start / State.plan.length * 100)}%"></div></div>
        <div class="text-small text-soft mb-12">第 ${start + 1} ~ ${end} 题（共 ${State.plan.length} 题 · 已答 ${prog.done} · ${Math.round(prog.done / State.plan.length * 100)}%）</div>
        ${batch.map(p => renderQuestionCard(p, State.answers[p.qid])).join('')}
        <div class="btn-row">
          ${start > 0 ? `<button class="btn btn-ghost" id="btn-prevb">← 上一批</button>` : ''}
          <button class="btn btn-primary" id="btn-nextb">${end >= State.plan.length ? '完成全部提问 ✓' : '下一批 →'}</button>
        </div>
        <div class="btn-row left mt-8">
          <button class="btn btn-soft" id="btn-savemem">💾 存进记忆</button>
          <button class="btn btn-soft" id="btn-progress">📊 进度</button>
          <button class="btn btn-soft" id="btn-reroll">🎲 重新抽取题库</button>
        </div>
      </div>
    `;
    batch.forEach(p => bindQuestionCard(p));
    if ($('#btn-prevb')) $('#btn-prevb').onclick = () => App.prevBatch();
    $('#btn-nextb').onclick = () => App.submitBatch();
    $('#btn-savemem').onclick = () => App.saveMemory();
    $('#btn-progress').onclick = () => App.openProgress();
    $('#btn-reroll').onclick = () => App.reroll();
  }

  /* 提问完成页 */
  function renderAskComplete(el) {
    const prog = ENGINE.countProgress(State.plan, State.answers);
    // 印章：全部答完得「完整」+ 收集层印章
    earnStamp('完整');
    Object.keys(CONFIG.STAMPS).forEach(k => { if (k !== '完整') earnStamp(k); });
    const stampsHtml = Object.keys(State.stamps || {}).filter(k => !k.startsWith('layer_')).map(k => `<span class="stamp">${CONFIG.STAMPS[k] || '🏅'} ${k}</span>`).join('');
    el.innerHTML = `
      <div class="card text-center" style="padding:50px 28px">
        <div style="font-size:60px;margin-bottom:14px">🎉</div>
        <h2 style="font-size:26px;font-weight:900;margin-bottom:8px">全部提问完成！</h2>
        <p class="text-soft" style="margin-bottom:6px">共完成 <b style="color:var(--primary)">${prog.done}</b> 题，即将为你组装完整档案。</p>
        ${State.showStamps && stampsHtml ? `<div class="stamp-row">${stampsHtml}</div>` : ''}
        ${State.season ? `<p class="q-quote">🌿 ${esc(State.season)}日 · 她在这个季节，把心事都告诉了你。</p>` : ''}
        <p class="text-small text-soft mb-16">下面进行：生成完整档案 → 输出确认 → 世界观检查 → 体系登记 → 测试模式</p>
        <button class="btn-big" id="btn-gen">生成完整档案 ✨</button>
      </div>
    `;
    $('#btn-gen').onclick = () => App.generateArchive();
  }
