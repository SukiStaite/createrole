  /* ===== 应用入口 ===== */
  const App = {
    start() {
      const saved = STORE.load();
      if (saved && saved.stage && saved.stage !== 'welcome' && saved.plan && saved.plan.length) {
        // 有未完成进度，直接恢复
        Object.assign(State, saved);
        State.meta = Object.assign(ENGINE.defaultMeta(), saved.meta || {});
        render();
        toast('已恢复上次进度', 'success');
      } else {
        State.stage = 'meta'; render();
      }
    },
    continueSaved() {
      const saved = STORE.load();
      if (!saved) return toast('没有可恢复的进度', 'warn');
      Object.assign(State, saved);
      State.meta = Object.assign(ENGINE.defaultMeta(), saved.meta || {});
      render();
      toast('已恢复进度', 'success');
    },
    go(stage) {
      State.stage = stage;
      if (stage === 'archive') State.generatedArchive = null;
      render();
    },

    confirmMeta() {
      const m = State.meta;
      // 一次性列出所有未选项（明确提示，避免逐个模糊报错）
      const missing = [];
      if (!m.gender) missing.push('OC 性别');
      if (!m.orientation) missing.push('「什么向」');
      if (!m.dlc9) missing.push('是否 DLC9 特化');
      if (!m.race) missing.push('种族维度');
      if (!m.volume) missing.push('题目体量');
      if (missing.length) return toast('还差这几项没选：' + missing.join('、'), 'error');
      if (m.strictNaming) {
        // 严格命名规则提示（姓名题会校验，这里提前说明）
        toast('已启用严格命名规则：姓从「苏林洛宋」取、名尾加「宝」、三字为宜', 'warn');
      }
      // 构建题目计划（随机）
      State.plan = ENGINE.buildPlan(State.meta, window.QUESTIONS);
      State.currentIndex = 0;
      State.answers = {};
      State.stage = 'ask';
      render();
      toast(`已抽取 ${State.plan.length} 题，请选择提问模式`, 'success');
    },

    confirmAskMode() {
      if (State.askMode === null) State.askMode = 'single';
      State.currentIndex = 0;
      State.stage = 'ask';
      render();
    },

    /* 逐题提交（必答强制） */
    submitSingle() {
      const p = State.plan[State.currentIndex];
      let answered = false;
      if (p) {
        const val = getQuestionAnswer(p.qid);
        if (val) { State.answers[p.qid] = val; answered = true; }
        else if (isMandatory(p)) return toast(`第 ${p.qid} 题必答，请填写后再继续`, 'error');
      }
      State.currentIndex++;
      State.viewingAnswered = false;   // 前进恢复正常跳转
      vibrate(20);
      render();
      maybeAutoMemory();
      // 沉浸感反馈
      if (answered && p) {
        playSound('ok');
        State.emotion = Math.min(100, getEmotion() + 2);
        showSnippet(p.layer || 'SFW');
        setTimeout(() => toast(moodWord(p.layer || 'SFW'), 'success'), 250);
      }
    },
    prevQuestion() {
      if (State.currentIndex > 0) { State.currentIndex--; State.viewingAnswered = true; render(); }
      else toast('已经是第一题了', 'warn');
    },
    skipToEnd() {
      let idx = State.currentIndex;
      while (idx < State.plan.length && hasAnswer(State.answers[State.plan[idx].qid])) idx++;
      State.currentIndex = idx; render();
    },

    /* 批次提交（必答强制） */
    submitBatch() {
      const start = State.currentIndex;
      const end = Math.min(start + State.batchSize, State.plan.length);
      let missingMandatory = [];
      let anyEmpty = 0;
      for (let i = start; i < end; i++) {
        const p = State.plan[i];
        const val = getQuestionAnswer(p.qid);
        if (val) State.answers[p.qid] = val;
        else { anyEmpty++; if (isMandatory(p)) missingMandatory.push(p.qid); }
      }
      if (missingMandatory.length) return toast(`必答题 #${missingMandatory.join('、#')} 未填写`, 'error');
      if (anyEmpty) toast(`${anyEmpty} 道选答题已跳过`, 'warn');
      State.currentIndex = end;
      State.viewingAnswered = false;
      render();
      maybeAutoMemory();
      // 沉浸感反馈（本批答了多少）
      let batchAnswered = 0;
      for (let i = start; i < end; i++) { if (hasAnswer(State.answers[State.plan[i].qid])) batchAnswered++; }
      if (batchAnswered > 0) {
        playSound('ok');
        State.emotion = Math.min(100, getEmotion() + 2 * batchAnswered);
        showSnippet(State.plan[start] ? State.plan[start].layer : 'SFW');
        setTimeout(() => toast(moodWord(State.plan[start] ? State.plan[start].layer : 'SFW'), 'success'), 250);
      }
    },
    prevBatch() {
      if (State.currentIndex > 0) { State.currentIndex = Math.max(0, State.currentIndex - State.batchSize); State.viewingAnswered = true; render(); }
      else toast('已经是第一批了', 'warn');
    },

    clearAnswer(qid) { delete State.answers[qid]; render(); },

    reroll() {
      const ok = confirm('重新抽取题库将清空当前所有答案，确定继续？');
      if (!ok) return;
      State.plan = ENGINE.buildPlan(State.meta, window.QUESTIONS);
      State.currentIndex = 0;
      State.answers = {};
      render();
      toast('已重新抽取题库 🎲', 'success');
    },

    openProgress() {
      const prog = ENGINE.countProgress(State.plan, State.answers);
      // 分层条形（雷达替代：分层进度条更清晰）
      const layerBars = Object.entries(prog.layerStats).map(([l, s]) => {
        const li = CONFIG.LAYER_INFO[l] || {};
        const pct = Math.round(s.done / s.total * 100);
        return `<div class="layer-bar">
          <div class="lb-head"><span>${li.icon || ''} ${esc(l)}</span><button class="lb-jump" data-layer="${esc(l)}">跳到这层 ›</button><span class="lb-num">${s.done}/${s.total} · ${pct}%</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        </div>`;
      }).join('');
      // 已答列表（点击跳回修改）
      const answeredIds = State.plan.filter(p => hasAnswer(State.answers[p.qid])).map(p => p.qid);
      const answeredList = answeredIds.length
        ? `<div class="form-label mt-12">已答列表（点题回去改）</div><div class="answered-list">${answeredIds.slice(0, 80).map(qid => `<button class="answer-chip" data-qid="${qid}">#${qid}</button>`).join('')}${answeredIds.length > 80 ? '<span class="text-small text-faint">…</span>' : ''}</div>`
        : '';
      // 统计：自定义比例 / 跳过率
      const customCnt = Object.values(State.answers).filter(v => typeof v === 'string' && v.trim() && v.trim().length > 0 && !State.plan.some(p => p.options && p.options.includes(v))).length;
      // 成长日记（每答一段，基于已答进度生成）
      const diaryStages = [
        [0.1, '她刚刚对你打开一点点心扉。'], [0.3, '她已经愿意把小心事说给你听了。'],
        [0.5, '她开始习惯你的存在，回答变得自然。'], [0.7, '她看你的眼神里，多了些说不清的东西。'],
        [0.9, '她已经把自己最柔软的部分，交给你了。'], [1, '她完完整整地，站在你面前了。'],
      ];
      const ratio = prog.total ? prog.done / prog.total : 0;
      const diary = diaryStages.filter(d => ratio >= d[0]).pop();
      const diaryHtml = `<div class="form-label mt-12">📔 她的成长日记</div><div class="diary">${diary ? '第 ' + prog.done + ' 题 · ' + diary[1] : '故事才刚刚开始…'}</div>`;
      UI.showModal('📊 当前进度',
        `<div class="stats-grid">
          <div class="stat-box"><div class="stat-num">${prog.done}</div><div class="stat-label">已答</div></div>
          <div class="stat-box"><div class="stat-num">${prog.remaining}</div><div class="stat-label">未答</div></div>
          <div class="stat-box"><div class="stat-num">${prog.total}</div><div class="stat-label">总题</div></div>
          <div class="stat-box"><div class="stat-num">${prog.done ? Math.round(customCnt / prog.done * 100) : 0}%</div><div class="stat-label">自定义率</div></div>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(prog.done / prog.total * 100)}%"></div></div>
        <div class="mt-12">${layerBars}</div>
        ${diaryHtml}
        ${answeredList}
        <div class="btn-row center mt-12">
          <button class="btn btn-soft" id="btn-prog-rerollkeep">🎲 重抽未答（保留已答）</button>
        </div>`,
        `<button class="btn btn-primary" onclick="UI.closeModal()">继续提问</button>`);
      const rk = $('#btn-prog-rerollkeep');
      if (rk) rk.onclick = () => { App.rerollKeep(); UI.closeModal(); };
      $$('[data-qid]').forEach(b => b.onclick = () => App.jumpTo(parseInt(b.getAttribute('data-qid'))));
      $$('[data-layer]').forEach(b => b.onclick = () => { App.jumpToLayer(b.getAttribute('data-layer')); UI.closeModal(); });
    },

    /* ===== 跳到某层第一个未答题 ===== */
    jumpToLayer(layer) {
      const p = State.plan.find(x => x.layer === layer && !hasAnswer(State.answers[x.qid]));
      if (!p) return toast('这一层都答完啦，无需跳转', 'warn');
      State.currentIndex = State.plan.indexOf(p);
      render();
    },

    generateArchive() {
      State.generatedArchive = ENGINE.buildArchive(State.meta, State.answers, window.QUESTIONS);
      State.stage = 'archive';
      render();
      playSound('done');
      toast('档案已生成 ✨', 'success');
      // 仪式感加载：短暂卷轴展开效果
      const app = $('#app');
      if (app && State.showScroll && !State.reduceMotion) { app.classList.add('archive-reveal'); setTimeout(() => app.classList.remove('archive-reveal'), 900); }
      // 专属寄语（第一次生成）
      if (!State.stamps.final) {
        State.stamps.final = true; saveNow();
        setTimeout(() => UI.showModal('💌 祈宝的寄语', CONFIG.FINAL_WORDS, `<button class="btn btn-primary" onclick="UI.closeModal()">收下啦</button>`), 1000);
      }
    },

    /* 复制 markdown */
    copyArchive() {
      const md = ENGINE.archiveToMarkdown(State.generatedArchive, State.meta);
      const done = () => toast('已复制到剪贴板 📋', 'success');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(md).then(done).catch(() => fallbackCopy(md, done));
      } else fallbackCopy(md, done);
    },
    /* 下载 markdown */
    downloadArchive() {
      const md = ENGINE.archiveToMarkdown(State.generatedArchive, State.meta);
      const name = (State.generatedArchive.name || '角色档案') + '_档案.md';
      const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 100);
      toast('已下载档案 .md ⬇', 'success');
    },

    toggleCheck(id) { State.checks[id] = !State.checks[id]; render(); },
    confirmCheck() {
      const results = ENGINE.runChecks(State.meta, State.answers, { registers: State.registers, REGISTER_LIST: SCHEMA.REGISTER_LIST });
      const fail = results.filter(r => r.status === 'fail');
      if (fail.length) return toast(`仍有 ${fail.length} 条不通过：${fail.map(f => f.id).join('、')}`, 'error');
      State.stage = 'register'; render();
    },

    toggleRegister(id) { State.registers[id] = !State.registers[id]; render(); },
    confirmRegister() {
      const all = SCHEMA.REGISTER_LIST;
      const undone = all.filter(r => !State.registers[r.id]);
      if (undone.length) return toast(`登记流水未勾选：${undone.map(r => r.title).join('、')}`, 'error');
      State.stage = 'test'; render();
      saveNow();
      toast('登记完成，进入测试模式 🎬（已本地存档）', 'success');
    },

    selectScene(id) { State.testScene = id; State.testStarted = false; render(); },
    startTest() {
      if (!State.testScene) return toast('请先选择一个开场场景', 'error');
      State.testStarted = true;
      const name = hasAnswer(State.answers[1]) ? String(State.answers[1]) : '她';
      const openings = {
        daily: `清晨的阳光透过窗帘洒进房间。${name}蜷在你身侧，睫毛轻颤着慢慢睁开，看到你后露出一个甜甜的笑：「早上好呀，辞宝…」`,
        flirt: `夜色渐浓，客厅只留一盏昏黄的灯。${name}轻轻拉了拉你的衣角，眼神在阴影里闪烁，声音带着一丝不易察觉的轻颤：「那个…今晚，能不能多陪我一会儿？」`,
        nsfw: `灯光昏黄暧昧，${name}的呼吸有些乱，她抬眼望着你，脸颊泛着不自然的红晕，声音软得像要化开：「辞宝…我有点…热…」`,
      };
      State.testMsgs = [{ role: 'she', text: openings[State.testScene] }];

    sendChat() {

      const replies = [

        `「（脸红地低下头）你这样看着我，我会不好意思的啦…」`,
        `「最喜欢辞宝了…真的。」`,

        `「（轻轻拽了拽你的袖子）陪我说说话好不好？」`,

    endTest() {

      render();

    /* ===== 记忆系统（B 手动 / A 自动 / C 面板） ===== */
    saveMemory(fromAuto) {
      const prog = ENGINE.countProgress(State.plan, State.answers);
      if (prog.done === 0) return toast('还没有任何已答内容，先答几题再存记忆吧', 'warn');
      const mem = {
        id: 'mem_' + Date.now(),
        name: '未命名记忆 ' + (STORE.loadMemories().length + 1),
        createdAt: Date.now(),
        meta: Object.assign({}, State.meta),
        progress: { answered: prog.done, total: prog.total },
        answers: Object.assign({}, State.answers),
        checks: Object.assign({}, State.checks),
        registers: Object.assign({}, State.registers),
        summary: makeMemorySummary(),
      };
      const r = STORE.addMemory(mem);
      if (r.ok) {
        toast('已存入记忆 · 第 ' + STORE.loadMemories().length + ' 份 💾', 'success');
        if (fromAuto) UI.closeModal();
        saveNow();
      } else if (r.error === 'quota') toast('存储空间不足，记忆保存失败', 'error');
      else toast('记忆保存失败', 'error');
    },
    disableMemory() { State.memoryFreq = 0; saveNow(); toast('已关闭自动记忆提醒', 'warn'); },
    openMemory() {
      const mems = STORE.loadMemories();
      if (!mems.length) { UI.showModal('💾 记忆', '还没有任何记忆。提问时点「存进记忆」即可保存当前进度快照。', `<button class="btn btn-primary" onclick="UI.closeModal()">知道了</button>`); return; }
      const rows = mems.map(m => `
        <div class="memory-item">
          <div class="mem-info">
            <div class="mem-name">${esc(m.name)}</div>
            <div class="mem-sub">${m.progress.answered}/${m.progress.total} 题 · ${new Date(m.createdAt).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })}</div>
            <div class="mem-summary">${esc(m.summary || '')}</div>
          </div>
          <div class="mem-actions">
            <button class="mem-btn" onclick="App.useMemory('${m.id}')">▶ 继续</button>
            <button class="mem-btn" onclick="App.renameMemory('${m.id}')">✏️</button>
            <button class="mem-btn" onclick="App.exportMemory('${m.id}')">⬇</button>
            <button class="mem-btn danger" onclick="App.deleteMemory('${m.id}')">🗑</button>
          </div>
        </div>`).join('');
      UI.showModal('💾 记忆存档（' + mems.length + ' 份）', rows,
        `<button class="btn btn-ghost" onclick="UI.closeModal()">关闭</button>`);
    },
    useMemory(id) {
      const mem = STORE.loadMemories().find(m => m.id === id);
      if (!mem) return toast('记忆不存在', 'error');
      if (!confirm('用这份记忆继续？当前未保存进度会被这份记忆覆盖。')) return;
      Object.assign(State, STORE.defaultState(), {
        meta: Object.assign(ENGINE.defaultMeta(), mem.meta || {}),
        plan: State.plan, currentIndex: 0,
        answers: Object.assign({}, mem.answers || {}),
        checks: Object.assign({}, mem.checks || {}),
        registers: Object.assign({}, mem.registers || {}),
        stage: 'ask', askMode: State.askMode || 'single',
      });
      if (!State.plan.length) { State.plan = ENGINE.buildPlan(State.meta, window.QUESTIONS); }
      UI.closeModal();
      render();
      toast('已用记忆「' + mem.name + '」继续', 'success');
      saveNow();
    },
    renameMemory(id) {
      const mem = STORE.loadMemories().find(m => m.id === id);
      if (!mem) return toast('记忆不存在', 'error');
      const name = prompt('重命名记忆', mem.name);
      if (!name || !name.trim()) return;
      STORE.updateMemory(id, { name: name.trim() });
      App.openMemory();
    },
    deleteMemory(id) {
      if (!confirm('删除这份记忆？')) return;
      STORE.deleteMemory(id);
      App.openMemory();
      toast('已删除记忆', 'success');
    },
    exportMemory(id) {
      const mem = STORE.loadMemories().find(m => m.id === id);
      if (!mem) return toast('记忆不存在', 'error');
      const blob = new Blob([JSON.stringify(mem, null, 2)], { type: 'application/json;charset=utf-8' });
      downloadBlob(blob, mem.name + '_记忆.json');
      toast('已导出记忆 ⬇', 'success');
    },

      const card = ENGINE.archiveToSillyTavern(State.generatedArchive, State.meta, { version: version === 3 ? 3 : 2 });

    },

    /* ===== JSON 完整档案导出 ===== */
    exportJSON() {
      if (!State.generatedArchive) State.generatedArchive = ENGINE.buildArchive(State.meta, State.answers, window.QUESTIONS);
      const obj = ENGINE.archiveToJSON(State.generatedArchive, State);

      log('导出 JSON 档案');
      toast('已导出 JSON 档案 📦', 'success');
    },

    /* ===== 主题 / 暗色 / 语言 ===== */
    toggleTheme() {
      const names = Object.keys(CONFIG.THEMES);
      UI.showModal('🎨 主题色',
        `<div class="theme-picker">${names.map(n => `<button class="theme-chip ${State.theme === n ? 'on' : ''}" data-th="${n}"><span class="dot" style="background:${CONFIG.THEMES[n].primary}"></span>${esc(n)}</button>`).join('')}</div>`,
        `<button class="btn btn-ghost" onclick="UI.closeModal()">关闭</button>`);
      $$('[data-th]').forEach(b => b.onclick = () => { State.theme = b.getAttribute('data-th'); saveNow(); applyTheme(); UI.closeModal(); toast('主题色已切换 🎨', 'success'); });
    },
    toggleDark() {
      State.darkMode = !State.darkMode;

    },
    setLang() {
      State.lang = State.lang === 'zh' ? 'en' : 'zh';
      saveNow(); applyTheme(); render();

    /* ===== 预设模板 ===== */
    applyPreset(id) {

      if (!p) return;
      State.meta = Object.assign(ENGINE.defaultMeta(), p.meta);
      render();
      toast('已套用预设「' + p.name + '」' + p.icon, 'success');
    },

    /* ===== 分享进度链接 ===== */
    shareLink() {
      const payload = { meta: State.meta, plan: State.plan, answers: State.answers, stage: State.stage, v: CONFIG.VERSION };
      const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
      const url = location.origin + location.pathname + '#s=' + b64;
      copyText(url, () => toast('已复制分享链接 🔗（同浏览器打开即可恢复）', 'success'));
      log('生成分享链接');
    },

    /* ===== 导入 JSON 档案 ===== */
    importJSON() {
      const input = document.createElement('input');
      input.type = 'file'; input.accept = '.json';
      input.onchange = () => {
        const f = input.files && input.files[0];
        if (!f) return;
        const rd = new FileReader();
        rd.onload = () => {
          try {
            const obj = JSON.parse(rd.result);
            if (obj && obj.format === 'aira-archive' && obj.answers) {
              State.meta = Object.assign(ENGINE.defaultMeta(), obj.meta || {});
              State.answers = Object.assign({}, obj.answers);
              State.checks = Object.assign({}, obj.checks || {});
              State.registers = Object.assign({}, obj.registers || {});
              State.plan = State.plan && State.plan.length ? State.plan : ENGINE.buildPlan(State.meta, window.QUESTIONS);
              State.currentIndex = 0;
              State.stage = 'archive';
              State.generatedArchive = null;
              saveNow(); render();
              toast('已导入档案，可继续编辑 📥', 'success');
              log('导入 JSON 档案');
            } else if (obj && obj.id && obj.answers) {
              // 记忆快照导入
              Object.assign(State, STORE.defaultState(), { meta: Object.assign(ENGINE.defaultMeta(), obj.meta || {}), answers: Object.assign({}, obj.answers), stage: 'ask' });
              State.plan = ENGINE.buildPlan(State.meta, window.QUESTIONS);
              render(); saveNow();
              toast('已导入记忆快照，继续提问 📥', 'success');
            } else toast('无法识别的文件格式', 'error');
          } catch (e) { toast('解析失败：' + e.message, 'error'); }
        };
        rd.readAsText(f);
      };
      input.click();
    },

    /* ===== 跳过当前题（选答） ===== */
    skipCurrent() {
      const p = State.plan[State.currentIndex];
      if (!p) return;
      if (isMandatory(p) || State.customMandatory[p.qid]) return toast('必答题不能跳过', 'error');
      State.currentIndex++;
      vibrate(15);
      render();
      toast('已跳过（稍后可回题修改）', 'warn');
      log('跳过第 ' + p.qid + ' 题');
    },

    /* ===== 跳到指定题 ===== */
    jumpTo(qid) {
      const idx = State.plan.findIndex(p => p.qid === qid);
      if (idx < 0) return toast('题库里没有这题', 'error');
      State.currentIndex = idx;
      UI.closeModal();
      render();
    },

    /* ===== 搜索题库 ===== */
    searchQuestions(q) {
      const kw = (q || '').trim();
      if (!kw) return toast('输入关键词再搜', 'warn');
      const hits = window.QUESTIONS.filter(x => (x.title || '').includes(kw) || (x.parse || '').includes(kw)).slice(0, 12);
      if (!hits.length) return toast('没搜到，换个词试试', 'warn');
      UI.showModal('🔍 搜索结果（' + hits.length + '）',
        hits.map(h => `<div class="search-hit" data-qid="${h.qid}"><span class="sh-qid">#${h.qid}</span><span class="sh-title">${esc(h.title)}</span><span class="sh-layer">${esc(h.layer || '')}</span></div>`).join(''),
        `<button class="btn btn-ghost" onclick="UI.closeModal()">关闭</button>`);
      $$('[data-qid]').forEach(elx => elx.onclick = () => App.jumpTo(parseInt(elx.getAttribute('data-qid'))));
    },

    /* ===== 自定义必答切换 ===== */
    toggleMandatory(qid) {
      const p = State.plan.find(x => x.qid === qid);
      if (!p) return;
      if (State.customMandatory[qid]) { delete State.customMandatory[qid]; toast('已取消必答', 'warn'); }
      else { State.customMandatory[qid] = true; toast('已标记为必答 🔒', 'success'); }
      saveNow(); render();
    },

    /* ===== 重抽保留已答 ===== */
    rerollKeep() {
      const done = ENGINE.countProgress(State.plan, State.answers);
      if (!done.done) return App.reroll();
      // 保留已答，只重抽未答
      const remaining = State.plan.filter(p => !hasAnswer(State.answers[p.qid]));
      if (!remaining.length) return toast('都已答完，没有可重抽的', 'warn');
      State.plan = State.plan.map(p => hasAnswer(State.answers[p.qid]) ? p : remaining.shift());
      State.currentIndex = 0;
      render();
      toast('已保留已答，重抽未答部分 🎲', 'success');
      log('重抽题库（保留已答）');
    },

    /* ===== 操作日志 ===== */
    openHistory() {
      UI.showModal('📜 操作日志',
        State.log.length ? `<div class="history-list">${State.log.slice(-30).reverse().map(l => `<div class="history-item"><span class="h-time">${l.t}</span>${esc(l.msg)}</div>`).join('')}</div>` : '<p class="text-soft">还没有操作记录。</p>',
        `<button class="btn btn-ghost" onclick="UI.closeModal()">关闭</button>`);
    },
  };

  /* 获取题目答案（从表单读取） */
  function getQuestionAnswer(qid) {
    const checked = document.querySelector(`input[name="q_${qid}"]:checked`);
    if (checked && checked.value) return checked.value;
    const cust = document.querySelector(`.q-custom[data-qid="${qid}"]`);
    if (cust && cust.value.trim()) return cust.value.trim();
    return null;
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); }
    catch (e) { toast('复制失败，请手动复制', 'error'); }
    ta.remove();
  }

  /* 下载 Blob（导出用） */
  function downloadBlob(blob, filename) {
    // Tauri 原生应用：用系统保存对话框写文件
    const T = window.__TAURI__;
    if (T && T.dialog && T.fs) {
      blob.arrayBuffer().then(buf => T.dialog.save({ defaultPath: filename }).then(path => {
        if (path) T.fs.writeFile(path, new Uint8Array(buf));
      }));
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 100);
  }

  /* 操作日志（保留最近 100 条） */
  function log(msg) {
    if (!Array.isArray(State.log)) State.log = [];
    State.log.push({ t: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }), msg });
    if (State.log.length > 100) State.log = State.log.slice(-100);
    scheduleSave();
  }

  /* 复制文本（clipboard 优先，降级 execCommand） */
  function copyText(text, done) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else fallbackCopy(text, done);
  }

  /* ===== 沉浸感辅助 ===== */
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function getEmotion() { return State.emotion || 0; }
  /* 触觉反馈（设置可关/调强度） */
  function vibrate(ms) {
    if (!State.vib) return;
    try {
      if (navigator.vibrate) {
        const power = Math.max(0.1, (State.vibPower != null ? State.vibPower : 40) / 100);
        navigator.vibrate(Math.round(Math.max(10, Math.min(200, ms * power))));
      }
    } catch (e) { /* 忽略 */ }
  }
  /* 朗读题目（语音，设置可关） */
  function speak(text) {
    if (!State.speak) return;
    try {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(text || '').slice(0, 80));
      u.lang = State.lang === 'en' ? 'en-US' : 'zh-CN';
      u.rate = 1.0;
      window.speechSynthesis.speak(u);
    } catch (e) { /* 忽略 */ }
  }
  function nsfwAnswered() {
    let c = 0;
    Object.values(State.answers).forEach(v => { const s = String(v); if (s.includes('NSFW') || s.includes('调教') || s.includes('SM')) c++; });
    return c;
  }
  function moodWord(layer) {
    // 动态语气：NSFW 已答多时语气更亲昵
    const n = nsfwAnswered();
    let pool = CONFIG.MOOD_WORDS[layer] || CONFIG.MOOD_WORDS.SFW;
    if (n >= 5 && pool === CONFIG.MOOD_WORDS.SFW) pool = CONFIG.MOOD_WORDS.NSFW;
    return pick(pool);
  }
  function showSnippet(layer) {
    if (!State.showSnippet) return;
    const pool = CONFIG.SNIPPETS[layer] || CONFIG.SNIPPETS.SFW;
    const p = document.createElement('div');
    p.className = 'snip';
    p.textContent = '✦ ' + pick(pool);
    const app = $('#app');
    if (app) { app.appendChild(p); setTimeout(() => { p.style.opacity = '0'; setTimeout(() => p.remove(), 400); }, 4800); }
  }
  function playSound(kind) {
    if (!State.sound) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const ctx = window.__actx || (window.__actx = new AC());
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      const freq = { tap: 620, ok: 880, done: 990, stamp: 1100 }[kind] || 660;
      o.frequency.value = freq; o.type = 'sine';
      const vol = (State.volume != null ? State.volume : 80) / 100 * 0.07;
      g.gain.setValueAtTime(vol, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.16);
      o.start(); o.stop(ctx.currentTime + 0.16);
    } catch (e) { /* 音频不可用忽略 */ }
  }
  function earnStamp(key) {
    if (State.stamps && State.stamps[key]) return;
    State.stamps = State.stamps || {};
    State.stamps[key] = true;
    setTimeout(() => toast('获得印章 ' + (CONFIG.STAMPS[key] || '🏅') + '（' + key + '）', 'success'), 400);
    playSound('stamp');
    saveNow();
  }

  /* 记忆摘要（用已答的少量关键题生成一句话） */
  function makeMemorySummary() {
    const name = hasAnswer(State.answers[1]) ? String(State.answers[1]) : '';
    const gender = State.meta.gender || '';
    const race = State.meta.race || '';
    const parts = [];
    if (name) parts.push('姓名 ' + name);
    if (gender) parts.push(gender);
    if (race) parts.push(race);
    const done = ENGINE.countProgress(State.plan, State.answers).done;
    return (parts.join(' · ') || '未命名') + '（已答 ' + done + ' 题）';
  }

  /* 自动记忆弹窗（A）：达到频率且未提示过 */
  function maybeAutoMemory() {
    const freq = State.memoryFreq;
    if (!freq) return;
    const done = ENGINE.countProgress(State.plan, State.answers).done;
    if (done > 0 && done % freq === 0 && State.memNotified < done) {
      State.memNotified = done;
      UI.showModal('💾 存进记忆？',
        `<p class="text-soft">已经认真答完 <b style="color:var(--primary)">${done}</b> 题啦～<br>要把现在的进度存进记忆吗？之后整理完整角色会更方便哦。</p>`,
        `<button class="btn btn-primary" onclick="App.saveMemory(true)">存进记忆</button>
         <button class="btn btn-ghost" onclick="UI.closeModal()">这次跳过</button>
         <button class="btn btn-ghost" onclick="App.disableMemory();UI.closeModal()">以后不再提醒</button>`);
    }
  }

  /* ===== 设置面板绑定 ===== */
  function setVal(key, rawVal) {
    // 按 key 类型解析
    if (key === 'animLevel' || key === 'memoryFreq' || key === 'fontScale') State[key] = parseInt(rawVal, 10);
    else if (key === 'btnRadius') State[key] = rawVal === '' ? null : parseInt(rawVal, 10);
    else State[key] = rawVal;
  }
  function bindSettings() {
    const modal = $('#modal-overlay');
    // 分组按钮
    $$('[data-set^="grp:"]').forEach(grp => {
      const key = grp.getAttribute('data-set').slice(4);
      const btns = grp.querySelectorAll('.set-opt');
      btns.forEach(btn => btn.onclick = () => {
        setVal(key, btn.getAttribute('data-val'));
        btns.forEach(b => b.classList.toggle('on', b === btn));
        applyTheme(); applyStyle(); scheduleSave();
        if (key === 'flowMode' || key === 'reduceMotion' || key === 'animLevel') toast('已更新，渲染即时生效', 'warn');
      });
    });
    // 开关
    $$('[data-set^="chk:"]').forEach(inp => inp.onchange = () => {
      const key = inp.getAttribute('data-set').slice(4);
      State[key] = inp.checked;
      applyTheme(); applyStyle(); scheduleSave();
      if (key === 'musicOn') { if (State.musicOn) playMusic(); else { const a = getAudio(); if (a) a.pause(); } renderMusicPlayer(); }
    });
    // 滑块
    $$('[data-set^="rng:"]').forEach(inp => inp.oninput = () => {
      const key = inp.getAttribute('data-set').slice(4);
      State[key] = parseInt(inp.value, 10);
      const b = inp.parentElement.querySelector('b');
      if (b) b.textContent = inp.value + (inp.getAttribute('data-set').includes('volume') || inp.getAttribute('data-set').includes('vibPower') ? '%' : '');
      scheduleSave();
    });
    // CSS
    const css = $('#modal-body [data-set="css:customCSS"]');
    if (css) css.oninput = () => { State.customCSS = css.value; applyCustomCSS(); scheduleSave(); };
    // 完成
    const done = $('#btn-set-done');
    if (done) done.onclick = () => { saveNow(); UI.closeModal(); toast('设置已保存 ⚙️', 'success'); };
    // 导出设置
    const ex = $('#btn-export-set');
    if (ex) ex.onclick = () => {
      const keys = ['style', 'theme', 'darkMode', 'fontScale', 'btnRadius', 'animLevel', 'typeSpeed', 'reduceMotion', 'flowMode', 'fpsShow', 'useVirtualList', 'sound', 'volume', 'vib', 'vibPower', 'showSnippet', 'quote', 'showTheater', 'showAvatar', 'showStamps', 'showScroll', 'showPrivacy', 'showBg', 'memoryFreq', 'autoSave', 'customCSS', 'lang', 'season', 'vibPower'];
      const payload = { format: 'aira-settings-v1', version: CONFIG.VERSION, data: {} };
      keys.forEach(k => payload.data[k] = State[k]);
      downloadBlob(JSON.stringify(payload, null, 2), '搭角色设置.json', 'application/json');
      log('导出设置'); saveNow();
    };
    // 导入设置
    const im = $('#btn-import-set');
    if (im) im.onclick = () => {
      const fi = document.createElement('input');
      fi.type = 'file'; fi.accept = '.json,application/json';
      fi.onchange = () => {
        const f = fi.files[0]; if (!f) return;
        const rd = new FileReader();
        rd.onload = () => {
          try {
            const j = JSON.parse(rd.result);
            const data = j.data || j;
            Object.keys(data).forEach(k => { if (k in State) State[k] = data[k]; });
            applyTheme(); applyStyle(); saveNow(); render();
            toast('设置已导入 ✅', 'success');
          } catch (e) { toast('设置文件无效', 'error'); }
        };
        rd.readAsText(f);
      };
      fi.click();
    };
    // 重置外观
    const rs = $('#btn-reset-style');
    if (rs) rs.onclick = () => {
      State.style = 'sakura'; State.theme = '祈宝粉'; State.darkMode = false; State.fontScale = 1;
      State.btnRadius = null; State.animLevel = 2; State.typeSpeed = '中'; State.reduceMotion = false;
      State.flowMode = '标准'; State.customCSS = '';
      applyTheme(); applyStyle(); scheduleSave(); App.openSettings();
      toast('外观已重置 🌸', 'success');
    };
    // 一键省电
    const eco = $('#btn-eco');
    if (eco) eco.onclick = () => {
      State.darkMode = true; State.reduceMotion = true; State.animLevel = 0; State.flowMode = '流畅';
      applyTheme(); applyStyle(); scheduleSave();
      toast('省电模式开启 🔋（暗色 + 少动画）', 'success');
    };
  }

  /* ===== 背景音乐播放器 ===== */
  function getAudio() { return document.getElementById('music-audio'); }
  function currentTrack() { return CONFIG.MUSIC_PLAYLIST[State.musicIndex] || CONFIG.MUSIC_PLAYLIST[0]; }
  function renderMusicPlayer() {
    const mp = $('#music-player');
    if (!mp) return;
    const a = getAudio();
    if (!State.musicOn) { mp.style.display = 'none'; if (a) a.pause(); return; }
    mp.style.display = 'flex';
    const t = currentTrack();
    const mt = $('#mp-title'); if (mt) mt.textContent = t.title;
    const ma = $('#mp-artist'); if (ma) ma.textContent = t.artist;
    const mb = $('#mp-toggle'); if (mb) mb.textContent = (a && !a.paused) ? '⏸' : '▶';
  }
  function playMusic() {
    const a = getAudio(); if (!a) return;
    const t = currentTrack();
    if (a.getAttribute('src') !== t.url) a.src = t.url;
    a.volume = Math.max(0.1, (State.volume != null ? State.volume : 80) / 100);
    const pr = a.play();
    if (pr && pr.then) pr.then(() => renderMusicPlayer()).catch(() => toast('播放失败，检查网络或曲库链接', 'error'));
    else renderMusicPlayer();
  }
  function toggleMusic() {
    const a = getAudio(); if (!a) return;
    if (!State.musicOn) { State.musicOn = true; saveNow(); renderMusicPlayer(); playMusic(); toast('🎵 背景音乐开', 'success'); }
    else { State.musicOn = false; saveNow(); a.pause(); renderMusicPlayer(); toast('🔇 背景音乐关', 'warn'); }
  }
  function nextMusic() {
    State.musicIndex = (State.musicIndex + 1) % CONFIG.MUSIC_PLAYLIST.length;
    saveNow(); playMusic();
  }
  function initMusic() {
    const a = getAudio(); if (!a) return;
    a.addEventListener('ended', () => nextMusic());
    a.addEventListener('play', () => renderMusicPlayer());
    a.addEventListener('pause', () => renderMusicPlayer());
    const t = $('#mp-toggle'); if (t) t.onclick = () => toggleMusic();
    const n = $('#mp-next'); if (n) n.onclick = () => nextMusic();
    const c = $('#mp-close'); if (c) c.onclick = () => { State.musicOn = false; saveNow(); renderMusicPlayer(); toast('🔇 背景音乐关', 'warn'); };
    renderMusicPlayer();
  }

  /* ===== UI 工具 ===== */
  const UI = {
    closeModal() { $('#modal-overlay').style.display = 'none'; },
    showModal(title, bodyHTML, footerHTML = '') {
      $('#modal-title').textContent = title;
      $('#modal-body').innerHTML = bodyHTML;
      $('#modal-footer').innerHTML = footerHTML;
      $('#modal-overlay').style.display = 'flex';
      const firstBtn = $('#modal-footer button');
      if (firstBtn) setTimeout(() => firstBtn.focus(), 50);
    },
  };

  /* ===== 初始化 ===== */
  document.addEventListener('DOMContentLoaded', () => {
    // 合并题库扩展（题目扩充 + 选项介绍）
    applyQuestionExt();
    // 弹窗关闭按钮 + ESC
    const mc = $('#modal-close');
    if (mc) mc.onclick = () => UI.closeModal();
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && $('#modal-overlay').style.display === 'flex') { UI.closeModal(); return; }
      const tag = (e.target.tagName || '').toLowerCase();
      const inField = tag === 'input' || tag === 'textarea' || tag === 'select';
      // Ctrl+Enter / Cmd+Enter 提交当前题（任何聚焦）
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && State.stage === 'ask' && State.askMode === 'single') {
        e.preventDefault(); App.submitSingle(); return;
      }
      if (inField) return;
      // 电脑端快捷键：← 上题 / → 下题 / / 搜索
      if (State.stage === 'ask' && State.askMode === 'single') {
        if (e.key === 'ArrowLeft') { e.preventDefault(); App.prevQuestion(); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); App.submitSingle(); }
        else if (e.key === '/') { e.preventDefault(); const q = $('#q-search'); if (q) q.focus(); }
      }
    });
    // 尝试恢复进度
    const saved = STORE.load();
    if (saved && saved.stage && saved.stage !== 'welcome' && saved.plan && saved.plan.length) {
      Object.assign(State, saved);
      State.meta = Object.assign(ENGINE.defaultMeta(), saved.meta || {});
      if (!State.testMsgs) State.testMsgs = [];
    }
    // 分享链接恢复（#s=base64）
    try {
      if (location.hash && location.hash.indexOf('#s=') === 0) {
        const payload = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(3)))));
        if (payload && payload.answers && payload.meta) {
          Object.assign(State, STORE.defaultState(), {
            meta: Object.assign(ENGINE.defaultMeta(), payload.meta),
            plan: Array.isArray(payload.plan) && payload.plan.length ? payload.plan : ENGINE.buildPlan(payload.meta, window.QUESTIONS),
            answers: Object.assign({}, payload.answers),
            stage: payload.stage && payload.stage !== 'welcome' ? payload.stage : 'ask',
          });
          toast('已从分享链接恢复进度 🔗', 'success');
        }
      }
    } catch (e) { /* 链接无效忽略 */ }
    // 顶部工具按钮
    const bt = $('#btn-theme'); if (bt) bt.onclick = () => App.toggleTheme();
    const bd = $('#btn-dark'); if (bd) bd.onclick = () => App.toggleDark();
    const bl = $('#btn-lang'); if (bl) bl.onclick = () => App.setLang();
    const ba = $('#btn-about'); if (ba) ba.onclick = () => App.openAbout();
    const bs = $('#btn-settings'); if (bs) bs.onclick = () => App.openSettings();
    // 侧边栏开关
    const bm = $('#btn-menu'); if (bm) bm.onclick = () => App.openSidebar();
    const sc = $('#side-close'); if (sc) sc.onclick = () => App.closeSidebar();
    // 离线/在线提示
    const onlineToast = () => toast(navigator.onLine ? '网络已恢复，可正常使用 🌐' : '已离线，功能不受影响（存档在本地）', 'warn');
    window.addEventListener('online', onlineToast);
    window.addEventListener('offline', onlineToast);
    render();
    // 版本迁移提示（检测到旧 key 迁移，或版本不同）
    try {
      const old = localStorage.getItem(STORE.OLD_KEY);
      if (old) setTimeout(() => toast('已从 V4.1 迁移存档，欢迎使用 V4.2 ✨', 'success'), 600);
    } catch (e) { /* 忽略 */ }
    // FPS 性能面板
    let fpsCount = 0, fpsLast = performance.now();
    (function fpsLoop() {
      fpsCount++;
      const now = performance.now();
      if (now - fpsLast >= 1000) {
        const fps = Math.round(fpsCount * 1000 / (now - fpsLast));
        fpsCount = 0; fpsLast = now;
        const fp = $('#fps-panel');
        if (fp) fp.textContent = fps + ' FPS';
      }
      requestAnimationFrame(fpsLoop);
    })();
    // 背景音乐播放器
    initMusic();
    // 初始应用风格
    applyStyle();
    // 深色跟随系统（仅首次无存档时）
    try {
      if (!localStorage.getItem(STORE.STORAGE_KEY)) {
        const sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (sysDark) { State.darkMode = true; applyTheme(); }
      }
    } catch (e) { /* 忽略 */ }
    // 加载屏淡出
    const splash = document.getElementById('splash');
    if (splash) setTimeout(() => { splash.classList.add('hide'); setTimeout(() => splash.remove(), 500); }, 500);
    // 崩溃恢复：出错时先保存进度
    window.addEventListener('error', () => { try { saveNow(); } catch (e) { /* 忽略 */ } });
  });

  /* 浏览器后退/前进支持（popstate 恢复阶段） */
  window.addEventListener('popstate', e => {
    const s = e.state && e.state.stage;
    if (s && s !== State.stage) {
      State.stage = s;
      lastPushedStage = s;
      render();
    }
  });

  /* 未完成提示：关闭/刷新前提醒（有进度且未到欢迎页） */
  window.addEventListener('beforeunload', e => {
    const hasProgress = State.plan && State.plan.length > 0 && State.stage && State.stage !== 'welcome';
    if (hasProgress) { e.preventDefault(); e.returnValue = ''; }
  });

  /* 全局错误降级页（避免白屏） */
  window.addEventListener('error', ev => {
    const ae = document.getElementById('app-error');
    if (ae) {
      ae.style.display = 'flex';
      document.getElementById('app').style.display = 'none';
      const d = document.getElementById('app-error-detail');
      if (d) d.textContent = '错误信息：' + (ev.message || '未知错误');
    }
  });

  /* 显式挂载全局 */
  window.App = App;
  window.State = State;
  window.UI = UI;
  window.render = render;
  window.getQuestionAnswer = getQuestionAnswer;
})();

</script>
<div id="fps-panel">60 FPS</div>
<div id="music-player" style="display:none">
  <button class="mp-btn" id="mp-toggle" aria-label="播放/暂停">▶</button>
  <div class="mp-info"><span class="mp-title" id="mp-title">背景音乐</span><span class="mp-artist" id="mp-artist"></span></div>
  <button class="mp-btn" id="mp-next" aria-label="下一首">⏭</button>
  <button class="mp-btn" id="mp-close" aria-label="关闭播放器">✕</button>
</div>
<audio id="music-audio" preload="none"></audio>
</body>
</html>
